<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HazPost — Hazmat Tools for Drivers</title>
<meta name="description" content="Hazmat placarding and lookup tools for truck drivers, built to work with no signal.">
<meta name="theme-color" content="#14171C">
<!-- All install paths are relative: HazPost is a GitHub Pages project site
     under /HazPost/, so a leading slash would resolve to the domain root. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<!-- iOS ignores the manifest for Add to Home Screen on anything before 16.4,
     and never reads it for the icon. These three carry the install there. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HazPost">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171C; --panel:#1C2129; --panel2:#232A34; --line:#2E3743;
  --ink:#EDF0F4; --dim:#8B96A5; --faint:#5A6473;
  --flam:#C8102E; --oxy:#FFB612; --wet:#0F5FBF; --gas:#1E8A44;
  --expl:#FF6720; --tox:#F2F2F2; --brand:#FFB612;
  --ok:#3BAA5C; --warn:#FFB612; --bad:#E5484D;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;font-size:16px;overscroll-behavior:none}
.mono{font-family:'Roboto Mono',monospace}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* header */
header{padding:18px 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:20}
.logo-d{width:34px;height:34px;position:relative;flex:none}
.logo-d::before{content:"";position:absolute;inset:3px;background:var(--brand);transform:rotate(45deg);border-radius:4px}
.logo-d::after{content:"HZ";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 13px 'Barlow Condensed';color:#14171C;letter-spacing:.5px}
h1{font:700 22px/1 'Barlow';letter-spacing:.2px}
h1 span{color:var(--brand)}
.sub{font-size:12.5px;color:var(--dim);margin-top:3px}
.back{background:none;border:none;color:var(--brand);font:600 15px 'Barlow';padding:6px 10px 6px 0;cursor:pointer;display:none;align-items:center;gap:4px}
main{flex:1;padding:0 18px calc(40px + env(safe-area-inset-bottom, 0px))}

/* offline indicator — a strip under the header, only while actually offline */
.offbar{display:flex;align-items:center;gap:9px;margin:0 18px 12px;padding:8px 11px;background:#2A2418;border:1px solid #5A4A1E;border-radius:10px;font-size:12.5px;color:#E8C877;line-height:1.4}
.offbar[hidden]{display:none}
.offbar .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 0 3px rgba(255,182,18,.16)}
.offbar b{font-weight:700;color:#FFCE5C}
.offbar .when{color:#A8936A;white-space:nowrap}

/* module grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;cursor:pointer;position:relative;transition:transform .08s ease;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:scale(.97)}
.tile .td{width:26px;height:26px;position:relative;margin-bottom:10px}
.tile .td::before{content:"";position:absolute;inset:2px;transform:rotate(45deg);border-radius:3px;background:var(--tc,#39424F)}
.tile h3{font:700 16.5px 'Barlow';letter-spacing:.2px}
.tile p{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35}
.tile .cfr{font:500 10.5px 'Roboto Mono';color:var(--faint);margin-top:8px}
.tile.stub{opacity:.62}
.tile.stub::after{content:"NEXT";position:absolute;top:12px;right:12px;font:700 9.5px 'Barlow Condensed';letter-spacing:1.2px;color:var(--faint);border:1px solid var(--line);padding:3px 6px;border-radius:20px}
.tile.live::after{content:"LIVE";position:absolute;top:12px;right:12px;font:700 9.5px 'Barlow Condensed';letter-spacing:1.2px;color:#14171C;background:var(--ok);padding:3px 7px;border-radius:20px}

/* tabs */
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:6px 0 16px}
.tabs button{flex:1;border:none;background:none;color:var(--dim);font:600 14.5px 'Barlow';padding:9px 0;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--ink)}

/* load builder */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h4{font:700 13px 'Barlow Condensed';letter-spacing:1.4px;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.row{display:flex;gap:8px;margin-bottom:8px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:500 15px 'Barlow';padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--brand)}
input.mono{font:500 15px 'Roboto Mono'}
.btn{background:var(--brand);color:#14171C;border:none;border-radius:10px;font:700 15px 'Barlow';padding:12px 16px;cursor:pointer;width:100%}
.btn:active{opacity:.85}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.hint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.4}
.sugg{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-top:-4px;margin-bottom:8px;max-height:180px;overflow:auto;display:none}
.sugg div{padding:10px 12px;font-size:13.5px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:last-child{border-bottom:none}
.sugg .u{font:600 13px 'Roboto Mono';color:var(--brand);margin-right:8px}

/* load lines */
.line-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.line-item .un{font:700 14px 'Roboto Mono';color:var(--brand);flex:none}
.line-item .nm{flex:1;min-width:0}
.line-item .nm b{display:block;font:600 14px 'Barlow';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line-item .nm span{font-size:11.5px;color:var(--dim)}
.line-item .wt{font:500 13px 'Roboto Mono';color:var(--ink);flex:none}
.line-item .x{background:none;border:none;color:var(--faint);font-size:18px;cursor:pointer;flex:none;padding:2px 4px}
.t1tag{font:700 9px 'Barlow Condensed';letter-spacing:1px;background:var(--bad);color:#fff;padding:2px 5px;border-radius:4px;margin-left:6px;vertical-align:2px}

/* trailer result */
.trailer{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.trailer h4{font:700 13px 'Barlow Condensed';letter-spacing:1.4px;color:var(--dim);text-transform:uppercase}
.trailer .tr-body{background:repeating-linear-gradient(90deg,var(--panel2) 0 46px,var(--line) 46px 47px);border:2px solid var(--line);border-radius:8px;min-height:120px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:18px;padding:20px 10px;flex-wrap:wrap}
.tr-none{color:var(--faint);font-size:14px}
.plc{width:86px;height:86px;position:relative;flex:none}
.plc .dia{position:absolute;inset:6px;transform:rotate(45deg);border-radius:6px;border:2.5px solid rgba(0,0,0,.55);overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.plc .fill{position:absolute;width:141.4%;height:141.4%;left:-20.7%;top:-20.7%;transform:rotate(-45deg)}
.plc .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;text-align:center}
.plc .w{font:800 11px 'Barlow Condensed';letter-spacing:.6px;line-height:1.05;text-transform:uppercase}
.plc .n{font:800 17px 'Barlow Condensed';margin-top:2px}
.plc .cap{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font:600 10px 'Barlow Condensed';letter-spacing:1px;color:var(--dim);text-transform:uppercase}

/* reasoning */
.why{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}
.why.ok{border-color:var(--ok)} .why.warn{border-color:var(--warn)} .why.bad{border-color:var(--bad)}
.why p{font-size:14px;line-height:1.45}
.why .cite{display:inline-block;font:500 11px 'Roboto Mono';color:var(--faint);margin-top:3px}
.optlbl{font:700 12px 'Barlow Condensed';letter-spacing:1.4px;color:var(--brand);text-transform:uppercase;margin:14px 0 4px}

/* lookup detail */
.lk{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:10px}
.lk .un{font:700 18px 'Roboto Mono';color:var(--brand)}
.lk h5{font:700 17px 'Barlow';margin:4px 0 10px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-weight:600;text-align:right}
.pill{display:inline-block;font:700 11px 'Barlow Condensed';letter-spacing:1px;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.pill.t1{background:var(--bad);color:#fff}.pill.t2{background:var(--panel);border:1px solid var(--line);color:var(--dim)}

/* stub view */
.stubview{text-align:center;padding:60px 20px;color:var(--dim)}
.stubview .big-d{width:64px;height:64px;position:relative;margin:0 auto 18px;opacity:.5}
.stubview .big-d::before{content:"";position:absolute;inset:5px;transform:rotate(45deg);border-radius:6px;border:2.5px dashed var(--faint)}
.stubview h3{font:700 20px 'Barlow';color:var(--ink);margin-bottom:8px}
.stubview p{font-size:14px;line-height:1.5;max-width:320px;margin:0 auto}
.stubview .cfr{font:500 12px 'Roboto Mono';color:var(--faint);margin-top:14px;display:block}

.disclaimer{font-size:11.5px;color:var(--faint);line-height:1.5;padding:14px 4px 0;border-top:1px solid var(--line);margin-top:20px}

/* shipping papers module */
.desc{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
.desc-id{font:700 10px 'Barlow Condensed';letter-spacing:1.2px;color:var(--faint);text-transform:uppercase;margin-bottom:7px}
.bd{font:600 14px 'Roboto Mono';line-height:1.8;word-break:break-word}
.bd .e-i{color:var(--brand)}
.bd .e-s{color:var(--ink)}
.bd .e-h{color:#7FD1E8}
.bd .e-p{color:#C9A7E8}
.bd .e-c{color:var(--faint)}
.bd .e-gap{background:#3A2A15;border:1px dashed #6B5520;color:#E8C98A;padding:1px 6px;border-radius:4px;font-size:12.5px}
.seq{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.seq span{font:700 9px 'Barlow Condensed';letter-spacing:.9px;padding:2px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line);color:var(--dim);text-transform:uppercase}
.pflag{border-left:3px solid var(--line);padding:5px 0 5px 11px;margin-top:10px}
.pflag p{font-size:12.5px;line-height:1.5;color:#C6CED8}
.pflag .cite{display:inline-block;font:500 10.5px 'Roboto Mono';color:var(--faint);margin-top:3px}
.pflag.pih{border-color:var(--bad)}
.pflag.gap{border-color:var(--brand)}
.pflag.warn{border-color:var(--warn)}
.pflag.ok{border-color:var(--ok)}
.pflag .mono{font:500 11.5px 'Roboto Mono';color:#A9B3C0}
.rule.a{border-color:var(--brand)}
.rule ul{margin:6px 0 0 17px}
.rule li{font-size:13.5px;line-height:1.55;color:#C6CED8;margin-bottom:4px}

/* on the road module */
.tierbar{border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1px solid;display:flex;gap:11px;align-items:flex-start}
.tierbar.e{background:#2A1618;border-color:#6B2429}
.tierbar.o{background:#1B2430;border-color:#31465E}
.tierbar .badge{font:800 10px 'Barlow Condensed';letter-spacing:1px;padding:4px 7px;border-radius:5px;flex:none;text-transform:uppercase;margin-top:1px}
.tierbar.e .badge{background:var(--bad);color:#fff}
.tierbar.o .badge{background:#3C566F;color:#DCE9F5}
.tierbar>b{display:block;font:700 15px 'Barlow';margin-bottom:2px}
.tierbar p{font-size:13px;line-height:1.45;color:#C6CED8}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 46%;border:1px solid var(--line);background:var(--bg);color:var(--dim);font:600 13px 'Barlow';padding:11px 8px;border-radius:10px;cursor:pointer;line-height:1.25;text-align:left}
.seg button.on{background:var(--panel2);color:var(--ink);border-color:var(--brand)}
.opshead{border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid}
.opshead.bad{background:#2A1618;border-color:#6B2429}
.opshead.ok{background:#16241A;border-color:#265731}
.opshead>b{display:block;font:800 16px 'Barlow';margin-bottom:5px}
.opshead.bad b{color:#FF9CA1} .opshead.ok b{color:#7FD69B}
.opshead p{font-size:13.5px;line-height:1.5;color:#DCE2EA}
.rule{border-left:3px solid var(--line);padding:6px 0 6px 12px;margin:12px 0}
.rule.stop{border-color:var(--bad)} .rule.care{border-color:var(--brand)} .rule.ok{border-color:var(--ok)}
.rule>b{display:block;font:700 14.5px 'Barlow';margin-bottom:3px}
.rule p{font-size:13.5px;line-height:1.5;color:#C6CED8}
.rule .cite{display:inline-block;font:500 11px 'Roboto Mono';color:var(--faint);margin-top:5px}
.verb{background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--faint);border-radius:0 8px 8px 0;padding:8px 10px;margin-top:8px}
.verb>b{display:block;font:500 10px 'Roboto Mono';color:var(--faint);letter-spacing:.3px;margin-bottom:4px}
.verb p{font-size:12.5px;line-height:1.5;color:#A9B3C0;font-style:italic}
.eyebox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:10px}
.eyebox b{font:700 10px 'Barlow Condensed';letter-spacing:1.2px;color:var(--brand);display:block;margin-bottom:4px;text-transform:uppercase}
.eyebox p{font-size:12.5px;color:#B4BDC9;line-height:1.5}
.limitbox{border:1px dashed var(--line);border-radius:10px;padding:11px 12px;margin-top:12px}
.limitbox p{font-size:12.5px;color:var(--dim);line-height:1.55}
.limitbox b{color:var(--ink)}
.onboard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:8px}
.onboard b{font:700 9.5px 'Barlow Condensed';letter-spacing:1.2px;color:var(--bad);display:block;margin-bottom:3px;text-transform:uppercase}
.onboard.ok b{color:var(--ok)}
.onboard p{font:600 12.5px 'Roboto Mono';color:#C6CED8;line-height:1.45}
.refp{display:flex;gap:9px;padding:6px 0;border-top:1px solid var(--line)}
.refp:first-child{border-top:none}
.refp .pid{font:600 11.5px 'Roboto Mono';color:var(--brand);flex:none;min-width:52px}
.verbfold{margin-top:8px}
.verbfold>summary{font:500 11px 'Roboto Mono';color:var(--brand);cursor:pointer;padding:5px 0;list-style:none;opacity:.85}
.verbfold>summary::-webkit-details-marker{display:none}
.verbfold>summary::before{content:"▸ ";font-size:10px}
.verbfold[open]>summary::before{content:"▾ "}
.refp p{font-size:13px;line-height:1.55;color:#C6CED8}

/* what you carry module */
.item{display:flex;gap:11px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:8px}
.item .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none;margin-top:6px}
.item .dot.cond{background:var(--expl)}
.item .dot.off{background:var(--faint)}
.item .in>b{display:block;font:700 14.5px 'Barlow';margin-bottom:2px}
.item p{font-size:12.8px;line-height:1.45;color:#C6CED8}
.item p+p{margin-top:5px}
.item .cite{display:block;font:500 10.5px 'Roboto Mono';color:var(--faint);margin-top:4px}
.item .in{flex:1;min-width:0}
.cond-tag{display:inline-block;font:700 9px 'Barlow Condensed';letter-spacing:.9px;background:var(--expl);color:#14171C;padding:2px 5px;border-radius:4px;margin-left:6px;vertical-align:1.5px}
.not{border:1px dashed var(--line);border-radius:11px;padding:12px}
.not>b{display:block;font:700 14px 'Barlow';color:var(--ink);margin-bottom:4px}
.not p{font-size:12.8px;color:var(--dim);line-height:1.5}
.not p+p{margin-top:6px}
.not .cite{display:block;font:500 10.5px 'Roboto Mono';color:var(--faint);margin-top:6px}

/* the expiry tracker */
.exp{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:8px}
.exp .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exp b{font:700 14.5px 'Barlow'}
.exp input[type=date]{width:150px;flex:none;font:500 13px 'Roboto Mono';padding:8px 9px}
.days{display:inline-block;font:700 12px 'Barlow Condensed';letter-spacing:.8px;padding:3px 9px;border-radius:20px;text-transform:uppercase;margin-top:9px}
.days.ok{background:#16241A;color:#7FD79A;border:1px solid #265731}
.days.soon{background:#2A2015;color:#FFD98A;border:1px solid #6B5520}
.days.bad{background:#2A1618;color:#FF9CA1;border:1px solid #6B2429}
.days.none{background:var(--panel);color:var(--faint);border:1px solid var(--line)}
.exp .due{font:500 11.5px 'Roboto Mono';color:var(--dim);margin-left:8px}
.exp .note{font-size:12.3px;color:var(--dim);line-height:1.5;margin-top:8px}
.exp .note p+p{margin-top:7px}
.exp .note b{font:700 12.3px 'Barlow';color:#C6CED8;display:inline}
.exp .cite{display:block;font:500 10.5px 'Roboto Mono';color:var(--faint);margin-top:5px}

/* incident response module — the call blocks are never gated behind a question */
.call{display:flex;align-items:center;gap:13px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:9px;text-decoration:none;color:inherit}
.call.urgent{background:#2A1618;border-color:#8B2E34}
.call .n{font:800 21px 'Barlow Condensed';letter-spacing:.5px;flex:none;width:74px;color:var(--brand);line-height:1.05}
.call.urgent .n{color:#FF7A80;font-size:30px}
.call .t>b{display:block;font:700 15px 'Barlow'}
.call .t span{font-size:12.5px;color:var(--dim);line-height:1.4;display:block;margin-top:2px}
.call .t span.num{font:600 13px 'Roboto Mono';color:#C6CED8}
.paper{border:2px dashed #6B5520;background:#2A2015;border-radius:12px;padding:14px;margin-bottom:9px}
.paper>b{display:block;font:700 15px 'Barlow';color:#FFD98A;margin-bottom:3px}
.paper p{font-size:13px;color:#E0CFA8;line-height:1.5}
.paper .cite,.myth .cite{display:inline-block;font:500 11px 'Roboto Mono';color:var(--faint);margin-top:6px}
.myth{background:#1B2430;border:1px solid #31465E;border-radius:12px;padding:14px;margin-bottom:12px}
.myth>b{display:block;font:700 15px 'Barlow';color:#9FD0F0;margin-bottom:5px}
.myth p{font-size:13.5px;line-height:1.55;color:#C6D6E4}
.myth p+p{margin-top:7px}
.carbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:9px}
.carbox>b{display:block;font:700 15px 'Barlow';margin-bottom:3px}
.carbox p{font-size:12.5px;color:var(--dim);line-height:1.45}
.carrow{display:flex;gap:8px;margin-top:10px}
.carrow .btn{width:auto;flex:none;padding:11px 15px}
.linkbtn{background:none;border:none;color:var(--brand);font:600 12px 'Barlow';padding:4px 0;cursor:pointer;text-decoration:underline}

/* the trigger checklist */
.trig{display:flex;gap:11px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:8px;cursor:pointer}
.trig.on{border-color:var(--bad);background:#2A1618}
.trig.judg{border-style:dashed}
.trig.judg.on{border-color:var(--brand);background:#2A2015}
.trig .box{width:21px;height:21px;border-radius:5px;border:2px solid var(--faint);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font:800 13px 'Barlow';color:transparent}
.trig.on .box{background:var(--bad);border-color:var(--bad);color:#fff}
.trig.judg.on .box{background:var(--brand);border-color:var(--brand);color:#111}
.trig p{font-size:13.5px;line-height:1.45}
.trig .cite{display:block;font:500 10.5px 'Roboto Mono';color:var(--faint);margin-top:3px}

<body>
<div class="app">
  <header>
    <button class="back" id="backBtn" onclick="go('home')">‹ Back</button>
    <div class="logo-d" id="logoD"></div>
    <div>
      <h1>Haz<span>Post</span></h1>
      <div class="sub" id="subTitle">Hazmat tools built for the driver's seat</div>
    </div>
  </header>
  <div class="offbar" id="offBar" hidden></div>
  <main id="main"></main>
</div>

<script>
/* The build a driver is running, shown in the home footer.
   Bump this and VERSION in sw.js together on every deploy — see README. */
const APP_VERSION = "0.9.1";

/* ---------------- DATA: the 172.101 table, fetched from hazmat.json ---------------- */
const DATA_URL = "hazmat.json";
const SEG_URL = "segregation.json";
const OPS_URL = "ops.json";
const PAPERS_URL = "papers.json";
const INCIDENT_URL = "incident.json";
const CARRY_URL = "carry.json";
let HM = [];           /* material records */
let HMMETA = null;     /* provenance: source, cfrDate, generated */
let SEG = null;        /* 177.848 tables; null if segregation.json didn't load */
let segError = "";
let OPS = null;        /* Part 397 Subpart A; null if ops.json didn't load */
let opsError = "";
let PAPERS = null;     /* 172 subparts C and G + 177.817 */
let papersError = "";
let INC = null;        /* 171.15 and 171.16 */
let incError = "";
let CAR = null;        /* 172.602/704, 383.93/141/153, 391.41/43/45, 397.19, 1572.13 */
let carError = "";
let dataState = "loading";   /* loading | ready | error */
let dataError = "";

async function loadData(){
  dataState="loading"; dataError=""; render();
  /* Incident Response loads first and outside the chain below. Everything
     else in HazPost is an aid a driver can do without for a day; the phone
     numbers are not, and a failure to load the 172.101 table must not be
     able to shut the door on them. */
  await loadIncident();
  try{
    const res = await fetch(DATA_URL, {cache:"no-cache"});
    if(!res.ok) throw new Error(`the server answered ${res.status} ${res.statusText||""}`.trim());
    let doc;
    try{ doc = await res.json(); }
    catch(e){ throw new Error("hazmat.json is not valid JSON"); }
    const recs = Array.isArray(doc) ? doc : doc && doc.records;
    if(!Array.isArray(recs)) throw new Error("hazmat.json has no records array");
    if(!recs.length) throw new Error("hazmat.json contains zero material records");
    HM = recs;
    HMMETA = Array.isArray(doc) ? null : doc;
    dataState="ready";
    /* only once the table is in hand — restored lines are re-classified from it */
    restoreLoad();
    /* Segregation data is loaded separately and is not fatal: losing it must
       not take the placarding module down with it. The segregation module
       says so for itself if this fails. */
    await loadSeg();
    await loadOps();
    await loadPapers();
    await loadCarry();
  }catch(e){
    dataError = (e && e.message) ? e.message : String(e);
    dataState="error";
  }
  await readCacheMeta();
  render();
  paintOffline();
}

async function loadSeg(){
  segError = "";
  try{
    const res = await fetch(SEG_URL, {cache:"no-cache"});
    if(!res.ok) throw new Error(`the server answered ${res.status} ${res.statusText||""}`.trim());
    const doc = await res.json();
    if(!Array.isArray(doc.table) || doc.table.length!==18) throw new Error("segregation table is not 18 rows");
    if(!Array.isArray(doc.categories) || doc.categories.length!==18) throw new Error("segregation categories are not 18");
    SEG = doc;
  }catch(e){
    SEG = null;
    segError = (e && e.message) ? e.message : String(e);
  }
}

async function loadOps(){
  opsError = "";
  try{
    const res = await fetch(OPS_URL, {cache:"no-cache"});
    if(!res.ok) throw new Error(`the server answered ${res.status} ${res.statusText||""}`.trim());
    const doc = await res.json();
    if(!Array.isArray(doc.sections) || doc.sections.length!==11) throw new Error("Part 397 Subpart A is not 11 sections");
    OPS = doc;
  }catch(e){
    OPS = null;
    opsError = (e && e.message) ? e.message : String(e);
  }
}

async function loadPapers(){
  papersError = "";
  try{
    const res = await fetch(PAPERS_URL, {cache:"no-cache"});
    if(!res.ok) throw new Error(`the server answered ${res.status} ${res.statusText||""}`.trim());
    const doc = await res.json();
    if(!Array.isArray(doc.sections) || doc.sections.length!==9) throw new Error("expected 9 shipping-paper sections");
    PAPERS = doc;
  }catch(e){
    PAPERS = null;
    papersError = (e && e.message) ? e.message : String(e);
  }
}

async function loadIncident(){
  incError = "";
  try{
    const res = await fetch(INCIDENT_URL, {cache:"no-cache"});
    if(!res.ok) throw new Error(`the server answered ${res.status} ${res.statusText||""}`.trim());
    const doc = await res.json();
    if(!Array.isArray(doc.sections) || doc.sections.length!==2) throw new Error("expected § 171.15 and § 171.16");
    /* The checklist is built from 171.15(b). If the trigger list did not
       arrive there is nothing to build it from, and a checklist rendered
       short would read as a shorter list of reportable incidents. */
    const trig = (doc.sections.find(s=>s.n==="171.15")||{paras:[]}).paras.filter(p=>p.id.startsWith("(b)"));
    if(trig.length!==12) throw new Error("171.15(b) did not arrive with its 12 paragraphs");
    INC = doc;
  }catch(e){
    INC = null;
    incError = (e && e.message) ? e.message : String(e);
  }
}

async function loadCarry(){
  carError = "";
  try{
    const res = await fetch(CARRY_URL, {cache:"no-cache"});
    if(!res.ok) throw new Error(`the server answered ${res.status} ${res.statusText||""}`.trim());
    const doc = await res.json();
    if(!Array.isArray(doc.sections) || doc.sections.length!==10) throw new Error("expected 10 sections across PHMSA, FMCSA and TSA");
    CAR = doc;
  }catch(e){
    CAR = null;
    carError = (e && e.message) ? e.message : String(e);
  }
}

/* proper shipping names come straight out of the CFR — escape before they hit innerHTML */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* the table carries UN, NA and ID numbers — don't print "UN" over an NA number */
function idLabel(x){ return `${(x&&x.pfx)||"UN"}${x?x.un:""}`; }

/* ---------------- VERBATIM CFR TEXT ----------------
   One rule, everywhere: the plain-language line is ours and stays open; the
   verbatim paragraph it was written from sits behind a closed fold, one tap
   away, under the same grey summary line in every module. A driver learns
   once that regulatory text lives behind that line and never has to wonder
   which state they are looking at — so the fold renders closed on every
   render, remembers nothing, and makes no exceptions for blocks that seem
   short or important. Nothing is deleted: every word still ships and still
   renders.

   cfrVerb is the block itself and is only ever called by the two fold
   builders below — regulatory text has exactly one way onto the screen. */

function cfrVerb(cite, txt){
  return txt ? `<div class="verb"><b>49 CFR ${esc(cite)}</b><p>${esc(txt)}</p></div>` : "";
}

/** One cited paragraph behind a closed fold. */
function cfrFold(cite, txt){
  return txt ? `<details class="verbfold"><summary>§ ${esc(cite)} — full text</summary>${cfrVerb(cite, txt)}</details>` : "";
}

/** Several paragraphs behind one fold — a whole section, or the handful of
    paragraphs a single card rests on. `list` is [cite, text] pairs. */
function cfrFolds(label, list){
  const body = list.map(([cite, txt]) => cfrVerb(cite, txt)).filter(Boolean).join("");
  return body ? `<details class="verbfold"><summary>${esc(label)}</summary>${body}</details>` : "";
}

/* provenance line for the disclaimer */
function dataNote(){
  if(!HMMETA) return `${HM.length.toLocaleString()} entries loaded.`;
  const d = HMMETA.cfrDate ? ` as of ${HMMETA.cfrDate}` : "";
  const v = HMMETA.version ? ` (data v${HMMETA.version})` : "";
  return `Material data: ${HM.length.toLocaleString()} entries from ${HMMETA.source||"hazmat.json"}${d}${v}.`;
}

/* ---------------- OFFLINE STATUS ---------------- */
/* The service worker stamps every cache refresh into __cache-meta; the page
   reads it back so a driver in a dead zone can see how old the answer is. */
let cacheMeta = null;

async function readCacheMeta(){
  if(!("caches" in window)) return;
  try{
    const res = await caches.match(new URL("__cache-meta", location.href).toString());
    if(res) cacheMeta = await res.json();
  }catch(e){ /* storage blocked (private mode) — the indicator just omits the date */ }
}

function fmtWhen(iso){
  const d = new Date(iso);
  if(isNaN(d)) return null;
  const sameDay = d.toDateString() === new Date().toDateString();
  return sameDay
    ? `today ${d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}`
    : d.toLocaleDateString([], {day:"numeric", month:"short"});
}

function paintOffline(){
  const el = document.getElementById('offBar');
  if(!el) return;
  if(navigator.onLine){ el.hidden = true; return; }
  const gen = HMMETA && HMMETA.generated;
  const ref = cacheMeta && cacheMeta.refreshed && fmtWhen(cacheMeta.refreshed);
  el.innerHTML = `<span class="dot"></span><span><b>Offline</b> — answering from the cached 172.101 table${
    gen ? `, generated ${esc(gen)}` : ""}.${
    ref ? ` <span class="when">Cache refreshed ${esc(ref)}.</span>` : ""}</span>`;
  el.hidden = false;
}

/* ---------------- SERVICE WORKER + UPDATE CHECK ----------------

   Three version numbers live in this app and they answer three questions:

     APP_VERSION (here)          the code a driver is running
     VERSION     (sw.js)         the cache generation, forces a fresh install
     version/cfrDate (hazmat.json)  which CFR edition the table came from

   Only the first and third belong on screen; the cache generation is
   plumbing. The footer shows the build, dataNote shows the data.

   sw.js does not call skipWaiting on its own. A new worker sits in `waiting`
   until this page sends "skip", and this page only sends it when the driver
   taps the footer. That is what makes a background check safe: it can find an
   update and say so, but it cannot pull the rug on someone mid load build. */

let swReg = null;             /* registration, reachable from the footer handler */
let updateReady = false;      /* a new worker is installed and waiting */
let verState = "idle";        /* idle | checking | uptodate | ready | updating */
let verRevert = null;

/* Set by applyUpdate(), and by nothing else. It is the whole guard on the
   reload below.

   The obvious guard — snapshot navigator.serviceWorker.controller at startup
   and only reload if the page already had one — has a hole. On a first-ever
   visit there is no controller at script time, so the snapshot is false for
   the entire life of that page. If the driver then taps to update in that
   same session, controllerchange fires and the snapshot suppresses the
   reload: the footer sits on "Updating…" against a worker that has already
   taken over. Keying on the tap instead is both narrower and exactly the
   rule we want — no reload the driver did not ask for, on any visit. */
let userAskedToUpdate = false;

if("serviceWorker" in navigator){
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    /* A claim nobody asked for: a first install taking control, or a worker
       activating behind a background check. Let it happen silently. */
    if(!userAskedToUpdate || reloading) return;
    reloading = true;
    location.reload();
  });
}

function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  /* Relative on purpose. HazPost is served from /HazPost/ on GitHub Pages, so
     "sw.js" resolves against this document to /HazPost/sw.js and the default
     scope becomes /HazPost/. A leading slash would ask for /sw.js at the
     domain root, which does not exist and would fail registration outright.

     updateViaCache:"none" keeps sw.js itself out of the HTTP cache, so a check
     asks the server rather than trusting whatever headers Pages happens to
     send. Without it a driver can tap "check" and be told they are current by
     a cached copy of the old worker script. */
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg=>{
    swReg = reg;

    reg.addEventListener("updatefound", ()=>{
      const sw = reg.installing;
      if(!sw) return;
      sw.addEventListener("statechange", ()=>{
        /* installed + an existing controller means this is an update waiting,
           not a first install */
        if(sw.state==="installed" && navigator.serviceWorker.controller) markUpdateReady();
        if(sw.state==="activated") readCacheMeta().then(paintOffline);
      });
    });

    /* a worker may already be waiting from a previous visit */
    if(reg.waiting && navigator.serviceWorker.controller) markUpdateReady();

    checkForUpdate();  /* silent check on load */
  }).catch(e=>{
    /* No worker means no offline mode, but the app still runs online. */
    console.warn("HazPost: service worker registration failed —", e && e.message);
  });
}

function markUpdateReady(){
  updateReady = true;
  /* never stomp on a tap already in flight */
  if(verState==="idle" || verState==="uptodate"){ setVerState("ready"); }
}

function setVerState(s){
  verState = s;
  clearTimeout(verRevert);
  if(s==="uptodate" || s==="nocheck" || s==="failed"){
    /* fall back to whatever is true once the message has been read */
    verRevert = setTimeout(()=>setVerState(updateReady ? "ready" : "idle"), s==="failed" ? 5000 : 2000);
  }
  paintVersionFoot();
}

/* Silent by design: no checking label, no result message. A driver who
   backgrounds the app for a week should not have to go tapping to find out
   they are stale — but a check they did not ask for never reloads and never
   flashes. All it can do is light up the footer via markUpdateReady. */
async function checkForUpdate(){
  if(!swReg) return;
  try{ await swReg.update(); }catch(e){ /* offline, or the server is unreachable */ }
}

function verFootText(){
  switch(verState){
    case "checking": return "Checking for updates…";
    case "uptodate": return "You're up to date";
    case "nocheck":  return "Offline — can't check for updates";
    case "failed":   return "Update didn't finish — tap to retry";
    case "ready":    return "Update ready — tap to install";
    case "updating": return "Updating…";
    default:         return `HazPost v${APP_VERSION}`;
  }
}

/* The home view is rebuilt by render() on every navigation, so the footer is
   drawn from verState each time rather than being written once at startup. */
function paintVersionFoot(){
  const el = document.getElementById('verFoot');
  if(!el) return;
  el.textContent = verFootText();
  el.classList.toggle('live', verState==="ready" || verState==="updating");
}

/* The driver's explicit tap — the only path that is allowed to reload. */
async function tapVersion(){
  if(!swReg || verState==="checking" || verState==="updating") return;

  if(updateReady && swReg.waiting){ applyUpdate(); return; }

  setVerState("checking");

  /* updatefound fires as soon as a new worker starts installing — the earliest
     positive signal that a new build exists. */
  let found = false;
  const onFound = ()=>{ found = true; };
  swReg.addEventListener("updatefound", onFound);

  let reached = true;
  try{ await swReg.update(); }catch(e){ reached = false; }
  await sleep(600);                       /* let a just-started install announce itself */
  swReg.removeEventListener("updatefound", onFound);

  if(found || swReg.installing || swReg.waiting){
    /* Wait for the lifecycle rather than a fixed window. Installing a new
       HazPost means caching a ~370 KB table plus icons, and sw.js gives its
       optional phase up to 10 s — a short fixed timeout here would report
       "up to date" while the update was still downloading. */
    setVerState("updating");
    if(await waitForWaiting(swReg, 30000)){ applyUpdate(); return; }
    setVerState("failed");
    return;
  }

  /* Never answer "up to date" for a check that never reached the server. A
     driver reading that would take it as confirmation their rules are
     current, which is the exact thing this footer exists to prevent. */
  setVerState(reached && navigator.onLine ? "uptodate" : "nocheck");
}

const sleep = ms => new Promise(r=>setTimeout(r, ms));

/** Resolve true once a new worker finishes installing and parks in `waiting`. */
function waitForWaiting(reg, ms){
  return new Promise(res=>{
    const t0 = Date.now();
    (function poll(){
      if(reg.waiting) return res(true);
      if(Date.now() - t0 > ms) return res(false);
      setTimeout(poll, 250);
    })();
  });
}

/* Hand the waiting worker its go-ahead. It activates, calls clients.claim(),
   and the controllerchange listener above turns that into the reload. */
function applyUpdate(){
  userAskedToUpdate = true;
  setVerState("updating");
  if(swReg.waiting) swReg.waiting.postMessage("skip");
  /* If the handover never lands, don't strand the driver on "Updating…".
     Reloading is already what they asked for, so the fallback is safe. */
  setTimeout(()=>{ if(!document.hidden) location.reload(); }, 6000);
}

/* placard rendering specs — colours per the design sections cited on each line */
const PLC = {
 /* Table 1 categories — 172.504(e) */
 expl11:{w:"Explosives", n:"1.1", bg:"#FF6720", fg:"#111"},                                  /* 172.522 */
 expl12:{w:"Explosives", n:"1.2", bg:"#FF6720", fg:"#111"},                                  /* 172.522 */
 expl13:{w:"Explosives", n:"1.3", bg:"#FF6720", fg:"#111"},                                  /* 172.522 */
 gas23:{w:"Poison Gas", n:"2", bg:"#F2F2F2", fg:"#111"},                                     /* 172.540 */
 wet43:{w:"Dangerous When Wet", n:"4", bg:"#0F5FBF", fg:"#fff"},                             /* 172.548 */
 pih61:{w:"Inhalation Hazard", n:"6", bg:"#F2F2F2", fg:"#111"},                              /* 172.555 */
 radio7:{w:"Radioactive", n:"7", bg:"linear-gradient(180deg,#FFB612 45%,#F2F2F2 45%)", fg:"#111"}, /* 172.556 */
 /* Table 2 categories — 172.504(e) */

/**
 * 177.848(i): Division 1.5 compatibility group D riding with Division 1.2
 * compatibility group D must be transported as Division 1.1D.
 *
 * It lives in the segregation section but it re-divisions the shipment, which
 * is what 172.504 placards off — so both modules read it from here rather
 * than each deciding for itself and disagreeing on the same trailer.
 */
function rule848i(lines){
  const cls = l => String(l.cls||"").match(/^(1\.[1-6])([A-S])\b/);
  const has = (d,g) => lines.some(l=>{ const m = cls(l); return m && m[1]===d && m[2]===g; });
  return has("1.5","D") && has("1.2","D");
}

let load = [];

/* ---------------- LOAD PERSISTENCE ----------------
   A driver builds a load at the dock, pockets the phone, and comes back to it.
   Only the id, weight and facility are stored: the hazard classification is
   re-read from hazmat.json on every start, so a load saved before a CFR
   amendment can never resurrect a stale placard category. */
const LS_LOAD = "hazpost.load.v1";
let restoreNote = "";

function saveLoad(){
  try{
    localStorage.setItem(LS_LOAD, JSON.stringify({
      saved: new Date().toISOString(),
      /* st is the driver's answer to the physical-state question in the
         segregation module. It rides with the line and dies with the load —
         never reused for the same ID on a later load, because n.o.s. entries
         genuinely vary between shipments. */
      ...(opsPlace?{opsPlace}:{}),
      lines: load.map(l=>({id:l.id, wt:l.wt, fac:l.fac, ...(l.st?{st:l.st}:{})})),
    }));
  }catch(e){ /* private mode or quota — the app works, it just won't remember */ }
}

function restoreLoad(){
  let raw;
  try{ raw = localStorage.getItem(LS_LOAD); }catch(e){ return; }
  if(!raw) return;
  let doc;
  try{ doc = JSON.parse(raw); }catch(e){ return; }
  const lines = Array.isArray(doc && doc.lines) ? doc.lines : [];
  if(OPS_PLACES.some(x=>x.k===doc.opsPlace)) opsPlace = doc.opsPlace;
  const dropped = [];
  load = lines.map(l=>{
    const m = HM.find(x=>x.id===l.id);
    if(!m || !(l.wt>0)){ dropped.push(l.id); return null; }
    return {...m, wt:l.wt, fac:l.fac||"A", ...(l.st==="liquid"||l.st==="solid" ? {st:l.st} : {})};
  }).filter(Boolean);
  if(dropped.length){
    restoreNote = `${dropped.length} saved line${dropped.length===1?" is":"s are"} no longer in the 172.101 table and ${dropped.length===1?"was":"were"} dropped. Re-check your papers.`;
  }
  /* The load comes back; the view does not. Opening the app lands on the
     module grid every time, so a driver picks the tool for the job in front
     of them rather than resuming wherever they happened to stop. */
}

/* ---------------- CARRIER SAFETY DESK NUMBER ----------------
   Stored on its own key, not with the load: it belongs to the driver, not to
   whatever is on the trailer this week, and clearing the load must not wipe
   the number somebody needs at three in the morning. */
const LS_CARRIER = "hazpost.carrier.v1";

function readCarrier(){
  try{
    const raw = localStorage.getItem(LS_CARRIER);
    if(!raw) return null;
    const doc = JSON.parse(raw);
    return (doc && typeof doc.tel === "string" && doc.tel) ? {tel:doc.tel, name:String(doc.name||"")} : null;
  }catch(e){ return null; }
}
let carrier = readCarrier();

/** What survives into a tel: href. Digits, a leading +, and the pause and
    wait characters a phone tree needs — nothing else. */
function telSafe(s){
  const t = String(s||"").replace(/[^\d+,;*#]/g, "");
  return /\d/.test(t) ? t.slice(0,24) : "";
}

function saveCarrier(){
  const tel = telSafe((document.getElementById("carTel")||{}).value);
  const name = String(((document.getElementById("carName")||{}).value)||"").trim().slice(0,40);
  if(!tel){
    carrier = null;
    try{ localStorage.removeItem(LS_CARRIER); }catch(e){}
  } else {
    carrier = {tel, name};
    try{ localStorage.setItem(LS_CARRIER, JSON.stringify(carrier)); }catch(e){ /* private mode — it just won't stick */ }
  }
  carDraft = null;
  render();
}

/* ---------------- THE DATES THAT LAPSE ----------------
   Four optional dates on their own key. They are the most personal thing this
   app holds, they never leave the phone, and there is deliberately nothing
   here that stores an image of a document — see the What You Carry module for
   why that stays out.

   Stored as typed. Nothing is derived at save time: the training due date is
   computed on every render from the last-training date, so a stored value can
   never disagree with the rule it came from. */
const LS_DATES = "hazpost.dates.v1";
const DATE_KEYS = ["hme", "med", "cdl", "train"];

function readDates(){
  const out = {};
  let raw;
  try{ raw = localStorage.getItem(LS_DATES); }catch(e){ return out; }
  if(!raw) return out;
  let doc;
  try{ doc = JSON.parse(raw); }catch(e){ return out; }
  if(!doc || typeof doc!=="object") return out;
  /* Anything unparseable is dropped on the way in rather than rendered as an
     error later — an empty field is a state the module already handles. */
  for(const k of DATE_KEYS) if(parseISODate(doc[k])!==null) out[k] = doc[k];
  return out;
}
let dates = readDates();

function setDate(k, v){
  if(!DATE_KEYS.includes(k)) return;
  if(parseISODate(v)===null) delete dates[k]; else dates[k] = v;
  try{ localStorage.setItem(LS_DATES, JSON.stringify(dates)); }catch(e){ /* private mode — it just won't stick */ }
  render();
}

function clearDates(){
  if(!Object.keys(dates).length) return;
  if(!confirm("Clear all four dates?\n\nThis erases them from this phone. Nothing was sent anywhere, so there is no copy to restore.")) return;
  dates = {};
  try{ localStorage.removeItem(LS_DATES); }catch(e){}
  render();
}

/* every mutation of the load goes through here, so nothing can change on

function commit(){ saveLoad(); render(); }

function clearLoad(){
  if(!load.length) return;
  const n = load.length;
  if(!confirm(`Clear all ${n} line${n===1?"":"s"}?\n\nThis also erases the load saved on this phone — it will not come back when you reopen HazPost.`)) return;
  load = []; restoreNote = ""; opsPlace = null; commit();
}

/* ---------------- THE 172.504 ENGINE ---------------- */
function compute(){
  const why=[]; const placards=new Set(); let dangerOption=null;

  const t1=load.filter(l=>l.t1);
  const t2=load.filter(l=>!l.t1);

  // Table 1 — any quantity
  t1.forEach(l=>{
    if(!noPlc(l)) placards.add(l.plc);
    why.push({tone:"bad", txt:`<b>${idLabel(l)} ${esc(l.name)}</b> is a Table 1 material (Class ${esc(l.cls)}). Its placard is required at <b>any quantity</b>.`, cite:"172.504(e) Table 1"});
    if(l.cond) why.push({tone:"warn", txt:`<b>${idLabel(l)}</b> — ${esc(l.cond)}`, cite:"172.504(e) Table 1"});
  });

  // 172.505(a) — a PIH material carries its inhalation placard on top of its own class placard
  load.forEach(l=>{
    if(l.pih && l.base!=="6.1" && l.base!=="2.3"){
      placards.add("pih61");
      why.push({tone:"bad", txt:`<b>${idLabel(l)} ${esc(l.name)}</b> is poisonous by inhalation (${esc(l.pih)}). A <b>POISON INHALATION HAZARD</b> placard is required at any quantity, in addition to its Class ${esc(l.cls)} placard.`, cite:"172.505(a)"});
    }
  });

  // Table 2 — aggregate threshold
  const agg = t2.reduce((s,l)=>s+l.wt,0);
  if(t2.length && agg < 1001){
    why.push({tone:"ok", txt:`Table 2 aggregate is <b>${agg.toLocaleString()} lb</b> — under the 1,001 lb threshold, so no Table 2 placards are required. Watch it: one more pickup can flip this.`, cite:"172.504(c)"});
  }
  if(t2.length && agg >= 1001){
    why.push({tone:"warn", txt:`Table 2 aggregate is <b>${agg.toLocaleString()} lb</b> — at or over 1,001 lb, so every Table 2 category on board must be placarded.`, cite:"172.504(c)"});
    // categories present. A category whose every line is exempt from placarding
    // (6.2, unlabelled 1.4S) still counts toward the aggregate but hangs nothing.
    const cats={};
    t2.forEach(l=>{ const c = cats[l.base] = cats[l.base]||{wt:0, byFac:{}, plc:null};
      c.wt+=l.wt;
      c.byFac[l.fac]=(c.byFac[l.fac]||0)+l.wt;
      if(!c.plc && !noPlc(l)) c.plc=l.plc; });
    const catKeys=Object.keys(cats);
    const placardedCats = catKeys.filter(c=>cats[c].plc);
    placardedCats.forEach(c=>placards.add(cats[c].plc));

    catKeys.filter(c=>!cats[c].plc).forEach(c=>{
      why.push({tone:"ok", txt:`<b>${CLSNAME[c]||"Category "+c}</b> counts toward the 1,001 lb aggregate, but Table 2 specifies <b>no placard</b> for it.`, cite:"172.504(e) Table 2"});
    });

    // Class 9 domestic note
    if(cats["9"]){
      why.push({tone:"ok", txt:`<b>Class 9</b> is on board — the Class 9 placard is <b>not required</b> for domestic highway transport. You may display it, but you don't have to.`, cite:"172.504(f)(9)"});
    }

    // DANGEROUS option
    const nonNine = placardedCats.filter(c=>c!=="9");
    if(nonNine.length>=2){
      const blocked = nonNine.filter(c=>Object.values(cats[c].byFac).some(w=>w>=2205));
      if(blocked.length===0){
        dangerOption={cats:nonNine};
        why.push({tone:"warn", txt:`Two or more Table 2 categories → you may hang a single <b>DANGEROUS</b> placard instead of the individual ones.`, cite:"172.504(b)"});
      } else {
        dangerOption={cats:nonNine.filter(c=>!blocked.includes(c)), blocked};
        blocked.forEach(c=>{
          why.push({tone:"bad", txt:`<b>${CLSNAME[c]}</b>: ${Math.max(...Object.values(cats[c].byFac)).toLocaleString()} lb came aboard at one facility — 2,205 lb or more from a single loading point kills the DANGEROUS shortcut for that class. Its own placard must be displayed.`, cite:"172.504(b)(2)"});
        });
        if(dangerOption.cats.length<2) dangerOption=null;
      }
    }
    // subsidiary note
    t2.forEach(l=>{ if(l.subs && !l.pih) why.push({tone:"ok", txt:`<b>${idLabel(l)} ${esc(l.name)}</b> carries a Class ${esc(l.subs)} subsidiary hazard — check the papers; subsidiary placarding rules in 172.505 may apply.`, cite:"172.505"}); });
  }
  if(!load.length) return null;

  // 177.848(i) — Division 1.5D riding with Division 1.2D re-divisions the whole
  // shipment to 1.1D, which is lower than either line carries. Applied before
  // (f)(1) so the lowest-division rule then settles on 1.1 on its own.
  const promoted = rule848i(load);
  if(promoted){
    placards.add("expl11");
    why.push({tone:"bad", txt:`Division <b>1.5D</b> and Division <b>1.2D</b> are both aboard, so the shipment must be transported as <b>Division 1.1D</b> — a lower division than either line carries. The trailer takes <b>EXPLOSIVES 1.1</b>.`, cite:"177.848(i)"});
  }

  // 172.504(f)(1) — when several Class 1 divisions are aboard, only the lowest is displayed
  const explOn = [...placards].filter(p=>EXPLDIV[p]).sort((a,b)=>EXPLDIV[a].localeCompare(EXPLDIV[b]));
  if(explOn.length>1){
    explOn.slice(1).forEach(p=>placards.delete(p));
    /* Silent when 177.848(i) put 1.1 there: that note has already explained
       the outcome, and saying division 1.1 is "aboard" would be wrong — no
       line on this load carries it. */
    if(!promoted){
      why.push({tone:"ok", txt:`Explosives divisions ${explOn.map(p=>EXPLDIV[p]).join(", ")} are aboard — only the placard for the <b>lowest division</b>, EXPLOSIVES ${EXPLDIV[explOn[0]]}, must be displayed.`, cite:"172.504(f)(1)"});
    }
  }

  return {placards:[...placards], why, dangerOption, agg, t2cats: t2.length};
}

function computeAndDraw(){
  const el=document.getElementById('result'); if(!el) return;
  const r=compute();
  if(!r){ el.innerHTML=""; return; }
  let trailerA = r.placards.map(p=>plcHTML(p)).join("");
  let html = `<div class="trailer"><h4>Required on the trailer${r.dangerOption?' — Option A: specific placards':''}</h4>
     <div class="tr-body">${trailerA||'<span class="tr-none">No placards required for this load</span>'}</div>`;
  if(r.dangerOption){
    const dSet=[plcHTML('danger')].concat(
      r.placards.filter(p=>{
        // keep table-1 placards and blocked-class placards alongside DANGEROUS
        const cat=Object.keys(CLSPLC).find(k=>CLSPLC[k]===p);
        return !cat || !r.dangerOption.cats.includes(cat);
      }).map(p=>plcHTML(p)));
    html += `<h4 style="margin-top:22px">Option B: DANGEROUS placard</h4>
      <div class="tr-body">${dSet.join("")}</div>
      <div class="hint">Either option is legal for this load. Most fleets prefer specific placards — emergency responders get better information.</div>`;
  }
  html += `</div><div class="card"><h4>Why</h4>`+
    r.why.map(w=>`<div class="why ${w.tone}"><p>${w.txt}</p><span class="cite">49 CFR ${w.cite}</span></div>`).join("")+
    `</div>`;
  el.innerHTML=html;
}
function plcHTML(key){
  const p=PLC[key];
  if(!p || p.none) return "";
  const stripes = p.stripes? `<div style="position:absolute;top:0;left:0;right:0;height:50%;background:repeating-linear-gradient(90deg,#111 0 7px,#F2F2F2 7px 14px)"></div>`:"";
  return `<div class="plc"><div class="dia"><div class="fill" style="background:${p.bg}">${stripes}</div></div>
    <div class="txt" style="color:${p.fg}"><span class="w" style="max-width:60px">${p.w}</span><span class="n">${p.n}</span></div>
    <div class="cap">${key==='danger'?'dangerous':''}</div></div>`;
}
