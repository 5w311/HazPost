  let h = `<div class="card"><h4>On you, or in the cab</h4>` +

    item("CDL with the H or X endorsement",
      `<p>You must hold a State-issued endorsement to operate a vehicle used to transport hazardous materials. <b>H</b> is hazmat; <b>X</b> is the combined tank and hazmat endorsement. The letter is the same in every state — it is a federal code.</p>`,
      "383.93(b)(4), 383.153(a)(9)(iv), (v)",
      cfrFolds("§ 383.93(b)(4) and the letter codes — full text", [
        ["383.93(b)", carText("383.93","(b)")],
        ["383.93(b)(4)", carText("383.93","(b)(4)")],
        ["383.153(a)(9)(iv)", carText("383.153","(a)(9)(iv)")],
        ["383.153(a)(9)(v)", carText("383.153","(a)(9)(v)")],
      ])) +

    item("Medical certification — on the record, not in your pocket",
      `<p>This changed and it is worth knowing. Since <b>23 June 2025</b>, a driver required to hold a CDL or CLP <b>no longer carries the medical examiner's certificate</b>. The examiner reports the result to FMCSA, it reaches your driving record, and that record is what an inspector reads.</p>
       <p>Carrying the card does no harm. Relying on it does: if the paper copy and the electronic record disagree, <b>the electronic record controls</b>. What actually stops the truck is the certification lapsing on the record, which gets the CDL downgraded — so it is on the next tab.</p>`,
      "391.41(a)(2)(i)(B), (a)(2)(iv)",
      cfrFolds("§ 391.41(a)(2) — full text", [
        ["391.41(a)(2)(i)(B)", carText("391.41","(a)(2)(i)(B)")],
        ["391.41(a)(2)(iv)", carText("391.41","(a)(2)(iv)")],
      ])) +

    item("A medical variance, if you hold one",
      `<p>The exception to the item above. An FMCSA <b>exemption letter or skill performance evaluation certificate</b> must be on your person whenever you are on duty — that one is still a piece of paper you carry, and the rule says so twice.</p>`,
      "391.41(a)(1)(ii), (a)(2)(iii)",
      cfrFolds("§ 391.41(a)(1)(ii) and (a)(2)(iii) — full text", [
        ["391.41(a)(1)(ii)", carText("391.41","(a)(1)(ii)")],
        ["391.41(a)(2)(iii)", carText("391.41","(a)(2)(iii)")],
      ])) +

    item("The shipping paper",
      `<p>Tabbed or first in the stack, and in one of the places the rule names — which depends on whether you are at the controls. <a href="#" style="color:var(--brand)" onclick="view='papers';papTab='where';render();window.scrollTo(0,0);return false">Shipping Papers → Where they live</a> has the whole rule; it is not repeated here.</p>`,
      "177.817(e)", "") +

    item("Emergency response information",
      `<p>In English, <b>usable away from the package</b> so not sealed inside it, and immediately accessible to you. The ERG satisfies this. HazPost reproduces no guide content — carry the official book or PHMSA's app.</p>`,
      "172.602(b)(1), (b)(2), (c)(1)",
      cfrFolds("§ 172.602 — full text", [
        ["172.602(b)", carText("172.602","(b)")],
        ["172.602(b)(1)", carText("172.602","(b)(1)")],
        ["172.602(b)(2)", carText("172.602","(b)(2)")],
        ["172.602(c)(1)", carText("172.602","(c)(1)")],
      ]));

  /* 397.19 is conditional and stays hidden entirely when no explosives are on
     the trailer. Showing a greyed-out "not required" item would be its own
     kind of noise, and the load is the only thing HazPost knows that the
     inspector's list does not. */
  if(tier1){
    h += item(`Documents the carrier must have given you<span class="cond-tag">1.1 / 1.2 / 1.3</span>`,
      `<p>Only for Division 1.1, 1.2 or 1.3, which is what you have on. The carrier furnishes a copy of the Part 397 rules and a document of <b>instructions for an accident or delay</b> — who to call, what the explosives are, what to do about fire, accident or leakage. <b>You sign a receipt for them.</b></p>
       <p>Then (c) requires you to be in possession of, familiar with, and in compliance with those documents, the shipping papers, and the <b>written route plan</b>. Routing is Subpart D and HazPost does not implement it — the route plan comes from your carrier. <a href="#" style="color:var(--brand)" onclick="view='ops';opsTab='where';render();window.scrollTo(0,0);return false">On the Road</a> covers the rest of Part 397.</p>`,
      "397.19(a), (b), (c)",
      cfrFolds("§ 397.19 — full text", [
        ["397.19(a)", carText("397.19","(a)")],
        ["397.19(a)(1)", carText("397.19","(a)(1)")],
        ["397.19(a)(3)", carText("397.19","(a)(3)")],
        ["397.19(b)", carText("397.19","(b)")],
        ["397.19(c)", carText("397.19","(c)")],
        ["397.19(c)(1)", carText("397.19","(c)(1)")],
        ["397.19(c)(2)", carText("397.19","(c)(2)")],
        ["397.19(c)(3)", carText("397.19","(c)(3)")],
      ]), {dot:"cond"});
  }

  h += `<div class="hint">${tier1
    ? `The explosives item above is showing because Division 1.1, 1.2 or 1.3 is on the load you built.`
    : `One more item appears here when Division 1.1, 1.2 or 1.3 is on the load. HazPost reads that from <a href="#" style="color:var(--brand)" onclick="view='placards';plcTab='builder';render();window.scrollTo(0,0);return false">Placarding → Load Builder</a>${load.length ? `, and nothing on the ${load.length} line${load.length===1?"":"s"} you built is in those divisions.` : `, which is empty right now.`}`}</div>
    </div>`;

  h += `<div class="card"><h4>What you do not carry</h4>
    <div class="not"><b>Your hazmat training record</b>
      <p>This one surprises people. The training record is created and kept by the <b>employer</b>, not by you, and the employer is the one who produces it on request to an authorised DOT official. There is no training certificate you are expected to have in the truck at a roadside inspection.</p>
      <p>Worth knowing anyway, because <b>172.704(c)(4) puts compliance on the employer regardless of whether the training was ever completed</b>. A gap in your training is the carrier's violation. It is not something you can resolve at the scale house, and it is not something to try to talk your way through.</p>
      <span class="cite">49 CFR 172.704(d), 172.704(c)(4)</span>
      ${cfrFolds("§ 172.704(d) and (c)(4) — full text", [
        ["172.704(d)", carText("172.704","(d)")],
        ["172.704(c)(4)", carText("172.704","(c)(4)")],
      ])}</div></div>`;

  return h;
}

/* ---- TAB 2: WHAT EXPIRES ---- */
function carExpView(){
  const today = todayISO();
  const anySet = DATE_KEYS.some(k=>dates[k]);

  const NOTES = {
    hme: `<p><b>At least every five years</b> — the State must set the renewal cycle so you go through a TSA security threat assessment at least that often, and it may not issue or renew without a <b>Determination of No Security Threat</b>. Holding a valid <b>TWIC</b> is the alternative route.</p>
      <p><b>Two deadlines, and they are not the same one.</b> The State must tell you 60 days out; FMCSA says file the renewal application <b>no later than 30 days</b> before expiry, TSA says you may start the assessment <b>no later than 60 days</b> before. Neither is a grace period. Start it early — the assessment is the slow part, and if TSA has not answered in time your State may extend the endorsement by <b>90 days</b>, which is a rescue, not a plan.</p>
      <p>Where the CDL expires first, many States pull the endorsement date back to match, so your real date can be earlier than five years. And on a transfer between States the second State does not re-run the assessment until the first State's cycle runs out, up to five years.</p>`,
    med: `<p>Certification runs on a <b>24-month</b> cycle, and on <b>12 months</b> for an exempt intracity zone, an insulin-treated diabetes certificate under § 391.46, or a vision exemption under § 391.44. An examiner can also certify you for a shorter period than the maximum, so <b>use the date the examiner wrote, not a calculation.</b></p>
      <p>Since 23 June 2025 a CDL holder no longer carries the certificate, but the certification still has to be current on the record. Let it lapse and the State downgrades the CDL — which takes the endorsement with it.</p>`,
    cdl: `<p>State-set, and not a federal interval. It is here because it can cut the endorsement short. Many States align the hazmat endorsement to the licence expiry rather than running it a full five years.</p>`,
    train: `<p>Type the date of your <b>last</b> hazmat training; recurrent training is due at least every three years, so HazPost adds three years to get the date above. Nothing about the number is stored — it is recomputed from the date you typed, every time.</p>
      <p><b>This is the carrier's obligation and the carrier's record.</b> You cannot fix it yourself and you are not the one who keeps it. It is tracked here for one reason: so you can prompt them before it lapses, and so you know which question to ask.</p>`,
  };

  let h = `<div class="card"><h4>Your dates</h4>
    <p style="font-size:12.5px;color:var(--dim);line-height:1.55;margin-bottom:12px">All four are optional. They are stored <b style="color:var(--ink)">on this phone only</b> — HazPost has no account, no server and nothing to sync to, so nothing here leaves the device.</p>`;

  EXP_FIELDS.forEach(f=>{
    const r = expRow(f, dates, today);
    h += `<div class="exp"><div class="top"><b>${esc(f.lbl)}</b>
        <input type="date" id="date-${f.k}" value="${esc(r.typed)}" onchange="setDate('${f.k}', this.value)" aria-label="${esc(f.lbl)}"></div>
      <span class="days ${r.status.cls}">${esc(r.status.txt)}</span>${
        f.addYears && r.due ? `<span class="due">due ${esc(r.due)}</span>` : ""}
      <div class="note">${NOTES[f.k]}</div>
      <span class="cite">${esc(f.cite)}</span></div>`;
  });

  h += `<button class="btn ghost" style="margin-top:4px${anySet?"":";opacity:.45"}" onclick="clearDates()"${anySet?"":" disabled"}>Clear all dates</button>

    <div class="limitbox"><p><b>A reminder, not a record.</b> HazPost cannot verify any of these dates and does not try. Whatever your State and your carrier hold beats what is typed here — if the two disagree, they are right and this is wrong.</p></div>

    <div class="limitbox"><p><b>No reminders, and that is deliberate.</b> There are no notifications, no alerts and nothing scheduled. A static site with no backend cannot reliably fire one, and a reminder that silently fails to arrive is worse than no reminder at all. This screen tells you where you stand when you open it.</p></div>

    <div class="limitbox"><p><b>Dates only. No photographs of anything, ever.</b> No pictures of a licence, a medical card or an endorsement, no scanning and no uploads. If this phone is lost, four dates are a small problem; images of your licence and medical card are not, and HazPost has no account, no encryption at rest and no way to revoke anything. That is not a feature waiting to be added.</p></div></div>`;

  h += `<div class="card"><h4>The mechanics are your State's</h4>
    <div class="rule a"><b>The five-year ceiling is federal. Almost nothing else is.</b>
      <p>All of this is set where your licence is issued, and it varies:</p>
      <ul><li>Whether a transfer between States needs a fresh knowledge test</li>
      <li>How a temporary endorsement is handled</li>
      <li>What the fee is</li>
      <li>How early you can file</li></ul>
      <p>HazPost does not carry state rules and will not guess at them.</p>
      <p><b>Ask your own licensing agency.</b> They are the only ones who can tell you what your renewal actually involves.</p>
      <span class="cite">49 CFR 383.141(d), 1572.13(e)</span>
      ${cfrFolds("§ 383.141 and § 1572.13 — the federal frame", [
        ["383.141(b)", carText("383.141","(b)")],
        ["383.141(b)(1)", carText("383.141","(b)(1)")],
        ["383.141(b)(2)", carText("383.141","(b)(2)")],
        ["383.141(c)", carText("383.141","(c)")],
        ["383.141(d)", carText("383.141","(d)")],
        ["1572.13(a)", carText("1572.13","(a)")],
        ["1572.13(b)", carText("1572.13","(b)")],
        ["1572.13(c)", carText("1572.13","(c)")],
        ["1572.13(e)", carText("1572.13","(e)")],
      ])}</div></div>`;

  return h;
}

/* ---- TAB 3: TRAINING RULES ---- */
function carTrainView(){
  const r = (title, body, cite, verb) =>
    `<div class="rule a"><b>${esc(title)}</b>${body}<span class="cite">49 CFR ${esc(cite)}</span>${verb||""}</div>`;

  let h = `<div class="limitbox" style="margin:0 0 12px"><p><b>None of this is yours to do.</b> 172.704 is an employer obligation from end to end — the hazmat employer trains, tests, certifies and keeps the record. It is here so you know what your carrier owes you and what to ask for, not because there is a box for you to tick.</p></div>`;

  h += `<div class="card"><h4>Whose job it is</h4>` +
    r("The employer's, throughout",
      `<p>The hazmat employer trains, tests, certifies and holds the record. And the rule goes further than that: the employer is responsible for compliance <b>whether or not the training was ever completed</b>. A training gap is the carrier's violation, not yours.</p>`,
      "172.704(c)(4), (d)",
      cfrFolds("§ 172.704(c)(4) — full text", [["172.704(c)(4)", carText("172.704","(c)(4)")]])) +

    r("What the training has to cover",
      `<ul><li><b>General awareness and familiarization</b> — recognising and identifying hazardous materials</li>
       <li><b>Function-specific</b> — the parts of the subchapter that apply to what you actually do</li>
       <li><b>Safety</b> — emergency response information, protecting yourself from exposure, avoiding accidents</li>
       <li><b>Security awareness</b> — recognising and responding to security threats. New hazmat employees get this within 90 days of employment.</li>
       <li><b>In-depth security</b> — only where a security plan is required under Subpart I, for employees the plan covers</li></ul>`,
      "172.704(a)(1)–(a)(5)",
      cfrFolds("§ 172.704(a) — full text", [
        ["172.704(a)(1)", carText("172.704","(a)(1)")],
        ["172.704(a)(2)(i)", carText("172.704","(a)(2)(i)")],
        ["172.704(a)(3)", carText("172.704","(a)(3)")],
        ["172.704(a)(4)", carText("172.704","(a)(4)")],
        ["172.704(a)(5)", carText("172.704","(a)(5)")],
      ])) +

    r("Two clocks",
      `<p><b>New hire, or a change of job function — 90 days.</b> You may perform the function before training is complete, but only under the <b>direct supervision of a properly trained and knowledgeable hazmat employee</b>, and the training has to be done within 90 days. Both halves, not either.</p>
       <p><b>Then at least once every three years.</b> In-depth security training has a wrinkle: if the security plan is revised mid-cycle, retraining is due within 90 days of the revision rather than waiting for the three years.</p>`,
      "172.704(c)(1), (c)(2)",
      cfrFolds("§ 172.704(c)(1) and (c)(2) — full text", [
        ["172.704(c)(1)", carText("172.704","(c)(1)")],
        ["172.704(c)(1)(i)", carText("172.704","(c)(1)(i)")],
        ["172.704(c)(1)(ii)", carText("172.704","(c)(1)(ii)")],
        ["172.704(c)(2)", carText("172.704","(c)(2)")],
      ])) +
    `</div>`;

  h += `<div class="card"><h4>The one part you can act on</h4>
    <div class="rule care"><b>Changing carriers — get your record on the way out</b>
      <p>Training you already have can count toward a new employer's obligation, <b>but only if a current record of it is obtained from the previous employer</b>. No record, no credit — and then you are retraining from scratch on somebody else's schedule.</p>
      <p>Five things have to be on it:</p>
      <ul><li>Your name</li>
      <li>The most recent training completion date</li>
      <li>A description, copy or location of the training materials used</li>
      <li>The name and address of whoever provided the training</li>
      <li>Certification that you were trained and tested</li></ul>
      <p>That is the thing to ask for, and the time to ask is before you leave.</p>
      <span class="cite">49 CFR 172.704(c)(3), (d)(1)–(d)(5)</span>
      ${cfrFolds("§ 172.704(c)(3) and what the record contains — full text", [
        ["172.704(c)(3)", carText("172.704","(c)(3)")],
        ["172.704(d)", carText("172.704","(d)")],
        ["172.704(d)(1)", carText("172.704","(d)(1)")],
        ["172.704(d)(2)", carText("172.704","(d)(2)")],
        ["172.704(d)(3)", carText("172.704","(d)(3)")],
        ["172.704(d)(4)", carText("172.704","(d)(4)")],
        ["172.704(d)(5)", carText("172.704","(d)(5)")],
      ])}</div></div>`;

  h += `<div class="card"><h4>How long the record lives</h4>` +
    r("Employment, plus 90 days",
      `<p>The employer keeps a current record covering the <b>preceding three years</b>, for as long as you are employed there as a hazmat employee and for 90 days after you leave. After that window it can be gone — which is the practical reason (c)(3) above has a deadline attached to it in real life even though the rule does not state one.</p>`,
      "172.704(d)",
      cfrFolds("§ 172.704(d) — full text", [["172.704(d)", carText("172.704","(d)")]])) +
    `</div>`;

  h += `<div class="card"><h4>Source</h4>
    <div class="hint" style="margin-top:0">${esc(CAR.source)}, current as of ${esc(CAR.cfrDate)} (text v${esc(CAR.version)}). Ten sections from three agencies — PHMSA, FMCSA and TSA. Every plain-language line in this module is ours; the CFR paragraph it was written from sits under it.</div>` +
    CAR.sections.map(s=>
      cfrFolds(`§ ${s.n} — ${s.agency} — full text`, s.paras.map(p=>[s.n+(p.id||""), p.text]))).join("") +
    `</div>`;

  return h;
}

/* ---------------- BOOT ---------------- */
window.addEventListener("online",  paintOffline);
window.addEventListener("offline", paintOffline);
/* the connection can drop between launches; re-check when the app comes back
   to the foreground, which is how a phone in a pocket behaves. The update
   check here is silent — it can surface that a new build exists, never act
   on it. A driver mid load build does not get reloaded out from under. */
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) return;
  readCacheMeta().then(paintOffline);
  checkForUpdate();
});

registerSW();
loadData();
</script>
</body>
