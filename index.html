/* ================= SEGREGATION — 49 CFR 177.848 =================

   The 18 categories on the axes of the (d) table are NOT the placard
   categories the load builder uses. They are narrower in three places:
   Division 2.3 splits by inhalation zone, Division 6.1 is one narrow row
   (poisonous liquids, PG I, Zone A), and Class 8 is liquids only. So a load
   line is mapped here from scratch rather than reusing `base`.

   A line can occupy more than one category: 177.848(e)(6) requires
   segregation appropriate to a subsidiary hazard whenever it is more
   restrictive than the primary. That is the part a driver reading placards
   alone would never see.                                                  */

const SEGRANK = {"":0, "O":1, "*":2, "X":3};

const segIdx = k => SEG.categories.findIndex(c=>c.key===k);
const segCat = k => SEG.categories.find(c=>c.key===k) || {key:k, label:k, name:k, axis:k};
const segCell = (a,b) => SEG.table[segIdx(a)][segIdx(b)];

/** Rows defined as liquids. hazmat.json does not record physical state. */
const NEEDS_STATE = {"8L":"Class 8", "6.1I-A":"Division 6.1"};

/**
 * Map one class/division token to a segregation category, or null when the
 * token has no row at all. `ctx` collects the assumptions worth stating.
 */
function segCatFor(tok, l, ctx){
  tok = String(tok||"").trim();
  /* placard-category keys that are not plain divisions */
  if(tok==="2.2oxy") tok = "2.2";
  if(tok==="5.2tc")  tok = "5.2";
  if(tok==="6.1t2")  tok = "6.1";
  if(tok==="comb")   return null;

  if(tok==="1.1" || tok==="1.2") return "1.1-1.2";
  if(["1.3","1.4","1.5","1.6","2.1","2.2","3","4.1","4.2","4.3","5.1","5.2","7"].includes(tok)) return tok;

  /* A bare Class 1 label carries no division, so there is nothing to look up
     directly. It is read as 1.1/1.2 — the strictest explosives row — and the
     assumption is stated on screen. That row is X against nearly everything,
     so this is deliberately the loud answer: the alternative was to drop the
     subsidiary entirely and say nothing. Affects the four organic peroxide
     Type B entries (UN3101, UN3102, UN3111, UN3112), whose column 6 reads
     "5.2, 1". */
  if(tok==="1"){
    ctx.notes.push(`${idLabel(l)} carries a Class 1 subsidiary with no division on file. It is placed on the <b>1.1/1.2</b> row, the strictest explosives row — that row is X against nearly everything, so check the compatibility group on your papers before treating this as final.`);
    return "1.1-1.2";
  }

  if(tok==="2.3"){
    const z = (l.pih||"").match(/Zone\s*([A-D])/i);
    if(!z){
      ctx.notes.push(`${idLabel(l)} is Division 2.3 with no inhalation zone on file — treated as <b>Zone A</b>, the stricter row.`);
      return "2.3A";
    }
    const Z = z[1].toUpperCase();
    if(Z==="A") return "2.3A";
    if(Z==="B") return "2.3B";
    return null;   /* Zones C and D are not rows — no restriction */
  }

  if(tok==="6.1"){
    /* the row is poisonous LIQUIDS, PG I, Zone A — all three, or no row */
    const zoneA = /Zone\s*A/i.test(l.pih||"");
    const pgI   = String(l.pg||"").split(",").map(x=>x.trim()).includes("I");
    return (zoneA && pgI) ? "6.1I-A" : null;
  }

  if(tok==="8") return "8L";

  return null;   /* 6.2, Class 9, combustible liquid and the rest have no row */
}

/**
 * Every category a load line occupies, with the state question resolved.
 * Returns confirmed categories plus any outstanding question.
 */
function segCatsFor(l, ctx){
  const raw = [];
  const p = segCatFor(l.base, l, ctx);
  if(p) raw.push({key:p, sub:false, from:"primary"});
  (l.subs ? String(l.subs).split(/,\s*/) : []).forEach(t=>{
    const c = segCatFor(t, l, ctx);
    if(c && !raw.some(r=>r.key===c)) raw.push({key:c, sub:true, from:`subsidiary ${t}`});
  });

  const cats = [], pending = [];
  raw.forEach(c=>{
    if(NEEDS_STATE[c.key]){
      if(l.st === "liquid") cats.push(c);
      else if(l.st === "solid") { /* the row is liquids only — line drops off it */ }
      else pending.push(c);
    } else cats.push(c);
  });
  return {cats, pending, raw};
}

/** Pairwise check across the whole load. */
function segCheck(){
  const ctx = {notes:[]};
  const mapped = load.map((l,i)=>({i, l, ...segCatsFor(l, ctx)}));

  /* Ask only where the answer changes the outcome. A lone Class 8 line with
     nothing on the trailer it could ever conflict with does not need the
     driver to go and read the paper — and a prompt that fires when it cannot
     matter trains people to dismiss the one that does.
     `pendingAll` keeps the unfiltered set, because a line whose state is still
     open may still occupy the row for the advisories below. */
  const possible = mapped.map(m=>[...m.cats, ...m.pending]);
  mapped.forEach(m=>{
    m.pendingAll = m.pending;
    m.pending = m.pending.filter(pc =>
      mapped.some((o,j)=> j!==m.i && possible[j].some(oc=> segCell(pc.key, oc.key) !== "")));
  });

  const pairs = [];

  for(let a=0;a<mapped.length;a++) for(let b=a+1;b<mapped.length;b++){
    const A = mapped[a], B = mapped[b];
    let worst = "", via = null;
    for(const ca of A.cats) for(const cb of B.cats){
      const v = segCell(ca.key, cb.key);
      /* strictly worse wins; on a tie prefer the primary-to-primary reading,
         which is the less alarming way to say the same thing */
      const better = SEGRANK[v] > SEGRANK[worst] ||
                     (SEGRANK[v] === SEGRANK[worst] && via && (via[0].sub || via[1].sub) && !ca.sub && !cb.sub);
      if(better){ worst = v; via = [ca, cb]; }
    }
    if(worst === "") continue;
    pairs.push({A, B, code:worst, via, bySub: !!(via[0].sub || via[1].sub)});
  }

  const outstanding = mapped.filter(m=>m.pending.length);
  return {mapped, pairs, outstanding, notes:ctx.notes};
}

/* ================= CLASS 1 COMPATIBILITY — 177.848(f)-(i) =================

   The segregation table sends every explosives-against-explosives pair here
   with a `*`. This is the engine behind that: the (f) compatibility table,
   the numbered rules in (g), and the division rollups in (h) and (i).

   Two of the numbered rules turn on facts the 172.101 table does not carry —
   whether an item is an article or a substance (rule 6), and whether a
   detonator is involved (rule 4). Those produce a stated condition, never a
   green light. Guessing them would be worse than saying so.                */

/** "1.1D" -> {div:"1.1", grp:"D"}; null when the line is not Class 1. */
function class1Of(l){
  const m = String(l.cls||"").match(/^(1\.[1-6])([A-S])\b/);
  return m ? {div:m[1], grp:m[2]} : null;
}

const compatCell = (a,b) => {
  const g = SEG.compat.groups;
  return SEG.compat.table[g.indexOf(a)][g.indexOf(b)];
};

/** 172.101 gives all five fireworks entries the proper shipping name "Fireworks". */
const isFireworks = l => String(l.name||"").trim().toLowerCase() === "fireworks";

/**
 * Resolve every Class 1 line on the load together.
 *
 * Pairwise for the prohibitions, then load-wide for the group assignment in
 * rules 2 and 3 and the division rollup in (h) and (i) — those are properties
 * of the shipment, not of a pair.
 */
function class1Check(){
  const lines = load.map((l,i)=>({i, l, c:class1Of(l)})).filter(x=>x.c);
  if(lines.length < 2) return null;

  const bans = [], conds = [], rules = new Set();
  const groups = [...new Set(lines.map(x=>x.c.grp))].sort();
  const divs   = [...new Set(lines.map(x=>x.c.div))].sort();

  for(let a=0;a<lines.length;a++) for(let b=a+1;b<lines.length;b++){
    const A = lines[a], B = lines[b];
    const cell = compatCell(A.c.grp, B.c.grp);

    if(cell === "X"){
      bans.push({A, B, cell, why:`Compatibility groups ${A.c.grp} and ${B.c.grp} are X in the table.`, cite:"177.848(f), (g)(2)"});
      continue;
    }
    if(/^X\((\d)\)$/.test(cell)){
      const n = cell.match(/^X\((\d)\)$/)[1];
      rules.add(n);
      bans.push({A, B, cell, why:`Compatibility groups ${A.c.grp} and ${B.c.grp} are X in the table. Rule ${n} also applies.`, cite:"177.848(f), (g)(2)"});
      continue;
    }
    if(cell === "1"){
      /* the L x L cell — group L may share the vehicle only with an identical explosive */
      rules.add("1");
      if(A.l.id !== B.l.id){
        bans.push({A, B, cell, why:`Group L may only travel with an <b>identical</b> explosive, and these are different entries.`, cite:"177.848(g)(3)(i)"});
      }
      continue;
    }
    if(cell === "") continue;

    /* everything left is a numbered allowance with strings attached */
    String(cell).split("/").forEach(n=>rules.add(n));
    if(cell === "6"){
      conds.push({A, B, rule:"6", text:`Allowed only if <b>both are explosive articles</b>, the group G item is not fireworks and does not require special handling, and <b>no explosive substances</b> ride in the same vehicle. HazPost cannot tell an article from a substance — that is on the papers.`, cite:"177.848(g)(3)(vi)"});
    }
    if(cell.includes("4")){
      conds.push({A, B, rule:"4", text:`If either of these is a <b>detonator</b>, § 177.835(g) governs the loading and HazPost does not check it.`, cite:"177.848(g)(3)(iv)"});
    }
    if(cell.includes("5")){
      /* rule 5 bites only against 1.1 or 1.2, and only for fireworks */
      const pair = [A,B], s = pair.find(x=>x.c.div==="1.4" && x.c.grp==="S"), o = pair.find(x=>x!==s);
      if(s && o && (o.c.div==="1.1" || o.c.div==="1.2")){
        if(isFireworks(s.l)){
          bans.push({A, B, cell, why:`${idLabel(s.l)} is Division 1.4S <b>fireworks</b>, and they may not ride with Division ${o.c.div} material.`, cite:"177.848(g)(3)(v)"});
        } else {
          conds.push({A, B, rule:"5", text:`If ${idLabel(s.l)} is <b>fireworks</b>, it may not be loaded with Division ${o.c.div} material. Its proper shipping name does not say so — check the papers.`, cite:"177.848(g)(3)(v)"});
        }
      }
    }
  }

  /* --- rules 2 and 3: what the combination is assigned to --- */
  let assigned = null;
  const cde = groups.filter(g=>["C","D","E"].includes(g));
  if(groups.includes("N") && cde.length){
    assigned = {grp:"D", rule:"3", cite:"177.848(g)(3)(iii)", from:[...cde,"N"]};
  } else if(cde.length > 1){
    assigned = {grp:"E", rule:"2", cite:"177.848(g)(3)(ii)", from:cde};
  }
  if(assigned) rules.add(assigned.rule);

  /* --- (i): 1.5D with 1.2D rolls the shipment to 1.1D. Checked first because
         (h) opens with "Except as provided in paragraph (i)". --- */
  const iApplies = rule848i(lines.map(x=>x.l));

  /* --- (h): same group, different divisions, whole shipment rides as the
         lower numerical division. Group D is left to (i) when (i) bites. --- */
  const rollups = [];
  groups.forEach(g=>{
    if(iApplies && g === "D") return;
    const ds = [...new Set(lines.filter(x=>x.c.grp===g).map(x=>x.c.div))].sort();
    if(ds.length > 1) rollups.push({grp:g, from:ds, to:ds[0]});
  });

  const shipmentDiv = iApplies ? "1.1" : divs[0];

  return {lines, groups, divs, bans, conds, rules:[...rules].sort(), assigned, rollups, iApplies, shipmentDiv};
}

function class1View(r){
  if(!r) return "";
  const R = SEG.compat.rules;
  const line = x => `${idLabel(x.l)} <span style="color:var(--faint)">${esc(x.l.cls.split(" ")[0])}</span>`;

  let h = `<div class="card"><h4>Explosives compatibility — 177.848(f)</h4>`;

  h += `<div class="c1sum">${r.lines.map(x=>
    `<span class="c1chip">${idLabel(x.l)} <b>${esc(x.c.div)}${esc(x.c.grp)}</b></span>`).join("")}</div>`;

  r.bans.forEach(bn=>{
    h += `<div class="segv x"><div class="hd"><span class="mark x">X</span>May not travel together</div>
      <p>${bn.why}</p>
      <div class="pairline">${line(bn.A)} <span style="color:var(--faint)">✕</span> ${line(bn.B)} — table cell <b>${esc(bn.cell)}</b></div>
      <span class="cite">49 CFR ${bn.cite}</span></div>`;
  });

  r.conds.forEach(c=>{
    h += `<div class="segv o"><div class="hd"><span class="mark o">${esc(c.rule)}</span>Allowed, with a condition</div>
      <p>${c.text}</p>
      <div class="pairline">${line(c.A)} <span style="color:var(--faint)">✕</span> ${line(c.B)}</div>
      <span class="cite">49 CFR ${c.cite}</span></div>`;
  });

  if(!r.bans.length && !r.conds.length){
    h += `<div class="segv clear"><div class="hd"><span class="mark c">✓</span>Compatible</div>
      <p>Every explosives pair on this load is blank in the compatibility table — no restriction between them.</p>
      <span class="cite">49 CFR 177.848(f), (g)(1)</span></div>`;
  }

  /* What the shipment becomes. Withheld while any pair is prohibited: telling
     a driver how to label a load that may not be built is worse than silence. */
  if(r.bans.length){
    h += `<div class="c1res"><h5>The shipment travels as</h5>
      <p>Not shown — this load may not be assembled as it stands. Resolve the prohibited pair${r.bans.length===1?"":"s"} above first.</p></div>`;
  } else if(r.assigned || r.rollups.length || r.iApplies){
    h += `<div class="c1res"><h5>The shipment travels as</h5>`;
    if(r.assigned){
      h += `<p><b>Compatibility group ${esc(r.assigned.grp)}</b> — ${esc(R[r.assigned.rule])}
        <span class="cite">49 CFR ${r.assigned.cite}</span></p>`;
    }
    r.rollups.forEach(ru=>{
      h += `<p><b>Division ${esc(ru.to)}</b> for group ${esc(ru.grp)} — divisions ${esc(ru.from.join(" and "))} are aboard in the same compatibility group, so the whole shipment rides as the lower numerical division.
        <span class="cite">49 CFR 177.848(h)</span></p>`;
    });
    if(r.iApplies){
      h += `<p class="warn"><b>Division 1.1D</b> — ${esc(SEG.compat.fifteenWithTwelve)}
        <span class="cite">49 CFR 177.848(i)</span></p>
        <p class="warn">That is a lower division than either line carries, so it moves the placard too. Placarding applies this — the trailer shows <b>EXPLOSIVES 1.1</b> for this load.
        <span class="cite">49 CFR 172.504(e), (f)(1)</span></p>`;
    } else if(r.divs.length > 1){
      h += `<p>Lowest division aboard is <b>${esc(r.shipmentDiv)}</b>, which is what the placard follows.
        <span class="cite">49 CFR 172.504(f)(1)</span></p>`;
    }
    h += `</div>`;
  }

  if(r.rules.length){
    h += `<div class="c1rules"><h5>Rules in play</h5>` +
      r.rules.map(n=>`<p><b>${esc(n)}</b> — ${esc(R[n]||"")}</p>`).join("") +
      `<span class="cite">49 CFR 177.848(g)(3)</span></div>`;
  }

  return h + `</div>`;
}

/* ---------------- segregation views ---------------- */

function setLineState(i, v){
  if(!load[i]) return;
  load[i].st = v;
  commit();
}

function segUnavailable(){
  return `<div class="card"><h4>Segregation data unavailable</h4>
    <p style="font-size:14px;line-height:1.5;color:var(--dim)">The 177.848 tables could not be loaded, so HazPost will not guess at what can ride together.</p>
    <div class="msg" style="font:500 12.5px 'Roboto Mono';color:var(--bad);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:12px;word-break:break-word">${esc(SEG_URL)} — ${esc(segError||"not loaded")}</div>
    <button class="btn" style="margin-top:12px" onclick="loadSeg().then(render)">Try again</button></div>`;
}

function segLoadView(){
  if(!load.length){
    return `<div class="card"><h4>Nothing on the trailer</h4>
      <div class="hint" style="margin-top:0">Segregation reads the same load you built for placarding. Add lines in <a href="#" style="color:var(--brand)" onclick="view='placards';plcTab='builder';commit();return false">Placarding → Load Builder</a>, then come back.</div></div>`;
  }

  const {mapped, pairs, outstanding, notes} = segCheck();
  const hard = pairs.filter(p=>p.code==="X");
  const soft = pairs.filter(p=>p.code==="O");
  const star = pairs.filter(p=>p.code==="*");

  /* the load, with the category each line occupies */
  let h = `<div class="card"><h4>On the trailer — ${load.length} line${load.length===1?"":"s"}</h4>` +
    mapped.map(m=>{
      const shown = m.cats.map(c=>segCat(c.key).label);
      const pend  = (m.pendingAll||m.pending).map(c=>segCat(c.key).label + "?");
      const all   = [...shown, ...pend];
      return `<div class="line-item">
        <span class="un">${idLabel(m.l)}</span>
        <div class="nm"><b>${esc(m.l.name)}</b><span>Class ${esc(m.l.cls)} · PG ${esc(m.l.pg)} → ${all.length? esc(all.join(" · ")) : "no segregation row"}</span></div>
        ${m.l.subs?`<span class="segchip sub">sub ${esc(m.l.subs)}</span>`:""}
      </div>`;
    }).join("") + `</div>`;

  /* Outstanding questions come first: they gate the verdict, and the driver
     has the shipping paper in hand right now. */
  if(outstanding.length){
    h += `<div class="card"><h4>Answer before this is a verdict</h4>` +
      outstanding.map(m=>{
        const c = m.pending[0];
        const what = NEEDS_STATE[c.key];
        const row = segCat(c.key);
        return `<div class="stateq">
          <p><b>${idLabel(m.l)} ${esc(m.l.name)}</b></p>
          <p class="q">${esc(what)} appears on this line${m.pending[0].sub?" as a subsidiary hazard":""}, and the segregation row is <b>${esc(row.axis)}</b>. Is this shipment a liquid or a solid? Read it off the paper — HazPost will not guess.</p>
          <div class="row" style="margin-bottom:0">
            <button class="btn ghost" onclick="setLineState(${m.i},'liquid')">Liquid</button>
            <button class="btn ghost" onclick="setLineState(${m.i},'solid')">Solid</button>
          </div>
        </div>`;
      }).join("") +
      `<div class="hint">This answer rides with this load only. It is not remembered for the same ID number next time — n.o.s. entries genuinely vary between shipments.</div></div>`;
  }

  /* Verdicts. An all-clear is only honest once every question is answered. */
  if(!pairs.length){
    h += outstanding.length
      ? `<div class="segv pend"><div class="hd"><span class="mark p">?</span>No verdict yet</div>
         <p>Nothing on the answered part of this load hits a restricted cell — but ${outstanding.length} line${outstanding.length===1?"":"s"} above still need${outstanding.length===1?"s":""} a physical state before HazPost can say the trailer is clear.</p>
         <span class="cite">49 CFR 177.848(d)</span></div>`
      : `<div class="segv clear"><div class="hd"><span class="mark c">✓</span>No segregation conflicts</div>
         <p>No pair on this load lands on a restricted cell of the 177.848 table.</p>
         <span class="cite">49 CFR 177.848(d)</span></div>`;
  } else if(outstanding.length){
    h += `<div class="segv pend"><div class="hd"><span class="mark p">?</span>Partial result</div>
      <p>The conflicts below are already proven. ${outstanding.length} line${outstanding.length===1?"":"s"} above still need${outstanding.length===1?"s":""} an answer, so this is not the whole picture.</p>
      <span class="cite">49 CFR 177.848(d)</span></div>`;
  }

  hard.forEach(p=> h += segVerdict(p, "x", "X — may not travel together",
    "These may not be loaded, transported, or stored together in the same vehicle. No method of separation makes it legal.", "177.848(d), (e)(2)"));
  soft.forEach(p=> h += segVerdict(p, "o", "O — separation required",
    "May travel together only if separated so that, if a package leaks under normal transport conditions, the contents could not commingle.", "177.848(d), (e)(3)"));
  if(star.length){
    h += `<div class="segv s"><div class="hd"><span class="mark s">★</span>Explosives against explosives</div>
      <p>${star.length} pair${star.length===1?" is":"s are"} both Class 1, so the segregation table hands them to the compatibility group table. Resolved below.</p>
      <span class="cite">49 CFR 177.848(d), (f)</span></div>`;
  }

  h += class1View(class1Check());
  h += segAdvisories(mapped, notes);
  return h;
}

function segVerdict(p, cls, title, body, cite){
  const ca = segCat(p.via[0].key), cb = segCat(p.via[1].key);
  const mark = cls==="x" ? "X" : cls==="o" ? "O" : "★";
  return `<div class="segv ${cls}"><div class="hd"><span class="mark ${cls}">${mark}</span>${title}</div>
    <p>${body}</p>
    <div class="pairline">${idLabel(p.A.l)} ${esc(p.A.l.name.slice(0,34))}${p.A.l.name.length>34?"…":""}
      <span style="color:var(--faint)">✕</span> ${idLabel(p.B.l)} ${esc(p.B.l.name.slice(0,34))}${p.B.l.name.length>34?"…":""}</div>
    <div class="pairline">via <b>${esc(ca.axis)}</b> ✕ <b>${esc(cb.axis)}</b></div>
    ${p.bySub?`<div class="pairline sub">Triggered by a subsidiary hazard — ${esc(p.via[0].from)} on ${idLabel(p.A.l)}, ${esc(p.via[1].from)} on ${idLabel(p.B.l)}. A driver reading placards alone would not see this.</div>`:""}
    <span class="cite">49 CFR ${cite}</span></div>`;
}

/* Rules that are not in the grid. The table looks complete; it is not. */
function segAdvisories(mapped, notes){
  /* Advisories use every row a line might occupy, including one whose state is
     still open — an advisory that only appears after the question is answered
     is an advisory that arrives too late. */
  const held = new Set();
  mapped.forEach(m=>[...m.cats, ...(m.pendingAll||m.pending)].forEach(c=>held.add(c.key)));
  const has = k => held.has(k);
  const adv = [];

  if(has("8L") && ["4.1","4.2","4.3","5.1","5.2"].some(has)){
    adv.push(["bad", `Whatever separation you use, <b>Class 8 liquids may not be loaded above or adjacent to Class 4 or Class 5 materials</b>. This is a placement rule, so an O verdict alone does not cover it. The only exception is a truckload shipment where the shipper knows the mixture would not cause fire or dangerous evolution of heat or gas.`, "177.848(e)(3)"]);
  }
  /* (c) turns on the actual materials, so it is surfaced, never inferred */
  const anySixOne = mapped.some(m=>/6\.1/.test(m.l.base||"") || /(^|,\s*)6\.1(\s*,|$)/.test(m.l.subs||""));
  const anyEight  = mapped.some(m=>m.l.base==="8" || /(^|,\s*)8(\s*,|$)/.test(m.l.subs||""));
  if(anyEight && anySixOne){
    adv.push(["bad", `This load carries both a Class 8 line and a Division 6.1 line. <b>Cyanides may not be loaded with acids</b> where the mixture would generate hydrogen cyanide. No table can catch this — it turns on the actual materials, so read the papers.`, "177.848(c)"]);
  }
  if(mapped.some(m=>m.raw.some(c=>c.sub))){
    adv.push(["", `A line here carries a subsidiary hazard. Segregation for the subsidiary applies whenever it is more restrictive than for the primary. Materials <i>of the same class</i> may be stored together without regard to subsidiary segregation, but only when they are not capable of reacting dangerously with each other — that is a judgment about the actual materials, and HazPost does not make it for you.`, "177.848(e)(6)"]);
  }
  if(has("1.1-1.2") || has("1.5") || has("5.1")){
    adv.push(["", `<b>Note A:</b> notwithstanding an X, ammonium nitrate (UN1942) and ammonium nitrate fertilizer may be loaded with Division 1.1 or 1.5 materials, unless § 177.835(c) prohibits it.`, "177.848(e)(5)"]);
  }
  const noRow = mapped.filter(m=>!m.raw.length);
  if(noRow.length){
    adv.push(["ok", `${noRow.map(m=>idLabel(m.l)).join(", ")} ${noRow.length===1?"has":"have"} <b>no segregation row at all</b> — Division 6.2, Class 9 and combustible liquids are not on the 177.848 table, so nothing here restricts them. That is a real answer, not a gap in the check.`, "177.848(d)"]);
  }
  adv.push(["", `If this trailer is going onto a vessel other than a ferry, segregation follows § 176.83(b) instead of this table. HazPost does not implement vessel segregation.`, "177.848(b)"]);

  return `<div class="card"><h4>Also applies</h4>` +
    adv.map(a=>`<div class="why ${a[0]}"><p style="font-size:13.5px">${a[1]}</p><span class="cite">49 CFR ${a[2]}</span></div>`).join("") +
    notes.map(n=>`<div class="why warn"><p style="font-size:13.5px">${n}</p></div>`).join("") +
    `</div>`;
}

function segTableView(){
  const C = SEG.categories;
  let h = `<div class="card"><h4>177.848(d) segregation table</h4>
    <div class="matwrap"><table class="mat"><tr><th class="rh"></th>` +
    C.map(c=>`<th title="${esc(c.axis)}">${esc(c.label)}</th>`).join("") + `</tr>` +
    C.map((rc,i)=>`<tr><th class="rh" title="${esc(rc.axis)}">${esc(rc.label)}</th>` +
      C.map((cc,j)=>{
        const v = SEG.table[i][j];
        const cls = v==="X"?"x":v==="O"?"o":v==="*"?"s":"b";
        return `<td class="${cls}">${v==="*"?"★":esc(v)}</td>`;
      }).join("") + `</tr>`).join("") +
    `</table></div>
    <div class="legend">
      <span><i class="x"></i>X — never together</span>
      <span><i class="o"></i>O — separate so leaks can't commingle</span>
      <span><i class="s"></i>★ — Class 1 compatibility table</span>
      <span><i class="b"></i>blank — no restriction</span>
    </div>
    <div class="hint"><b>6.1L</b> is the narrow row only: poisonous <b>liquids</b>, PG I, Zone A. <b>8L</b> is corrosive <b>liquids</b> only. Classes not on this table — Division 6.2, Class 9, combustible liquid — have no segregation restriction at all.</div>
  </div>`;

  const G = SEG.compat.groups;
  h += `<div class="card"><h4>177.848(f) Class 1 compatibility</h4>
    <div class="matwrap"><table class="mat"><tr><th class="rh"></th>` +
    G.map(g=>`<th>${g}</th>`).join("") + `</tr>` +
    G.map((rg,i)=>`<tr><th class="rh">${rg}</th>` +
      G.map((cg,j)=>{
        const v = SEG.compat.table[i][j];
        return `<td class="${v==="X"?"x":v===""?"b":"n"}">${esc(v)}</td>`;
      }).join("") + `</tr>`).join("") +
    `</table></div>
    <div class="legend">
      <span><i class="x"></i>X — not on the same vehicle</span>
      <span><i class="n"></i>number — see the rule below</span>
      <span><i class="b"></i>blank — no restriction</span>
    </div>
    <div class="c1rules"><h5>177.848(g)(3) — what the numbers mean</h5>` +
    Object.entries(SEG.compat.rules).map(([k,v])=>`<p><b>${esc(k)}</b> — ${esc(v)}</p>`).join("") +
    `</div>
    <div class="c1rules"><h5>Mixing divisions</h5>
      <p><b>(h)</b> ${esc(SEG.compat.divisionRollup)}</p>
      <p><b>(i)</b> ${esc(SEG.compat.fifteenWithTwelve)}</p>
    </div>
    <div class="hint">Check my load applies all of this to the explosives on your trailer. Rules 4 and 6 turn on facts the 172.101 table does not carry — whether a detonator is involved, and whether an item is an article or a substance — so those come back as a stated condition rather than a verdict.</div>
  </div>`;

  h += `<div class="card"><h4>Markers</h4>` +
    Object.entries(SEG.markers).map(([k,v])=>
      `<div class="why ${k==="X"?"bad":k==="O"?"warn":""}"><p style="font-size:13.5px"><b>${k===""?"blank":k==="*"?"★":k}</b> — ${esc(v)}</p></div>`).join("") +
    `<div class="hint">${esc(SEG.source)}, current as of ${esc(SEG.cfrDate)} (table v${esc(SEG.version)}).</div></div>`;
  return h;
}

/* ================= SHIPPING PAPERS — 172 Subpart C, 177.817 =================

   Not a checklist of what a shipping paper contains; a driver can read that
   anywhere. What HazPost has that the paper does not is the load, so it can
   build the basic description each line should carry and let the driver hold
   it against the paper in their hand.

   Compare, not copy. If the two disagree the paper and the shipper win — the
   driver calls the shipper, does not correct the paper, and does not retype
   this onto it. Same posture as placarding being a verification aid.        */

const papSec  = n => (PAPERS.sections.find(s=>s.n===n) || {paras:[]});
const papText = (n,id) => { const p = papSec(n).paras.find(x=>x.id===id); return p ? p.text : ""; };

/**
 * 172.202(a)(1)-(4): identification number, proper shipping name, hazard
 * class, packing group — in that sequence, nothing interspersed (172.202(b)).
 *
 * Three of the four come straight out of the 172.101 data. The fourth, the
 * technical name behind a symbol-G generic name, only the shipper knows.
 */
function basicDescription(l){
  const els = [], flags = [], seq = [];

  /* (a)(1) — Column 4 */
  els.push(`<span class="e-i">${idLabel(l)}</span>`);
  seq.push("ID number");

  /* (a)(2) — Column 2. A symbol-G entry is generic, so the paper has to name
     the constituent that makes it hazardous. HazPost cannot know it. */
  const isG = (l.sym||"").split(/[\s,]+/).includes("G");
  /* 172.101(c)(10): italic text in column 2 is not part of the name. hazmat.json
     carries the roman-only form as `psn` where the two differ — showing the full
     column 2 text would read as a mismatch against a correctly written paper. */
  const name = l.psn || l.name;
  let psn = `<span class="e-s">${esc(name)}</span>`;
  if(l.psn){
    flags.push({tone:"ok", txt:`Column 2 of the table reads <span class="mono">${esc(l.name)}</span>. The italicised part is <b>not</b> part of the proper shipping name — it may appear on the paper in addition to the name, but a paper showing only <b>${esc(l.psn)}</b> is correct.`, cite:"172.101(c)(10)"});
  }
  if(name.includes(" or ")){
    flags.push({tone:"", txt:`This entry offers a <b>choice</b> of proper shipping names. The paper will carry one of them, not all — an italic "or" in column 2 marks the choice.`, cite:"172.101(c)(10)"});
  }
  if(isG){
    psn += ` <span class="e-gap">(contains …technical name…)</span>`;
    flags.push({tone:"gap", txt:`This entry carries <b>symbol G</b> in the 172.101 table, so the proper shipping name is generic and the paper must add the technical name of the constituent in parentheses. HazPost cannot supply it — only the shipper knows what is in the drum. For a mixture, at least the <b>two</b> components contributing most to the hazard must be named.`, cite:"172.203(k), (k)(1)"});
    flags.push({tone:"", txt:`More than one punctuation is permitted, so do not read a difference here as an error. 172.202(d) shows it attached to the name with no comma — <span class="mono">…n.o.s. (contains Xylene and Benzene), 3, II</span>. 172.203(k) shows a comma form and also allows the technical name <i>after</i> the whole basic description — <span class="mono">…n.o.s., 8, II (contains Octanoyl chloride)</span>.`, cite:"172.202(d), 172.203(k)"});
  }
  els.push(psn);
  seq.push("Shipping name");

  /* (a)(3) — Column 3, used verbatim. It already carries the compatibility
     group letter on explosives (1.1D) and any subsidiary in parentheses
     (3 (6.1)); rebuilding it from `base` would drop the letter every time. */
  els.push(`<span class="e-h">${esc(l.cls)}</span>`);
  seq.push("Hazard class");

  /* (a)(4) — Column 5, Roman numerals, with the exceptions named in the rule */
  const pgExcept = /^1\./.test(l.base) || l.base==="5.2" || l.base==="5.2tc" || !l.pg || l.pg==="—";
  if(pgExcept){
    flags.push({tone:"ok", txt:`<b>No packing group on this line, and that is correct.</b> Class 1 explosives, self-reactive substances, Division 5.2 materials and entries with no packing group assigned are excepted. An empty space here is not a missing element.`, cite:"172.202(a)(4)"});
  } else {
    if(/,/.test(l.pg)){
      /* The commas in a collapsed range would read as extra elements in a
         comma-separated description, so it is rendered as the placeholder it
         actually is rather than inlined. */
      const alts = l.pg.split(/,\s*/).join(" / ");
      els.push(`<span class="e-gap">…${esc(alts)}…</span>`);
      seq.push("Packing group");
      flags.push({tone:"warn", txt:`The 172.101 entry covers packing groups <b>${esc(alts)}</b> and HazPost cannot tell which this shipment is — that depends on the material, not the entry. The paper names <b>one</b>; read it off there. Shown as a gap above so it is not mistaken for three elements.`, cite:"172.202(a)(4)"});
    } else {
      els.push(`<span class="e-p">${esc(l.pg)}</span>`);
      seq.push("Packing group");
    }
  }

  /* 172.203(m) — the words and the zone, both */
  if(l.pih){
    flags.push({tone:"pih", txt:`Poison by inhalation. The paper must carry the words <b>Poison-Inhalation Hazard</b> or <b>Toxic-Inhalation Hazard</b> and <b>${esc(l.pih)}</b>, entered immediately after the shipping description. This is what sets a responder's isolation distance — check it is actually there.`, cite:"172.203(m)"});
  }
  if(l.subs){
    flags.push({tone:"", txt:`Subsidiary hazard <b>${esc(l.subs)}</b> appears in parentheses immediately after the primary class, which is how <span class="mono">${esc(l.cls)}</span> above is built. Check rather than insist: it is not required when a corresponding subsidiary label is not required.`, cite:"172.202(a)(3)"});
  }

  return {html: els.join(`<span class="e-c">, </span>`), flags, seq};
}

/** 172.200(b) — symbols A and W take a line out of the subpart by highway. */
function papExcepted(l){
  const sym = (l.sym||"").split(/[\s,]+/);
  if(sym.includes("A")) return {sym:"A", mode:"air"};
  if(sym.includes("W")) return {sym:"W", mode:"water"};
  return null;
}

function papersUnavailable(){
  return `<div class="card"><h4>Shipping paper text unavailable</h4>
    <p style="font-size:14px;line-height:1.5;color:var(--dim)">HazPost will not describe a requirement it could not load.</p>
    <div style="font:500 12.5px 'Roboto Mono';color:var(--bad);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:12px;word-break:break-word">${esc(PAPERS_URL)} — ${esc(papersError||"not loaded")}</div>
    <button class="btn" style="margin-top:12px" onclick="loadPapers().then(render)">Try again</button></div>`;
}

function papCheckView(){
  if(!load.length){
    return `<div class="card"><h4>Nothing on the trailer</h4>
      <div class="hint" style="margin-top:0">Shipping Papers reads the same load you built for placarding. Add lines in <a href="#" style="color:var(--brand)" onclick="view='placards';plcTab='builder';commit();return false">Placarding → Load Builder</a>, then come back.</div></div>`;
  }

  const marked = load.map(l=>({l, ex:papExcepted(l)}));
  const needing = marked.filter(m=>!m.ex);

  let h = `<div class="limitbox" style="margin-bottom:12px"><p><b>Compare, do not copy.</b> This is what the 172.101 table says each line should read like. Hold it against the paper in your hand. If they disagree, <b>the paper and the shipper win</b> — call the shipper. Do not correct the paper yourself, and do not copy this onto it. HazPost describes what should be there; it does not produce the document.</p></div>`;

  /* 177.817(d) / 172.200(b) — do not show requirements that are not reaching */
  if(!needing.length){
    h += `<div class="segv clear"><div class="hd"><span class="mark c">✓</span>No shipping paper description required</div>
      <p>Every line on this load carries a column 1 symbol that takes it out of Subpart C by highway. 177.817 does not apply to a material excepted from shipping paper requirements under 172.200.</p>
      <span class="cite">49 CFR 172.200(b), 177.817(d)</span></div>
      <div class="card"><h4>Which lines, and why</h4>` +
      marked.map(m=>`<div class="rule ok"><b>${idLabel(m.l)} ${esc(m.l.name.slice(0,44))}${m.l.name.length>44?"…":""}</b>
        <p>Symbol <b>${esc(m.ex.sym)}</b> — subject to the subchapter only when offered for transport by ${esc(m.ex.mode)}.</p>
        <span class="cite">49 CFR 172.200(b)</span></div>`).join("") +
      `<div class="why warn"><p style="font-size:13px">Three things this does not clear. It does not hold if the material is a <b>hazardous substance, hazardous waste or marine pollutant</b> — those stay in the subpart regardless. It says nothing about placarding or the other modules. And limited-quantity and consumer-commodity exceptions are the shipper's call, not something HazPost can read off the table.</p><span class="cite">49 CFR 172.200(b)</span></div>
      ${cfrFold("172.200(b)", papText("172.200","(b)"))}
      ${cfrFold("177.817(d)", papText("177.817","(d)"))}</div>`;
    return h;
  }

  h += `<div class="card"><h4>Expected basic description — ${needing.length} line${needing.length===1?"":"s"}</h4>`;
  needing.forEach(({l})=>{
    const d = basicDescription(l);
    h += `<div class="desc"><div class="desc-id">${idLabel(l)}</div>
      <div class="bd">${d.html}</div>
      <div class="seq">${d.seq.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
      ${d.flags.map(f=>`<div class="pflag ${f.tone}"><p>${f.txt}</p><span class="cite">49 CFR ${esc(f.cite)}</span></div>`).join("")}
    </div>`;
  });
  h += `<div class="hint">The four elements run in this order with nothing interspersed between them. Quantity, package counts and destination marks go before or after, never inside.</div>
    ${cfrFold("172.202(b)", papText("172.202","(b)"))}</div>`;

  /* lines that are on the trailer but out of the subpart */
  const out = marked.filter(m=>m.ex);
  if(out.length){
    h += `<div class="card"><h4>Not in the subpart by highway</h4>` +
      out.map(m=>`<div class="rule ok"><b>${idLabel(m.l)} ${esc(m.l.name.slice(0,44))}${m.l.name.length>44?"…":""}</b>
        <p>Symbol <b>${esc(m.ex.sym)}</b> — subject to the subchapter only when offered for transport by ${esc(m.ex.mode)}. Not so if it is a hazardous substance, hazardous waste or marine pollutant.</p>
        <span class="cite">49 CFR 172.200(b)</span></div>`).join("") + `</div>`;
  }

  /* what the app cannot supply */
  h += `<div class="card"><h4>Only the paper can supply these</h4>
    <div class="rule a"><b>Total quantity, and the number and type of packages</b>
      <p>Quantity by mass or volume with its unit, and the packages described — "12 drums". HazPost knows the gross weight you typed for placarding; it does not know how the shipment is packaged, and the two are not the same number.</p>
      <span class="cite">49 CFR 172.202(a)(5), (a)(7)</span>
      ${cfrFold("172.202(a)(7)", papText("172.202","(a)(7)"))}</div>

    <div class="rule a"><b>Emergency response telephone number</b>
      <p><b>Monitored at all times</b> the load is in transportation, by a person who knows the material or has immediate access to one. A number that rings out, or reaches an answering service or a beeper, does not satisfy this — that is a violation, not a technicality. Worth actually dialling it.</p>
      <span class="cite">49 CFR 172.604(a)</span>
      ${cfrFold("172.604(a)(1)", papText("172.604","(a)(1)"))}
      ${cfrFold("172.604(a)(2)", papText("172.604","(a)(2)"))}</div>

    <div class="rule a"><b>Shipper's certification</b>
      <p>An initial carrier may not accept a hazardous material unless the shipping paper carries the shipper's certification. Two kinds of shipment are excepted from it:</p>
      <ul><li>One transported entirely by private carriage</li>
      <li>A bulk shipment in a cargo tank the carrier supplied</li></ul>
      <p><b>Hazardous waste is not excepted</b> — it always needs the certification. And a subsequent carrier does not need 172.204 at all.</p>
      <span class="cite">49 CFR 172.204(b), 177.817(a), (b)</span>
      ${cfrFold("177.817(b)", papText("177.817","(b)"))}</div>

    <div class="rule a"><b>Emergency response information</b>
      <p>Immediately available, in English, and usable <b>away from the package</b> — so not sealed inside it. The ERG satisfies this. HazPost does not reproduce guide content; carry the official PHMSA ERG.</p>
      <span class="cite">49 CFR 172.602(a), (b)</span>
      ${cfrFold("172.602(b)", papText("172.602","(b)"))}</div>
  </div>`;

  return h;
}

function papWhereView(){
  const rule = (title, body, cite, verb) =>
    `<div class="rule a"><b>${esc(title)}</b>${body}<span class="cite">49 CFR ${esc(cite)}</span>${verb||""}</div>`;

  let h = `<div class="limitbox" style="margin-bottom:12px"><p><b>A correct paper in the wrong place is still a citation.</b> This rule is enforced on its own, and responders look in exactly the places it names.</p></div>`;

  h += `<div class="card"><h4>177.817(e) — where the paper sits</h4>` +
    rule("Tab it, or put it first",
      `<p>If it rides with other paperwork of any kind it must be <b>distinctly tabbed</b>, or appear first in the stack. A compliant paper buried mid-pile fails this.</p>`,
      "177.817(e)(1)", cfrFold("177.817(e)(1)", papText("177.817","(e)(1)"))) +
    rule("At the controls — both, not either",
      `<p>The rule joins two conditions with "and":</p>
       <ul><li>Within immediate reach while restrained by the <b>lap belt</b>; <b>and</b></li>
       <li>either readily visible to a person entering the driver's compartment, <b>or</b> in a holder mounted inside the driver's door.</li></ul>
       <p style="margin-top:6px">The second is an either/or. The first is not optional.</p>`,
      "177.817(e)(2)(i)", cfrFold("177.817(e)(2)(i)", papText("177.817","(e)(2)(i)"))) +
    rule("Away from the controls — two places only",
      `<p>In the holder mounted inside the driver's door, or on the driver's seat. That is the whole list. Not the sleeper, not the dash, not a door pocket on the other side.</p>`,
      "177.817(e)(2)(ii)", cfrFold("177.817(e)(2)(ii)", papText("177.817","(e)(2)(ii)"))) +
    `</div>`;

  h += `<div class="card"><h4>Retention — the office's job</h4>
    <div class="rule"><b>One year, or three for hazardous waste</b>
      <p>Held by the person who received the paper, accessible at or through the principal place of business, with the date of acceptance on the copy. This is the carrier's obligation, not something a driver carries.</p>
      <span class="cite">49 CFR 177.817(f)</span>
      ${cfrFold("177.817(f)", papText("177.817","(f)"))}</div></div>`;

  h += `<div class="card"><h4>Source</h4>
    <div class="hint" style="margin-top:0">${esc(PAPERS.source)}, current as of ${esc(PAPERS.cfrDate)} (text v${esc(PAPERS.version)}). Every plain-language line in this module is ours; the CFR paragraph it was written from sits under it.</div>
    ${cfrFolds("§ 177.817 — full text", papSec("177.817").paras.map(p=>["177.817"+(p.id||""), p.text]))}</div>`;
  return h;
}

/* ================= ON THE ROAD — 49 CFR Part 397 Subpart A =================

   Part 397 is prose, and the temptation is to ship it as a reg reader. A
   driver can already read the reg. What the app knows and the paper does not
   is what is on the trailer, and the part turns on exactly one question about
   that: is there Division 1.1, 1.2 or 1.3 aboard. Everything operational is
   that answer crossed with where the truck is sitting.

   Every plain-language line below is ours. The verbatim paragraph sits beside
   it, never instead of it — this is the module where a loose paraphrase does
   the most damage.                                                          */

const OPS_PLACES = [
  {k:"road",    lbl:"Public street, highway, or shoulder", hint:"Including the shoulder of a public highway."},
  {k:"private", lbl:"Private property — truck stop, eating facility, other business", hint:"Anywhere private that is not your carrier, the shipper, or the consignee."},
  {k:"carrier", lbl:"Property of the carrier, shipper, or consignee", hint:"Your own yard, the shipper's, or the receiver's."},
  {k:"haven",   lbl:"An approved safe haven", hint:"Approved in writing for parking unattended explosives. A fenced yard is not automatically one."},
];

const opsSec  = n => (OPS.sections.find(s=>s.n===n) || {paras:[]});
const opsText = (n,id) => { const p = opsSec(n).paras.find(x=>x.id===id); return p ? p.text : ""; };

/** Divisions that put a load in the strict tier. */
const TIER1_BASES = ["1.1","1.2","1.3"];

/** Is Division 1.1, 1.2 or 1.3 on the trailer?
    Part 397's operational tier and the 397.19 document set turn on the same
    question, so both modules ask it through this one function rather than each
    keeping its own copy of the test. */
function hasTier1(lines){ return (lines||[]).some(l=>TIER1_BASES.includes(l.base)); }

/** 397.13 names these and only these. */
const SMOKE_CLASSES = [
  {test:b=>/^1\./.test(b),      lbl:"Class 1"},
  {test:b=>/^5\./.test(b),      lbl:"Class 5"},
  {test:b=>b==="2.1",           lbl:"Division 2.1"},
  {test:b=>b==="3",             lbl:"Class 3"},
  {test:b=>b==="4.1",           lbl:"Division 4.1"},
  {test:b=>b==="4.2",           lbl:"Division 4.2"},
];

function opsCheck(){
  const r = load.length ? compute() : null;
  const placarded = !!(r && r.placards.length);
  const tier1 = hasTier1(load);
  /* a Class 1 subsidiary does not make the material a Division 1.1/1.2/1.3 —
     its class is whatever column 3 says — but it is worth putting in front of
     the driver rather than deciding silently */
  const cls1sub = load.filter(l=>String(l.subs||"").split(/,\s*/).some(t=>t==="1"||/^1\./.test(t)));
  const bases = [...new Set(load.map(l=>l.base))];
  const smoking = SMOKE_CLASSES.filter(c=>bases.some(c.test)).map(c=>c.lbl);
  return {placarded, tier1, cls1sub, smoking, place:opsPlace, placards:(r&&r.placards)||[]};
}

/* ---------- the decision ---------- */

function opsRules(st){
  const P = st.place, out = [];
  const R = (tone,title,body,cite,verb) => out.push({tone,title,body,cite,verb});

  if(st.tier1){
    /* --- 397.5 attendance --- */
    if(P==="haven"){
      R("care","Unattended is possible — but the bailee condition still stands",
        `A safe haven satisfies two of the three conditions on its own: the vehicle is in a safe haven, and being in a safe haven also satisfies the field-of-view condition. The third does not come free — the lawful bailee must still be aware of the nature of the explosives and instructed in emergency procedures. All three must exist together.`,
        "397.5(b)", opsText("397.5","(b)")+" "+opsText("397.5","(b)(1)")+" "+opsText("397.5","(b)(2)")+" "+opsText("397.5","(b)(3)"));
    } else if(P==="carrier"){
      R("care","Unattended only if all three conditions hold together",
        `Carrier, shipper or consignee property satisfies the first condition. The other two are facts about a person, not a place: the lawful bailee must be aware of what the explosives are and instructed in emergency procedures, and the vehicle must be in their unobstructed field of view. Miss one and attendance is still required.`,
        "397.5(b)(1)–(3)", opsText("397.5","(b)")+" "+opsText("397.5","(b)(1)")+" "+opsText("397.5","(b)(2)")+" "+opsText("397.5","(b)(3)"));
    } else {
      R("stop","Attended at all times — no exception reaches here",
        `The exception only reaches carrier, shipper or consignee property, a safe haven, or 50 lb or less on a construction or survey site. ${P==="road"?"A public street or highway is none of those.":"A truck stop or other business is none of those."}`,
        "397.5(a), (b)(1)", opsText("397.5","(a)"));
    }

    /* --- 397.7(a) parking --- */
    if(P==="road"){
      R("stop","Not on or within 5 feet of the traveled portion",
        `Flat prohibition for this load. The brief-necessity escape that other hazmat gets under 397.7(b) is not in 397.7(a)(1).`,
        "397.7(a)(1)", opsText("397.7","(a)")+" "+opsText("397.7","(a)(1)"));
    } else {
      R("care","The 5-foot rule still reaches a lot entrance",
        `Off the public roadway 397.7(a)(1) is not what stops you — but it applies to any part of the vehicle on or within 5 feet of the traveled portion, which a nose sticking out of an entrance can be.`,
        "397.7(a)(1)", opsText("397.7","(a)(1)"));
    }

    if(P==="private" || P==="carrier" || P==="haven"){
      R(P==="private"?"stop":"care", P==="private"?"Private property needs informed consent":"Consent still has to be informed",
        P==="private"
          ? `The rule names fueling and eating facilities specifically. Consent must come from the person in charge of the property, <b>and that person must be aware of what the vehicle contains</b>. An attendant who does not know what is on the trailer has not given consent under this rule.`
          : `Carrier, shipper and consignee property is still private property. Consent is normally implicit here, but the rule wants the person in charge to be aware of the nature of the materials${P==="haven"?" — and a safe haven may itself sit on private property":""}.`,
        "397.7(a)(2)", opsText("397.7","(a)(2)"));
    }

    R("stop","300 feet from a bridge, tunnel, dwelling, or where people gather",
      `The exception is narrow: brief periods when the necessities of operation require the vehicle to be parked and make parking anywhere else impracticable. Being tired at the end of a shift is not, on its own, that.${P==="haven"?" A safe haven approval is about parking unattended under 397.5 — 397.7(a)(3) carries no safe-haven exception on its face.":""}`,
      "397.7(a)(3)", opsText("397.7","(a)(3)"));

  } else {
    /* --- Tier 2 --- */
    if(P==="road"){
      R("care","Attended by its driver while here",
        `The rule is tied to being on a public street or highway or the shoulder — which is where you are. It does not apply while the driver is performing duties incident and necessary to operating the vehicle.`,
        "397.5(c)", opsText("397.5","(c)"));
      R("care","Not on or within 5 feet of the traveled portion",
        `Except for brief periods when the necessities of operation require the vehicle to be parked and make parking anywhere else impracticable.`,
        "397.7(b)", opsText("397.7","(b)"));
    } else {
      R("ok","397.5 does not reach you here",
        `The attendance rule for a load without 1.1, 1.2 or 1.3 is tied to being on a public street or highway or the shoulder. Parked off the roadway it does not apply to the driver at all — which is not obvious from reading it. Your carrier's policy or the customer may still require otherwise; that is not this rule.`,
        "397.5(c)", opsText("397.5","(c)"));
      R("ok","The 5-foot rule applies if you are near the roadway",
        `Off the public roadway 397.7(b) is not what stops you, but it reaches any part of the vehicle on or within 5 feet of the traveled portion.`,
        "397.7(b)", opsText("397.7","(b)"));
    }
  }
  return out;
}

/** The compounding conclusion, said plainly rather than left to be assembled. */
function opsHeadline(st){
  if(!st.tier1){
    return st.place==="road"
      ? null
      : null;
  }
  if(st.place==="private"){
    return {t:"A truck stop does not work for this load",
      p:`Put the three together. You must stay with the vehicle, so the sleeper berth is out. The lot is a place where people work and congregate, so the 300-foot rule bites. And parking there needs consent from someone who knows what is on your trailer. Plan the safe haven before you are out of hours, not after.`};
  }
  if(st.place==="road"){
    return {t:"You cannot park here",
      p:`397.7(a)(1) has no brief-necessity escape for a 1.1, 1.2 or 1.3 load, and attendance is required at all times with no exception that reaches a public roadway. This is a stop to move on from, not one to manage.`};
  }
  if(st.place==="carrier"){
    return {t:"Workable, if the bailee conditions actually hold",
      p:`This is one of the two places the attendance exception can reach. It turns on a person, not the address: someone must be a lawful bailee, know what the explosives are, be instructed in emergencies, and have the vehicle in view. If nobody there fits that, you are still attending the vehicle.`};
  }
  return {t:"This is the case that works",
    p:`A safe haven is the place designed for exactly this. Confirm it is approved in writing rather than simply fenced, and that the bailee condition is satisfied — the three conditions in 397.5(b) apply together, and the haven only answers two of them.`};
}

/* ---------- views ---------- */

function setOpsPlace(k){ opsPlace = k; commit(); }

function opsUnavailable(){
  return `<div class="card"><h4>Part 397 text unavailable</h4>
    <p style="font-size:14px;line-height:1.5;color:var(--dim)">HazPost will not paraphrase a rule it could not load.</p>
    <div style="font:500 12.5px 'Roboto Mono';color:var(--bad);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:12px;word-break:break-word">${esc(OPS_URL)} — ${esc(opsError||"not loaded")}</div>
    <button class="btn" style="margin-top:12px" onclick="loadOps().then(render)">Try again</button></div>`;
}

function opsWhereView(){
  if(!load.length){
    return `<div class="card"><h4>Nothing on the trailer</h4>
      <div class="hint" style="margin-top:0">On the Road reads the same load you built for placarding. Add lines in <a href="#" style="color:var(--brand)" onclick="view='placards';plcTab='builder';commit();return false">Placarding → Load Builder</a>, then come back.</div></div>`;
  }

  const st = opsCheck();

  /* 397.1 — the part hangs off the vehicle being marked or placarded */
  if(!st.placarded){
    return `<div class="card"><h4>Part 397 — does it apply?</h4>
      <div class="segv clear"><div class="hd"><span class="mark c">✓</span>Most of Part 397 does not apply</div>
        <p>Placarding shows <b>no placards required</b> for this load, and Part 397 hangs off the vehicle having to be marked or placarded. The driving and parking rules in Subpart A are not reaching you.</p>
        <span class="cite">49 CFR 397.1(a)</span></div>
      ${cfrFold("397.1(a)", opsText("397.1","(a)"))}
      <div class="hint">Two things this does not say. Add one more line and the aggregate can cross 1,001 lb, at which point it does apply. And 397.1 reads "marked <b>or</b> placarded" — HazPost computes placards, not markings, so a marking requirement is yours to check.</div>
      <div class="hint">§ 397.3 applies regardless: state and local law on driving and parking still binds you.</div>
      ${cfrFold("397.3", opsText("397.3",""))}
    </div>`;
  }

  const rules = st.place ? opsRules(st) : [];
  const head  = st.place ? opsHeadline(st) : null;

  let h = st.tier1
    ? `<div class="tierbar e"><span class="badge">Tier 1</span><div><b>Division 1.1, 1.2 or 1.3 aboard</b>
        <p>The strict tier. Attendance, parking setbacks and written documents all tighten.</p></div></div>`
    : `<div class="tierbar o"><span class="badge">Tier 2</span><div><b>Placarded, no 1.1, 1.2 or 1.3</b>
        <p>Baseline tier. The 5-foot rule, and attendance only while on the roadway.</p></div></div>`;

  if(st.cls1sub.length){
    h += `<div class="why warn" style="margin:0 0 12px"><p style="font-size:13px">${st.cls1sub.map(l=>idLabel(l)).join(", ")} carr${st.cls1sub.length===1?"ies":"y"} a <b>Class 1 subsidiary</b> label. That does not make the material a Division 1.1, 1.2 or 1.3 — its division is what column 3 assigns — so it does not by itself put you in Tier 1. Worth confirming against the papers.</p><span class="cite">49 CFR 397.5(a)</span></div>`;
  }

  /* the one question */
  h += `<div class="card"><h4>Where are you stopping?</h4>
    <div class="seg">` + OPS_PLACES.map(x=>
      `<button class="${st.place===x.k?'on':''}" onclick="setOpsPlace('${x.k}')">${esc(x.lbl)}</button>`).join("") +
    `</div>` +
    (st.place ? `<div class="hint" style="margin-top:8px">${esc((OPS_PLACES.find(x=>x.k===st.place)||{}).hint||"")}</div>` : `<div class="hint" style="margin-top:8px">Part 397 crosses what is on the trailer with where the truck is sitting. Pick one to see what applies.</div>`) +
    `</div>`;

  if(!st.place) return h;

  if(head) h += `<div class="opshead ${st.tier1&&(st.place==="private"||st.place==="road")?"bad":"ok"}"><b>${esc(head.t)}</b><p>${head.p}</p></div>`;

  h += `<div class="card"><h4>What applies right now</h4>` +
    rules.map(x=>`<div class="rule ${x.tone}"><b>${esc(x.title)}</b><p>${x.body}</p>
      <span class="cite">49 CFR ${esc(x.cite)}</span>${cfrFold(x.cite, x.verb)}</div>`).join("");

  /* what "attended" means, wherever attendance is live */
  if(st.tier1 || st.place==="road"){
    h += `<div class="eyebox"><b>What "attended" actually means</b>
      <p>On the vehicle, awake, and <b>not in a sleeper berth</b> — or within 100 feet of it with the vehicle in an unobstructed field of view. A locked truck out of sight is not attended.</p>
      ${cfrFold("397.5(d)(1)", opsText("397.5","(d)(1)"))}</div>`;
  }
  if(st.tier1){
    h += `<div class="eyebox"><b>What a safe haven is</b>
      <p>An area <b>specifically approved in writing</b> by local, State or Federal authority for parking unattended explosives. A fenced yard is not automatically a safe haven, and that assumption turns up in enforcement cases.</p>
      ${cfrFold("397.5(d)(3)", opsText("397.5","(d)(3)"))}</div>`;
  }

  h += `<div class="limitbox"><p><b>What this cannot tell you.</b> HazPost has no map and does not know what is around your truck. It cannot measure 300 feet to a dwelling, cannot recognise a place where people assemble, and cannot tell you whether the lot you are in is an approved safe haven. It tells you which rules apply and what to look for. The looking is yours.</p></div>`;
  h += `</div>`;

  return h + opsAlwaysOn(st);
}

/** 397.11, 397.13, 397.15, 397.17, 397.19 — any placarded load. */
function opsAlwaysOn(st){
  let h = `<div class="card"><h4>Always on — any placarded load</h4>`;

  /* The verbatim text is on every card, but folded. Printed flat these five
     sections run longer than the decision they sit under, and the section a
     driver came here for stops being findable. It is one tap, never a
     summary standing in for the rule, and the Reference tab has it all open. */
  const card = (n, title, body, extra) =>
    `<div class="rule"><b>${esc(title)}</b>${body?`<p>${body}</p>`:""}${extra||""}
      ${cfrFolds(`§ ${n} — full text`, opsSec(n).paras.map(p=>[n+(p.id||""), p.text]))}</div>`;

  h += card("397.11", "Fires", `Not operated near an open fire without first checking the vehicle can pass safely without stopping, and not parked within 300 feet of one.`);

  h += card("397.13", "Smoking — 25 feet",
    `The setback names specific classes rather than all hazmat.`,
    st.smoking.length
      ? `<div class="onboard"><b>On your trailer</b><p>${st.smoking.map(esc).join(" · ")}</p></div>`
      : `<div class="onboard ok"><b>On your trailer</b><p>None of the classes 397.13(a) names are aboard. Paragraph (b) can still reach an empty tank vehicle that carried Class 3, flammable material or Division 2.1.</p></div>`);

  h += card("397.15", "Fueling", `Engine off, and someone in control of the process at the point where the tank is filled.`);

  h += card("397.17", "Tires",
    `Examine each tire at the <b>beginning of each trip and each time the vehicle is parked</b>. The current text sets no clock and no mileage — the trigger is the trip and the stop, so a long run with no stops is not a run with no checks.`);

  h += card("397.19", "Instructions and documents",
    st.tier1
      ? `This one is yours right now: the carrier must furnish a copy of the rules in this part and written emergency instructions, you sign a receipt, and you must have and be familiar with those plus the 177.817 shipping papers and the written route plan under 397.67.`
      : `Tied to Division 1.1, 1.2 and 1.3, so it is <b>not</b> reaching this load. It would if an explosive of those divisions came aboard.`,
    st.tier1 ? "" : `<div class="onboard ok"><b>Applies to</b><p>Division 1.1, 1.2 and 1.3 only.</p></div>`);

  return h + `</div>`;
}

function opsRefView(){
  let h = `<div class="card"><h4>${esc(OPS.source)}</h4>
    <div class="hint" style="margin-top:0">Verbatim, as generated from the eCFR API. Everything the decision view says in plain language is our wording; this is the text it was written from.</div></div>`;

  OPS.sections.forEach(s=>{
    h += `<div class="card"><h4>${esc(s.head.replace(/^§\s*/,""))}</h4>` +
      (s.reserved
        ? `<p style="font-size:13.5px;color:var(--dim)">[Reserved]</p>`
        : s.paras.map(p=>`<div class="refp">${p.id?`<span class="pid">${esc(p.id)}</span>`:""}<p>${esc(p.text)}</p></div>`).join("")) +
      `</div>`;
  });

  h += `<div class="card"><h4>Not covered</h4>` +
    OPS.otherSubparts.map(s=>`<div class="rule"><b>Subpart ${esc(s.id)}</b><p>${esc(s.head.replace(/^Subpart\s+\w+\s*—?\s*/,"")||"[Reserved]")}</p></div>`).join("") +
    `<div class="hint">Subparts C and D are routing and the national route registry; Subpart E is preemption procedure. HazPost implements none of them, and does not do routing at all.</div>
    <div class="hint">${esc(OPS.source)}, current as of ${esc(OPS.cfrDate)} (text v${esc(OPS.version)}).</div></div>`;
  return h;
}

/* ================= INCIDENT RESPONSE — 49 CFR 171.15, 171.16 =================

   Somebody may open this module in the worst hour of their working life. Three
   things hold above layout, elegance and consistency with the rest of the app:

   1. The landing view is who to call. No question, no load check, no decision
      tree, nothing to dismiss. 911 is the first element and it is a tel: link.
   2. No code path may produce text meaning no report is required. 171.15(b)(5)
      makes the last word a judgment about the scene, and HazPost cannot see
      the scene. tools/test-incident.mjs asserts this over every subset of the
      checklist and is part of the test suite.
   3. The NRC is a regulatory notification, not a call for help. Nobody is
      dispatched because you called it. The landing view says so.

   Not a response guide. No isolation distances, no protective actions, no
   product handling, no ERG guide content — that is the ERG and the emergency
   number on the shipping paper.                                             */

const incSec  = n => ((INC && INC.sections.find(s=>s.n===n)) || {paras:[]});
const incText = (n,id) => { const p = incSec(n).paras.find(x=>x.id===id); return p ? p.text : ""; };
const incNote = () => { const p = incSec("171.15").paras.find(x=>x.note); return p ? p.text : ""; };
const NRC_TEL = () => (INC && INC.nrc && INC.nrc.tollFree) || "800-424-8802";

/**
 * The 171.15(b) checklist, in the order the rule lists it.
 *
 * The wording is ours; the paragraph it was written from sits under the card
 * verbatim. (b)(6) is not here: it is expressly "during transportation by
 * aircraft", so it cannot fire on a highway load. It is called out in the
 * reference card so the list does not look as if it is missing one.
 */
const INC_TRIGGERS = [
 {k:"kill",   c:"171.15(b)(1)(i)",   t:"As a direct result of the hazardous material, <b>a person was killed</b>."},
 {k:"hosp",   c:"171.15(b)(1)(ii)",  t:"A person received <b>an injury requiring admittance to a hospital</b>, as a direct result of the hazardous material."},
 {k:"evac",   c:"171.15(b)(1)(iii)", t:"The general public was <b>evacuated for one hour or more</b>."},
 {k:"artery", c:"171.15(b)(1)(iv)",  t:"A <b>major transportation artery or facility was closed or shut down for one hour or more</b>."},
 {k:"flight", c:"171.15(b)(1)(v)",   t:"The <b>operational flight pattern or routine of an aircraft was altered</b> — rare off an airport, but it is on the list."},
 {k:"rad",    c:"171.15(b)(2)",      t:"Fire, breakage, spillage, or <b>suspected radioactive contamination</b> involving a radioactive material."},
 {k:"inf",    c:"171.15(b)(3)",      t:"Fire, breakage, spillage, or suspected contamination involving an <b>infectious substance</b>, other than a regulated medical waste."},
 {k:"marine", c:"171.15(b)(4)",      t:"A release of a <b>marine pollutant</b> over 450 L (119 gallons) liquid, or 400 kg (882 pounds) solid."},
 {k:"judg",   c:"171.15(b)(5)",      judgment:true,
  t:"In <b>your judgment</b> as the person in possession of the material, this should be reported — the example the rule gives is a <b>continuing danger to life</b> at the scene."},
];

/**
 * The verdict, as a pure function of the checklist. Called by the view and
 * directly by tools/test-incident.mjs.
 *
 * It is total on purpose: every one of the 2^9 inputs returns a verdict whose
 * action is a phone call. There is no "not reportable" branch, because
 * (b)(5) means an empty checklist is not an answer — it is an unanswered
 * question that belongs to a human at the scene, and then to the carrier.
 */
function incidentVerdict(picked){
  const p = picked || {};
  const hit = INC_TRIGGERS.filter(t=>p[t.k]);
  const listed = hit.filter(t=>!t.judgment);
  if(listed.length){
    return {kind:"required", basis:"listed", hit:listed,
      action:`Telephone notice to the NRC on ${NRC_TEL()}, as soon as practical and no later than 12 hours.`};
  }
  if(hit.length){
    return {kind:"required", basis:"judgment", hit,
      action:`Telephone notice to the NRC on ${NRC_TEL()}, as soon as practical and no later than 12 hours.`};
  }
  return {kind:"unsettled", basis:"none", hit:[],
    action:"Call your carrier's safety desk and describe what happened. The judgment in 171.15(b)(5) is theirs and yours to make, not HazPost's."};
}

/** The verdict block. Pure in `picked`, so the test can render every subset. */
function incVerdictHTML(picked){
  const v = incidentVerdict(picked);
  const nrc = NRC_TEL();
  const carrierLine = carrier
    ? `<a class="call" href="tel:${esc(telSafe(carrier.tel))}"><span class="n">Carrier</span>
        <div class="t"><b>${esc(carrier.name||"Your safety desk")}</b><span class="num">${esc(carrier.tel)}</span></div></a>`
    : `<p>Your carrier's safety desk normally makes this call. Store their number on the <b>Right now</b> tab and it will be one tap from here.</p>`;

  if(v.kind==="required"){
    return `<div class="verdict yes"><b class="hd">Immediate telephone notice to the NRC is required</b>
      <p>Call <b>${esc(nrc)}</b> as soon as practical, and no later than <b>12 hours</b> after it happened. Tell your carrier now as well — do not assume they already know, and do not assume they have called.</p>
      ${v.basis==="judgment"
        ? `<p>You answered that this should be reported in your judgment. That is a trigger in its own right, and it stands whether or not any of the listed circumstances applies.</p>`
        : `<p>Triggered by: ${v.hit.map(t=>`<b>${esc(t.c.replace("171.15",""))}</b>`).join(", ")}.</p>`}
      <p>A written report on Form 5800.1 also becomes due — see the <b>Written report</b> tab.</p>
      <a class="call urgent" href="tel:${esc(nrc.replace(/[^\d+]/g,""))}"><span class="n" style="font-size:19px">NRC</span>
        <div class="t"><b>National Response Center</b><span class="num">${esc(nrc)}</span></div></a>
      ${carrierLine}
      <span class="cite">49 CFR 171.15(a), (b), (c)</span></div>`;
  }

  /* Nothing ticked. This is the branch the invariant is about. */
  return `<div class="verdict judg"><b class="hd">Nothing ticked. That does not settle it.</b>
    <p>The rule carries a judgment trigger of its own. The decision is yours, as the person in physical possession of the material. If in your judgment the situation should be reported, telephone notice is required — even though none of the listed circumstances above applies. A continuing danger to life at the scene is the example the rule itself gives, not the only case.</p>
    <p><b>HazPost cannot make that judgment.</b> It cannot see the scene, it does not know what leaked or how much, and it will not tell you the matter is closed. If anything happened at all, call your carrier's safety desk and describe it.</p>
    <p>The <b>Written report</b> tab matters here too: Form 5800.1 catches incidents the telephone notice never reaches.</p>
    ${carrierLine}
    ${cfrFold("171.15(b)(5)", incText("171.15","(b)(5)"))}
    <span class="cite">49 CFR 171.15(b)(5)</span></div>`;
}

/* ================= WHAT YOU CARRY — 383.93, 383.141, 172.704 =================

   This tile used to be called Credentials and was cited to 172.704, and that
   framing was wrong from end to end. 172.704 is an employer obligation
   throughout: the hazmat employer trains, tests, certifies and keeps the
   record, and (c)(4) puts compliance on the employer whether or not the
   training was ever done. A driver carries no training certificate and cannot
   act on the three-year clock except by asking their carrier. A module built
   around that clock answers a question the driver does not have.

   What the driver does have is a wallet of things that expire and an inspector
   asking for them. That is what this is.

   No photographs, no scans, no uploads, no image storage of any credential —
   see the note in carExpView(). Dates are low stakes if the phone is lost;
   images of a licence and a medical card are not.                           */

const carSec  = n => ((CAR && CAR.sections.find(s=>s.n===n)) || {paras:[]});
const carText = (n,id) => { const p = carSec(n).paras.find(x=>x.id===id); return p ? p.text : ""; };

/* ---------------- DATE ARITHMETIC ----------------
   Pure and separate from the view, because this is the part that has to be
   right across a month end, a year end and a leap day, and the only way to
   know it is is to test it directly. tools/test-carry.mjs does.

   Everything runs on UTC midnights. The phone's local calendar date goes in,
   is reinterpreted as a UTC midnight, and the difference is exact whole days —
   no DST hour can round a boundary the wrong way. */

/** A calendar date, or null. Null covers unset, malformed and impossible
    alike: the module has one "not set" state and no error state. */
function parseISODate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s==null?"":s).trim());
  if(!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  const t = Date.UTC(y, mo-1, d);
  const dt = new Date(t);
  /* round-trip: rejects 2026-02-30 and 2026-13-01, which Date.UTC would
     silently roll forward into a different month */
  if(dt.getUTCFullYear()!==y || dt.getUTCMonth()!==mo-1 || dt.getUTCDate()!==d) return null;
  return t;
}

const isoOf = t => new Date(t).toISOString().slice(0,10);

/** Today on the phone's own calendar, not UTC's — a driver at 8pm in Denver
    is on today's date, not tomorrow's. */
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

/** Whole days from `today` to `iso`. Negative is past. Null if either is unset
    or unparseable. */
function daysUntil(iso, today){
  const a = parseISODate(iso);
  if(a===null) return null;
  const b = parseISODate(today || todayISO());
  if(b===null) return null;
  return Math.round((a - b) / 86400000);
}

/** `iso` plus n calendar years. 29 February plus three years does not exist,
    and rolling it forward to 1 March would push a due date into the next
    month; clamped back to the 28th so the prompt comes early rather than
    late. */
function addYears(iso, n){
  const t = parseISODate(iso);
  if(t===null) return null;
  const d = new Date(t), mo = d.getUTCMonth();
  const out = new Date(Date.UTC(d.getUTCFullYear()+n, mo, d.getUTCDate()));
  if(out.getUTCMonth()!==mo) out.setUTCDate(0);
  return isoOf(out);
}

const plural = (n, w) => `${n} ${w}${Math.abs(n)===1?"":"s"}`;

/** The badge. Thresholds are expired, inside 60 days, inside 180, then fine. */
function expStatus(days){
  if(days===null)  return {cls:"none", txt:"Not set"};
  if(days < 0)     return {cls:"bad",  txt:`Expired ${plural(-days,"day")} ago`};
  if(days === 0)   return {cls:"bad",  txt:"Expires today"};
  if(days <= 60)   return {cls:"bad",  txt:`${plural(days,"day")} left`};
  if(days <= 180)  return {cls:"soon", txt:`${plural(days,"day")} left`};
  return {cls:"ok", txt:`${plural(days,"day")} left`};
}

/**
 * One row of the tracker, resolved. `add` is the field that is not an expiry
 * at all — the driver types the date of their last training and the rule adds
 * three years, so the date typed and the date that matters are different, and
 * both are shown.
 */
function expRow(field, stored, today){
  const typed = stored[field.k] || "";
  const due = field.addYears ? addYears(typed, field.addYears) : (parseISODate(typed)!==null ? typed : null);
  const days = due===null ? null : daysUntil(due, today);
  return {typed, due, days, status:expStatus(days)};
}
