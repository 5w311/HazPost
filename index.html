<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HazPost — Hazmat Tools for Drivers</title>
<meta name="description" content="Hazmat placarding and lookup tools for truck drivers, built to work with no signal.">
<meta name="theme-color" content="#14171C">
<!-- All install paths are relative: HazPost is a GitHub Pages project site
     under /HazPost/, so a leading slash would resolve to the domain root. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<!-- iOS ignores the manifest for Add to Home Screen on anything before 16.4,
     and never reads it for the icon. These three carry the install there. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HazPost">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171C; --panel:#1C2129; --panel2:#232A34; --line:#2E3743;
  --ink:#EDF0F4; --dim:#8B96A5; --faint:#5A6473;
  --flam:#C8102E; --oxy:#FFB612; --wet:#0F5FBF; --gas:#1E8A44;
  --expl:#FF6720; --tox:#F2F2F2; --brand:#FFB612;
  --ok:#3BAA5C; --warn:#FFB612; --bad:#E5484D;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;font-size:16px;overscroll-behavior:none}
.mono{font-family:'Roboto Mono',monospace}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* header */
header{padding:18px 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:20}
.logo-d{width:34px;height:34px;position:relative;flex:none}
.logo-d::before{content:"";position:absolute;inset:3px;background:var(--brand);transform:rotate(45deg);border-radius:4px}
.logo-d::after{content:"HZ";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 13px 'Barlow Condensed';color:#14171C;letter-spacing:.5px}
h1{font:700 22px/1 'Barlow';letter-spacing:.2px}
h1 span{color:var(--brand)}
.sub{font-size:12.5px;color:var(--dim);margin-top:3px}
.back{background:none;border:none;color:var(--brand);font:600 15px 'Barlow';padding:6px 10px 6px 0;cursor:pointer;display:none;align-items:center;gap:4px}
main{flex:1;padding:0 18px calc(40px + env(safe-area-inset-bottom, 0px))}

/* offline indicator — a strip under the header, only while actually offline */
.offbar{display:flex;align-items:center;gap:9px;margin:0 18px 12px;padding:8px 11px;background:#2A2418;border:1px solid #5A4A1E;border-radius:10px;font-size:12.5px;color:#E8C877;line-height:1.4}
.offbar[hidden]{display:none}
.offbar .dot{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 0 3px rgba(255,182,18,.16)}
.offbar b{font-weight:700;color:#FFCE5C}
.offbar .when{color:#A8936A;white-space:nowrap}

/* module grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 14px;cursor:pointer;position:relative;transition:transform .08s ease;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:scale(.97)}
.tile .td{width:26px;height:26px;position:relative;margin-bottom:10px}
.tile .td::before{content:"";position:absolute;inset:2px;transform:rotate(45deg);border-radius:3px;background:var(--tc,#39424F)}
.tile h3{font:700 16.5px 'Barlow';letter-spacing:.2px}
.tile p{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35}
.tile .cfr{font:500 10.5px 'Roboto Mono';color:var(--faint);margin-top:8px}
.tile.stub{opacity:.62}
.tile.stub::after{content:"NEXT";position:absolute;top:12px;right:12px;font:700 9.5px 'Barlow Condensed';letter-spacing:1.2px;color:var(--faint);border:1px solid var(--line);padding:3px 6px;border-radius:20px}
.tile.live::after{content:"LIVE";position:absolute;top:12px;right:12px;font:700 9.5px 'Barlow Condensed';letter-spacing:1.2px;color:#14171C;background:var(--ok);padding:3px 7px;border-radius:20px}

/* tabs */
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin:6px 0 16px}
.tabs button{flex:1;border:none;background:none;color:var(--dim);font:600 14.5px 'Barlow';padding:9px 0;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--ink)}

/* load builder */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h4{font:700 13px 'Barlow Condensed';letter-spacing:1.4px;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.row{display:flex;gap:8px;margin-bottom:8px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:500 15px 'Barlow';padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--brand)}
input.mono{font:500 15px 'Roboto Mono'}
.btn{background:var(--brand);color:#14171C;border:none;border-radius:10px;font:700 15px 'Barlow';padding:12px 16px;cursor:pointer;width:100%}
.btn:active{opacity:.85}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.hint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.4}
.sugg{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-top:-4px;margin-bottom:8px;max-height:180px;overflow:auto;display:none}
.sugg div{padding:10px 12px;font-size:13.5px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:last-child{border-bottom:none}
.sugg .u{font:600 13px 'Roboto Mono';color:var(--brand);margin-right:8px}

/* load lines */
.line-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.line-item .un{font:700 14px 'Roboto Mono';color:var(--brand);flex:none}
.line-item .nm{flex:1;min-width:0}
.line-item .nm b{display:block;font:600 14px 'Barlow';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line-item .nm span{font-size:11.5px;color:var(--dim)}
.line-item .wt{font:500 13px 'Roboto Mono';color:var(--ink);flex:none}
.line-item .x{background:none;border:none;color:var(--faint);font-size:18px;cursor:pointer;flex:none;padding:2px 4px}
.t1tag{font:700 9px 'Barlow Condensed';letter-spacing:1px;background:var(--bad);color:#fff;padding:2px 5px;border-radius:4px;margin-left:6px;vertical-align:2px}

/* trailer result */
.trailer{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.trailer h4{font:700 13px 'Barlow Condensed';letter-spacing:1.4px;color:var(--dim);text-transform:uppercase}
.trailer .tr-body{background:repeating-linear-gradient(90deg,var(--panel2) 0 46px,var(--line) 46px 47px);border:2px solid var(--line);border-radius:8px;min-height:120px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:18px;padding:20px 10px;flex-wrap:wrap}
.tr-none{color:var(--faint);font-size:14px}
.plc{width:86px;height:86px;position:relative;flex:none}
.plc .dia{position:absolute;inset:6px;transform:rotate(45deg);border-radius:6px;border:2.5px solid rgba(0,0,0,.55);overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.plc .fill{position:absolute;width:141.4%;height:141.4%;left:-20.7%;top:-20.7%;transform:rotate(-45deg)}
.plc .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;text-align:center}
.plc .w{font:800 11px 'Barlow Condensed';letter-spacing:.6px;line-height:1.05;text-transform:uppercase}
.plc .n{font:800 17px 'Barlow Condensed';margin-top:2px}
.plc .cap{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font:600 10px 'Barlow Condensed';letter-spacing:1px;color:var(--dim);text-transform:uppercase}

/* reasoning */
.why{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}
.why.ok{border-color:var(--ok)} .why.warn{border-color:var(--warn)} .why.bad{border-color:var(--bad)}
.why p{font-size:14px;line-height:1.45}
.why .cite{display:inline-block;font:500 11px 'Roboto Mono';color:var(--faint);margin-top:3px}
.optlbl{font:700 12px 'Barlow Condensed';letter-spacing:1.4px;color:var(--brand);text-transform:uppercase;margin:14px 0 4px}

/* lookup detail */
.lk{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:14px;margin-top:10px}
.lk .un{font:700 18px 'Roboto Mono';color:var(--brand)}
.lk h5{font:700 17px 'Barlow';margin:4px 0 10px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-weight:600;text-align:right}
.pill{display:inline-block;font:700 11px 'Barlow Condensed';letter-spacing:1px;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.pill.t1{background:var(--bad);color:#fff}.pill.t2{background:var(--panel);border:1px solid var(--line);color:var(--dim)}

/* stub view */
.stubview{text-align:center;padding:60px 20px;color:var(--dim)}
.stubview .big-d{width:64px;height:64px;position:relative;margin:0 auto 18px;opacity:.5}
.stubview .big-d::before{content:"";position:absolute;inset:5px;transform:rotate(45deg);border-radius:6px;border:2.5px dashed var(--faint)}
.stubview h3{font:700 20px 'Barlow';color:var(--ink);margin-bottom:8px}
.stubview p{font-size:14px;line-height:1.5;max-width:320px;margin:0 auto}
.stubview .cfr{font:500 12px 'Roboto Mono';color:var(--faint);margin-top:14px;display:block}

.disclaimer{font-size:11.5px;color:var(--faint);line-height:1.5;padding:14px 4px 0;border-top:1px solid var(--line);margin-top:20px}

/* segregation module */
.segchip{font:700 9.5px 'Barlow Condensed';letter-spacing:.8px;padding:2px 6px;border-radius:4px;text-transform:uppercase;flex:none}
.segchip.sub{background:#3A2E4A;color:#C9A7E8}
.segv{border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid}
.segv.x{background:#2A1618;border-color:#6B2429}
.segv.o{background:#2A2415;border-color:#6B5520}
.segv.s{background:#1E2430;border-color:#39424F}
.segv.clear{background:#16241A;border-color:#265731}
.segv.pend{background:#241E15;border-color:#5A4A1E}
.segv .hd{font:800 15px 'Barlow';display:flex;align-items:center;gap:8px;margin-bottom:6px}
.segv p{font-size:13.5px;line-height:1.5;color:#DCE2EA}
.segv .mark{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font:800 13px 'Barlow Condensed';flex:none}
.segv .mark.x{background:var(--bad);color:#fff}
.segv .mark.o{background:var(--brand);color:#111}
.segv .mark.s{background:#39424F;color:var(--brand)}
.segv .mark.c{background:var(--ok);color:#fff}
.segv .mark.p{background:var(--warn);color:#111}
.segv .cite{display:inline-block;font:500 11px 'Roboto Mono';color:var(--faint);margin-top:8px}
.pairline{font:500 12px 'Roboto Mono';color:var(--dim);margin-top:6px;line-height:1.45}
.pairline.sub{color:#C9A7E8}
.stateq{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
.stateq p{font-size:13.5px;line-height:1.45}
.stateq p.q{color:var(--dim);margin:5px 0 10px}
.c1sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.c1chip{font:500 11.5px 'Roboto Mono';background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 8px;color:var(--dim)}
.c1chip b{color:var(--brand);font-weight:700}
.c1res,.c1rules{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:10px}
.c1res h5,.c1rules h5{font:700 12px 'Barlow Condensed';letter-spacing:1.3px;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.c1res p,.c1rules p{font-size:13.5px;line-height:1.5;margin-bottom:8px}
.c1res p:last-child,.c1rules p:last-child{margin-bottom:0}
.c1res p.warn{color:#FFCE5C}
.c1res .cite,.c1rules .cite{display:block;font:500 11px 'Roboto Mono';color:var(--faint);margin-top:3px}
.matwrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table.mat{border-collapse:collapse;font:600 10px 'Roboto Mono'}
table.mat th,table.mat td{width:27px;height:27px;text-align:center;border:1px solid #262E39;padding:0}
table.mat th{background:var(--panel2);color:var(--dim);font-size:8.5px;position:sticky;top:0;z-index:2}
table.mat th.rh{position:sticky;left:0;z-index:3;width:52px;min-width:52px;text-align:left;padding-left:5px}
table.mat td.x{background:rgba(229,72,77,.85);color:#fff}
table.mat td.o{background:rgba(255,182,18,.85);color:#111}
table.mat td.s{background:#39424F;color:var(--brand)}
table.mat td.n{background:#2A3140;color:var(--brand);font-size:9px}
table.mat td.b{background:var(--panel)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend i.x{background:rgba(229,72,77,.85)} .legend i.o{background:rgba(255,182,18,.85)}
.legend i.s{background:#39424F} .legend i.b{background:var(--panel);border:1px solid var(--line)}

/* version footer — home only, tap to check for a new build */
.verfoot{display:block;width:100%;background:none;border:none;cursor:pointer;
  font:500 10.5px 'Roboto Mono',monospace;letter-spacing:.4px;color:var(--faint);
  text-align:center;padding:14px 4px 2px}
.verfoot:active{opacity:.6}
.verfoot.live{color:var(--brand)}
.hidden{display:none!important}

/* data loading / error states */
.dstate{text-align:center;padding:56px 20px}
.dstate .big-d{width:56px;height:56px;position:relative;margin:0 auto 18px}
.dstate .big-d::before{content:"";position:absolute;inset:4px;transform:rotate(45deg);border-radius:6px;border:2.5px solid var(--line);border-top-color:var(--brand);animation:spin 1s linear infinite}
.dstate.err .big-d::before{border:2.5px solid var(--bad);animation:none}
.dstate.err .big-d::after{content:"!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 22px 'Barlow';color:var(--bad)}
@keyframes spin{to{transform:rotate(405deg)}}
.dstate h3{font:700 19px 'Barlow';margin-bottom:8px}
.dstate p{font-size:14px;line-height:1.5;color:var(--dim);max-width:340px;margin:0 auto}
.dstate .msg{font:500 12.5px 'Roboto Mono';color:var(--bad);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:14px auto 0;max-width:340px;word-break:break-word;text-align:left}
.dstate .btn{max-width:220px;margin:18px auto 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="backBtn" onclick="go('home')">‹ Back</button>
    <div class="logo-d" id="logoD"></div>
    <div>
      <h1>Haz<span>Post</span></h1>
      <div class="sub" id="subTitle">Hazmat tools built for the driver's seat</div>
    </div>
  </header>
  <div class="offbar" id="offBar" hidden></div>
  <main id="main"></main>
</div>

<script>
/* The build a driver is running, shown in the home footer.
   Bump this and VERSION in sw.js together on every deploy — see README. */
const APP_VERSION = "0.4.1";

/* ---------------- DATA: the 172.101 table, fetched from hazmat.json ---------------- */
const DATA_URL = "hazmat.json";
const SEG_URL = "segregation.json";
let HM = [];           /* material records */
let HMMETA = null;     /* provenance: source, cfrDate, generated */
let SEG = null;        /* 177.848 tables; null if segregation.json didn't load */
let segError = "";
let dataState = "loading";   /* loading | ready | error */
let dataError = "";

async function loadData(){
  dataState="loading"; dataError=""; render();
  try{
    const res = await fetch(DATA_URL, {cache:"no-cache"});
    if(!res.ok) throw new Error(`the server answered ${res.status} ${res.statusText||""}`.trim());
    let doc;
    try{ doc = await res.json(); }
    catch(e){ throw new Error("hazmat.json is not valid JSON"); }
    const recs = Array.isArray(doc) ? doc : doc && doc.records;
    if(!Array.isArray(recs)) throw new Error("hazmat.json has no records array");
    if(!recs.length) throw new Error("hazmat.json contains zero material records");
    HM = recs;
    HMMETA = Array.isArray(doc) ? null : doc;
    dataState="ready";
    /* only once the table is in hand — restored lines are re-classified from it */
    restoreLoad();
    /* Segregation data is loaded separately and is not fatal: losing it must
       not take the placarding module down with it. The segregation module
       says so for itself if this fails. */
    await loadSeg();
  }catch(e){
    dataError = (e && e.message) ? e.message : String(e);
    dataState="error";
  }
  await readCacheMeta();
  render();
  paintOffline();
}

async function loadSeg(){
  segError = "";
  try{
    const res = await fetch(SEG_URL, {cache:"no-cache"});
    if(!res.ok) throw new Error(`the server answered ${res.status} ${res.statusText||""}`.trim());
    const doc = await res.json();
    if(!Array.isArray(doc.table) || doc.table.length!==18) throw new Error("segregation table is not 18 rows");
    if(!Array.isArray(doc.categories) || doc.categories.length!==18) throw new Error("segregation categories are not 18");
    SEG = doc;
  }catch(e){
    SEG = null;
    segError = (e && e.message) ? e.message : String(e);
  }
}

/* proper shipping names come straight out of the CFR — escape before they hit innerHTML */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* the table carries UN, NA and ID numbers — don't print "UN" over an NA number */
function idLabel(x){ return `${(x&&x.pfx)||"UN"}${x?x.un:""}`; }

/* provenance line for the disclaimer */
function dataNote(){
  if(!HMMETA) return `${HM.length.toLocaleString()} entries loaded.`;
  const d = HMMETA.cfrDate ? ` as of ${HMMETA.cfrDate}` : "";
  const v = HMMETA.version ? ` (data v${HMMETA.version})` : "";
  return `Material data: ${HM.length.toLocaleString()} entries from ${HMMETA.source||"hazmat.json"}${d}${v}.`;
}

/* ---------------- OFFLINE STATUS ---------------- */
/* The service worker stamps every cache refresh into __cache-meta; the page
   reads it back so a driver in a dead zone can see how old the answer is. */
let cacheMeta = null;

async function readCacheMeta(){
  if(!("caches" in window)) return;
  try{
    const res = await caches.match(new URL("__cache-meta", location.href).toString());
    if(res) cacheMeta = await res.json();
  }catch(e){ /* storage blocked (private mode) — the indicator just omits the date */ }
}

function fmtWhen(iso){
  const d = new Date(iso);
  if(isNaN(d)) return null;
  const sameDay = d.toDateString() === new Date().toDateString();
  return sameDay
    ? `today ${d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}`
    : d.toLocaleDateString([], {day:"numeric", month:"short"});
}

function paintOffline(){
  const el = document.getElementById('offBar');
  if(!el) return;
  if(navigator.onLine){ el.hidden = true; return; }
  const gen = HMMETA && HMMETA.generated;
  const ref = cacheMeta && cacheMeta.refreshed && fmtWhen(cacheMeta.refreshed);
  el.innerHTML = `<span class="dot"></span><span><b>Offline</b> — answering from the cached 172.101 table${
    gen ? `, generated ${esc(gen)}` : ""}.${
    ref ? ` <span class="when">Cache refreshed ${esc(ref)}.</span>` : ""}</span>`;
  el.hidden = false;
}

/* ---------------- SERVICE WORKER + UPDATE CHECK ----------------

   Three version numbers live in this app and they answer three questions:

     APP_VERSION (here)          the code a driver is running
     VERSION     (sw.js)         the cache generation, forces a fresh install
     version/cfrDate (hazmat.json)  which CFR edition the table came from

   Only the first and third belong on screen; the cache generation is
   plumbing. The footer shows the build, dataNote shows the data.

   sw.js does not call skipWaiting on its own. A new worker sits in `waiting`
   until this page sends "skip", and this page only sends it when the driver
   taps the footer. That is what makes a background check safe: it can find an
   update and say so, but it cannot pull the rug on someone mid load build. */

let swReg = null;             /* registration, reachable from the footer handler */
let updateReady = false;      /* a new worker is installed and waiting */
let verState = "idle";        /* idle | checking | uptodate | ready | updating */
let verRevert = null;

/* Set by applyUpdate(), and by nothing else. It is the whole guard on the
   reload below.

   The obvious guard — snapshot navigator.serviceWorker.controller at startup
   and only reload if the page already had one — has a hole. On a first-ever
   visit there is no controller at script time, so the snapshot is false for
   the entire life of that page. If the driver then taps to update in that
   same session, controllerchange fires and the snapshot suppresses the
   reload: the footer sits on "Updating…" against a worker that has already
   taken over. Keying on the tap instead is both narrower and exactly the
   rule we want — no reload the driver did not ask for, on any visit. */
let userAskedToUpdate = false;

if("serviceWorker" in navigator){
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    /* A claim nobody asked for: a first install taking control, or a worker
       activating behind a background check. Let it happen silently. */
    if(!userAskedToUpdate || reloading) return;
    reloading = true;
    location.reload();
  });
}

function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  /* Relative on purpose. HazPost is served from /HazPost/ on GitHub Pages, so
     "sw.js" resolves against this document to /HazPost/sw.js and the default
     scope becomes /HazPost/. A leading slash would ask for /sw.js at the
     domain root, which does not exist and would fail registration outright.

     updateViaCache:"none" keeps sw.js itself out of the HTTP cache, so a check
     asks the server rather than trusting whatever headers Pages happens to
     send. Without it a driver can tap "check" and be told they are current by
     a cached copy of the old worker script. */
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg=>{
    swReg = reg;

    reg.addEventListener("updatefound", ()=>{
      const sw = reg.installing;
      if(!sw) return;
      sw.addEventListener("statechange", ()=>{
        /* installed + an existing controller means this is an update waiting,
           not a first install */
        if(sw.state==="installed" && navigator.serviceWorker.controller) markUpdateReady();
        if(sw.state==="activated") readCacheMeta().then(paintOffline);
      });
    });

    /* a worker may already be waiting from a previous visit */
    if(reg.waiting && navigator.serviceWorker.controller) markUpdateReady();

    checkForUpdate();  /* silent check on load */
  }).catch(e=>{
    /* No worker means no offline mode, but the app still runs online. */
    console.warn("HazPost: service worker registration failed —", e && e.message);
  });
}

function markUpdateReady(){
  updateReady = true;
  /* never stomp on a tap already in flight */
  if(verState==="idle" || verState==="uptodate"){ setVerState("ready"); }
}

function setVerState(s){
  verState = s;
  clearTimeout(verRevert);
  if(s==="uptodate" || s==="nocheck" || s==="failed"){
    /* fall back to whatever is true once the message has been read */
    verRevert = setTimeout(()=>setVerState(updateReady ? "ready" : "idle"), s==="failed" ? 5000 : 2000);
  }
  paintVersionFoot();
}

/* Silent by design: no checking label, no result message. A driver who
   backgrounds the app for a week should not have to go tapping to find out
   they are stale — but a check they did not ask for never reloads and never
   flashes. All it can do is light up the footer via markUpdateReady. */
async function checkForUpdate(){
  if(!swReg) return;
  try{ await swReg.update(); }catch(e){ /* offline, or the server is unreachable */ }
}

function verFootText(){
  switch(verState){
    case "checking": return "Checking for updates…";
    case "uptodate": return "You're up to date";
    case "nocheck":  return "Offline — can't check for updates";
    case "failed":   return "Update didn't finish — tap to retry";
    case "ready":    return "Update ready — tap to install";
    case "updating": return "Updating…";
    default:         return `HazPost v${APP_VERSION}`;
  }
}

/* The home view is rebuilt by render() on every navigation, so the footer is
   drawn from verState each time rather than being written once at startup. */
function paintVersionFoot(){
  const el = document.getElementById('verFoot');
  if(!el) return;
  el.textContent = verFootText();
  el.classList.toggle('live', verState==="ready" || verState==="updating");
}

/* The driver's explicit tap — the only path that is allowed to reload. */
async function tapVersion(){
  if(!swReg || verState==="checking" || verState==="updating") return;

  if(updateReady && swReg.waiting){ applyUpdate(); return; }

  setVerState("checking");

  /* updatefound fires as soon as a new worker starts installing — the earliest
     positive signal that a new build exists. */
  let found = false;
  const onFound = ()=>{ found = true; };
  swReg.addEventListener("updatefound", onFound);

  let reached = true;
  try{ await swReg.update(); }catch(e){ reached = false; }
  await sleep(600);                       /* let a just-started install announce itself */
  swReg.removeEventListener("updatefound", onFound);

  if(found || swReg.installing || swReg.waiting){
    /* Wait for the lifecycle rather than a fixed window. Installing a new
       HazPost means caching a ~370 KB table plus icons, and sw.js gives its
       optional phase up to 10 s — a short fixed timeout here would report
       "up to date" while the update was still downloading. */
    setVerState("updating");
    if(await waitForWaiting(swReg, 30000)){ applyUpdate(); return; }
    setVerState("failed");
    return;
  }

  /* Never answer "up to date" for a check that never reached the server. A
     driver reading that would take it as confirmation their rules are
     current, which is the exact thing this footer exists to prevent. */
  setVerState(reached && navigator.onLine ? "uptodate" : "nocheck");
}

const sleep = ms => new Promise(r=>setTimeout(r, ms));

/** Resolve true once a new worker finishes installing and parks in `waiting`. */
function waitForWaiting(reg, ms){
  return new Promise(res=>{
    const t0 = Date.now();
    (function poll(){
      if(reg.waiting) return res(true);
      if(Date.now() - t0 > ms) return res(false);
      setTimeout(poll, 250);
    })();
  });
}

/* Hand the waiting worker its go-ahead. It activates, calls clients.claim(),
   and the controllerchange listener above turns that into the reload. */
function applyUpdate(){
  userAskedToUpdate = true;
  setVerState("updating");
  if(swReg.waiting) swReg.waiting.postMessage("skip");
  /* If the handover never lands, don't strand the driver on "Updating…".
     Reloading is already what they asked for, so the fallback is safe. */
  setTimeout(()=>{ if(!document.hidden) location.reload(); }, 6000);
}

function rule848i(lines){
  const cls = l => String(l.cls||"").match(/^(1\.[1-6])([A-S])\b/);

let load = [];

/* ---------------- LOAD PERSISTENCE ----------------
   A driver builds a load at the dock, pockets the phone, and comes back to it.
   Only the id, weight and facility are stored: the hazard classification is
   re-read from hazmat.json on every start, so a load saved before a CFR
   amendment can never resurrect a stale placard category. */
const LS_LOAD = "hazpost.load.v1";
let restoreNote = "";

function saveLoad(){
  try{
    localStorage.setItem(LS_LOAD, JSON.stringify({
      saved: new Date().toISOString(),
      /* st is the driver's answer to the physical-state question in the
         segregation module. It rides with the line and dies with the load —
         never reused for the same ID on a later load, because n.o.s. entries
         genuinely vary between shipments. */
      lines: load.map(l=>({id:l.id, wt:l.wt, fac:l.fac, ...(l.st?{st:l.st}:{})})),
    }));
  }catch(e){ /* private mode or quota — the app works, it just won't remember */ }
}

function restoreLoad(){
  let raw;
  try{ raw = localStorage.getItem(LS_LOAD); }catch(e){ return; }
  if(!raw) return;
  let doc;
  try{ doc = JSON.parse(raw); }catch(e){ return; }
  const lines = Array.isArray(doc && doc.lines) ? doc.lines : [];
  const dropped = [];
  load = lines.map(l=>{
    const m = HM.find(x=>x.id===l.id);
    if(!m || !(l.wt>0)){ dropped.push(l.id); return null; }
    return {...m, wt:l.wt, fac:l.fac||"A", ...(l.st==="liquid"||l.st==="solid" ? {st:l.st} : {})};
  }).filter(Boolean);
  if(dropped.length){
    restoreNote = `${dropped.length} saved line${dropped.length===1?" is":"s are"} no longer in the 172.101 table and ${dropped.length===1?"was":"were"} dropped. Re-check your papers.`;
  }
  /* The load comes back; the view does not. Opening the app lands on the
     module grid every time, so a driver picks the tool for the job in front
     of them rather than resuming wherever they happened to stop. */
}

/* every mutation of the load goes through here, so nothing can change on
   screen without also being written down */
function commit(){ saveLoad(); render(); }

function clearLoad(){
  if(!load.length) return;
  const n = load.length;
  if(!confirm(`Clear all ${n} line${n===1?"":"s"}?\n\nThis also erases the load saved on this phone — it will not come back when you reopen HazPost.`)) return;
  load = []; restoreNote = ""; commit();
}

/* ---------------- THE 172.504 ENGINE ---------------- */
function compute(){
  const why=[]; const placards=new Set(); let dangerOption=null;

  const t1=load.filter(l=>l.t1);
  const t2=load.filter(l=>!l.t1);

  // Table 1 — any quantity
  t1.forEach(l=>{
    if(!noPlc(l)) placards.add(l.plc);
    why.push({tone:"bad", txt:`<b>${idLabel(l)} ${esc(l.name)}</b> is a Table 1 material (Class ${esc(l.cls)}). Its placard is required at <b>any quantity</b>.`, cite:"172.504(e) Table 1"});
    if(l.cond) why.push({tone:"warn", txt:`<b>${idLabel(l)}</b> — ${esc(l.cond)}`, cite:"172.504(e) Table 1"});
  });

  // 172.505(a) — a PIH material carries its inhalation placard on top of its own class placard
  load.forEach(l=>{
    if(l.pih && l.base!=="6.1" && l.base!=="2.3"){
      placards.add("pih61");
      why.push({tone:"bad", txt:`<b>${idLabel(l)} ${esc(l.name)}</b> is poisonous by inhalation (${esc(l.pih)}). A <b>POISON INHALATION HAZARD</b> placard is required at any quantity, in addition to its Class ${esc(l.cls)} placard.`, cite:"172.505(a)"});
    }
  });

  // Table 2 — aggregate threshold
  const agg = t2.reduce((s,l)=>s+l.wt,0);
  if(t2.length && agg < 1001){
    why.push({tone:"ok", txt:`Table 2 aggregate is <b>${agg.toLocaleString()} lb</b> — under the 1,001 lb threshold, so no Table 2 placards are required. Watch it: one more pickup can flip this.`, cite:"172.504(c)"});
  }
  if(t2.length && agg >= 1001){
    why.push({tone:"warn", txt:`Table 2 aggregate is <b>${agg.toLocaleString()} lb</b> — at or over 1,001 lb, so every Table 2 category on board must be placarded.`, cite:"172.504(c)"});
    // categories present. A category whose every line is exempt from placarding
    // (6.2, unlabelled 1.4S) still counts toward the aggregate but hangs nothing.
    const cats={};
    t2.forEach(l=>{ const c = cats[l.base] = cats[l.base]||{wt:0, byFac:{}, plc:null};
      c.wt+=l.wt;
      c.byFac[l.fac]=(c.byFac[l.fac]||0)+l.wt;
      if(!c.plc && !noPlc(l)) c.plc=l.plc; });
    const catKeys=Object.keys(cats);
    const placardedCats = catKeys.filter(c=>cats[c].plc);
    placardedCats.forEach(c=>placards.add(cats[c].plc));

    catKeys.filter(c=>!cats[c].plc).forEach(c=>{
      why.push({tone:"ok", txt:`<b>${CLSNAME[c]||"Category "+c}</b> counts toward the 1,001 lb aggregate, but Table 2 specifies <b>no placard</b> for it.`, cite:"172.504(e) Table 2"});
    });

    // Class 9 domestic note
    if(cats["9"]){
      why.push({tone:"ok", txt:`<b>Class 9</b> is on board — the Class 9 placard is <b>not required</b> for domestic highway transport. You may display it, but you don't have to.`, cite:"172.504(f)(9)"});
    }

    // DANGEROUS option
    const nonNine = placardedCats.filter(c=>c!=="9");
    if(nonNine.length>=2){
      const blocked = nonNine.filter(c=>Object.values(cats[c].byFac).some(w=>w>=2205));
      if(blocked.length===0){
        dangerOption={cats:nonNine};
        why.push({tone:"warn", txt:`Two or more Table 2 categories → you may hang a single <b>DANGEROUS</b> placard instead of the individual ones.`, cite:"172.504(b)"});
      } else {
        dangerOption={cats:nonNine.filter(c=>!blocked.includes(c)), blocked};
        blocked.forEach(c=>{
          why.push({tone:"bad", txt:`<b>${CLSNAME[c]}</b>: ${Math.max(...Object.values(cats[c].byFac)).toLocaleString()} lb came aboard at one facility — 2,205 lb or more from a single loading point kills the DANGEROUS shortcut for that class. Its own placard must be displayed.`, cite:"172.504(b)(2)"});
        });
        if(dangerOption.cats.length<2) dangerOption=null;
      }
    }
    // subsidiary note
    t2.forEach(l=>{ if(l.subs && !l.pih) why.push({tone:"ok", txt:`<b>${idLabel(l)} ${esc(l.name)}</b> carries a Class ${esc(l.subs)} subsidiary hazard — check the papers; subsidiary placarding rules in 172.505 may apply.`, cite:"172.505"}); });
  }
  if(!load.length) return null;

  // 177.848(i) — Division 1.5D riding with Division 1.2D re-divisions the whole
  // shipment to 1.1D, which is lower than either line carries. Applied before
  // (f)(1) so the lowest-division rule then settles on 1.1 on its own.
  const promoted = rule848i(load);
  if(promoted){
    placards.add("expl11");
    why.push({tone:"bad", txt:`Division <b>1.5D</b> and Division <b>1.2D</b> are both aboard, so the shipment must be transported as <b>Division 1.1D</b> — a lower division than either line carries. The trailer takes <b>EXPLOSIVES 1.1</b>.`, cite:"177.848(i)"});
  }

  // 172.504(f)(1) — when several Class 1 divisions are aboard, only the lowest is displayed
  const explOn = [...placards].filter(p=>EXPLDIV[p]).sort((a,b)=>EXPLDIV[a].localeCompare(EXPLDIV[b]));
  if(explOn.length>1){
    explOn.slice(1).forEach(p=>placards.delete(p));
    /* Silent when 177.848(i) put 1.1 there: that note has already explained
       the outcome, and saying division 1.1 is "aboard" would be wrong — no
       line on this load carries it. */
    if(!promoted){
      why.push({tone:"ok", txt:`Explosives divisions ${explOn.map(p=>EXPLDIV[p]).join(", ")} are aboard — only the placard for the <b>lowest division</b>, EXPLOSIVES ${EXPLDIV[explOn[0]]}, must be displayed.`, cite:"172.504(f)(1)"});
    }
  }

  return {placards:[...placards], why, dangerOption, agg, t2cats: t2.length};
}

function computeAndDraw(){
  const el=document.getElementById('result'); if(!el) return;
  const r=compute();
  if(!r){ el.innerHTML=""; return; }
  let trailerA = r.placards.map(p=>plcHTML(p)).join("");
  let html = `<div class="trailer"><h4>Required on the trailer${r.dangerOption?' — Option A: specific placards':''}</h4>
     <div class="tr-body">${trailerA||'<span class="tr-none">No placards required for this load</span>'}</div>`;
  if(r.dangerOption){
    const dSet=[plcHTML('danger')].concat(
      r.placards.filter(p=>{
        // keep table-1 placards and blocked-class placards alongside DANGEROUS
        const cat=Object.keys(CLSPLC).find(k=>CLSPLC[k]===p);
        return !cat || !r.dangerOption.cats.includes(cat);
      }).map(p=>plcHTML(p)));
    html += `<h4 style="margin-top:22px">Option B: DANGEROUS placard</h4>
      <div class="tr-body">${dSet.join("")}</div>
      <div class="hint">Either option is legal for this load. Most fleets prefer specific placards — emergency responders get better information.</div>`;
  }
  html += `</div><div class="card"><h4>Why</h4>`+
    r.why.map(w=>`<div class="why ${w.tone}"><p>${w.txt}</p><span class="cite">49 CFR ${w.cite}</span></div>`).join("")+
    `</div>`;
  el.innerHTML=html;
}
function plcHTML(key){
  const p=PLC[key];
  if(!p || p.none) return "";
  const stripes = p.stripes? `<div style="position:absolute;top:0;left:0;right:0;height:50%;background:repeating-linear-gradient(90deg,#111 0 7px,#F2F2F2 7px 14px)"></div>`:"";
  return `<div class="plc"><div class="dia"><div class="fill" style="background:${p.bg}">${stripes}</div></div>
    <div class="txt" style="color:${p.fg}"><span class="w" style="max-width:60px">${p.w}</span><span class="n">${p.n}</span></div>
    <div class="cap">${key==='danger'?'dangerous':''}</div></div>`;
}

/* ================= SEGREGATION — 49 CFR 177.848 =================

   The 18 categories on the axes of the (d) table are NOT the placard
   categories the load builder uses. They are narrower in three places:
   Division 2.3 splits by inhalation zone, Division 6.1 is one narrow row
   (poisonous liquids, PG I, Zone A), and Class 8 is liquids only. So a load
   line is mapped here from scratch rather than reusing `base`.

   A line can occupy more than one category: 177.848(e)(6) requires
   segregation appropriate to a subsidiary hazard whenever it is more
   restrictive than the primary. That is the part a driver reading placards
   alone would never see.                                                  */

const SEGRANK = {"":0, "O":1, "*":2, "X":3};

const segIdx = k => SEG.categories.findIndex(c=>c.key===k);
const segCat = k => SEG.categories.find(c=>c.key===k) || {key:k, label:k, name:k, axis:k};
const segCell = (a,b) => SEG.table[segIdx(a)][segIdx(b)];

/** Rows defined as liquids. hazmat.json does not record physical state. */
const NEEDS_STATE = {"8L":"Class 8", "6.1I-A":"Division 6.1"};

/**
 * Map one class/division token to a segregation category, or null when the
 * token has no row at all. `ctx` collects the assumptions worth stating.
 */
function segCatFor(tok, l, ctx){
  tok = String(tok||"").trim();
  /* placard-category keys that are not plain divisions */
  if(tok==="2.2oxy") tok = "2.2";
  if(tok==="5.2tc")  tok = "5.2";
  if(tok==="6.1t2")  tok = "6.1";
  if(tok==="comb")   return null;

  if(tok==="1.1" || tok==="1.2") return "1.1-1.2";
  if(["1.3","1.4","1.5","1.6","2.1","2.2","3","4.1","4.2","4.3","5.1","5.2","7"].includes(tok)) return tok;

  /* A bare Class 1 label carries no division, so there is nothing to look up
     directly. It is read as 1.1/1.2 — the strictest explosives row — and the
     assumption is stated on screen. That row is X against nearly everything,
     so this is deliberately the loud answer: the alternative was to drop the
     subsidiary entirely and say nothing. Affects the four organic peroxide
     Type B entries (UN3101, UN3102, UN3111, UN3112), whose column 6 reads
     "5.2, 1". */
  if(tok==="1"){
    ctx.notes.push(`${idLabel(l)} carries a Class 1 subsidiary with no division on file. It is placed on the <b>1.1/1.2</b> row, the strictest explosives row — that row is X against nearly everything, so check the compatibility group on your papers before treating this as final.`);
    return "1.1-1.2";
  }

  if(tok==="2.3"){
    const z = (l.pih||"").match(/Zone\s*([A-D])/i);
    if(!z){
      ctx.notes.push(`${idLabel(l)} is Division 2.3 with no inhalation zone on file — treated as <b>Zone A</b>, the stricter row.`);
      return "2.3A";
    }
    const Z = z[1].toUpperCase();
    if(Z==="A") return "2.3A";
    if(Z==="B") return "2.3B";
    return null;   /* Zones C and D are not rows — no restriction */
  }

  if(tok==="6.1"){
    /* the row is poisonous LIQUIDS, PG I, Zone A — all three, or no row */
    const zoneA = /Zone\s*A/i.test(l.pih||"");
    const pgI   = String(l.pg||"").split(",").map(x=>x.trim()).includes("I");
    return (zoneA && pgI) ? "6.1I-A" : null;
  }

  if(tok==="8") return "8L";

  return null;   /* 6.2, Class 9, combustible liquid and the rest have no row */
}

/**
 * Every category a load line occupies, with the state question resolved.
 * Returns confirmed categories plus any outstanding question.
 */
function segCatsFor(l, ctx){
  const raw = [];
  const p = segCatFor(l.base, l, ctx);
  if(p) raw.push({key:p, sub:false, from:"primary"});
  (l.subs ? String(l.subs).split(/,\s*/) : []).forEach(t=>{
    const c = segCatFor(t, l, ctx);
    if(c && !raw.some(r=>r.key===c)) raw.push({key:c, sub:true, from:`subsidiary ${t}`});
  });

  const cats = [], pending = [];
  raw.forEach(c=>{
    if(NEEDS_STATE[c.key]){
      if(l.st === "liquid") cats.push(c);
      else if(l.st === "solid") { /* the row is liquids only — line drops off it */ }
      else pending.push(c);
    } else cats.push(c);
  });
  return {cats, pending, raw};
}

/** Pairwise check across the whole load. */
function segCheck(){
  const ctx = {notes:[]};
  const mapped = load.map((l,i)=>({i, l, ...segCatsFor(l, ctx)}));

  /* Ask only where the answer changes the outcome. A lone Class 8 line with
     nothing on the trailer it could ever conflict with does not need the
     driver to go and read the paper — and a prompt that fires when it cannot
     matter trains people to dismiss the one that does.
     `pendingAll` keeps the unfiltered set, because a line whose state is still
     open may still occupy the row for the advisories below. */
  const possible = mapped.map(m=>[...m.cats, ...m.pending]);
  mapped.forEach(m=>{
    m.pendingAll = m.pending;
    m.pending = m.pending.filter(pc =>
      mapped.some((o,j)=> j!==m.i && possible[j].some(oc=> segCell(pc.key, oc.key) !== "")));
  });

  const pairs = [];

  for(let a=0;a<mapped.length;a++) for(let b=a+1;b<mapped.length;b++){
    const A = mapped[a], B = mapped[b];
    let worst = "", via = null;
    for(const ca of A.cats) for(const cb of B.cats){
      const v = segCell(ca.key, cb.key);
      /* strictly worse wins; on a tie prefer the primary-to-primary reading,
         which is the less alarming way to say the same thing */
      const better = SEGRANK[v] > SEGRANK[worst] ||
                     (SEGRANK[v] === SEGRANK[worst] && via && (via[0].sub || via[1].sub) && !ca.sub && !cb.sub);
      if(better){ worst = v; via = [ca, cb]; }
    }
    if(worst === "") continue;
    pairs.push({A, B, code:worst, via, bySub: !!(via[0].sub || via[1].sub)});
  }

  const outstanding = mapped.filter(m=>m.pending.length);
  return {mapped, pairs, outstanding, notes:ctx.notes};
}

/* ================= CLASS 1 COMPATIBILITY — 177.848(f)-(i) =================

   The segregation table sends every explosives-against-explosives pair here
   with a `*`. This is the engine behind that: the (f) compatibility table,
   the numbered rules in (g), and the division rollups in (h) and (i).

   Two of the numbered rules turn on facts the 172.101 table does not carry —
   whether an item is an article or a substance (rule 6), and whether a
   detonator is involved (rule 4). Those produce a stated condition, never a
   green light. Guessing them would be worse than saying so.                */

/** "1.1D" -> {div:"1.1", grp:"D"}; null when the line is not Class 1. */
function class1Of(l){
  const m = String(l.cls||"").match(/^(1\.[1-6])([A-S])\b/);
  return m ? {div:m[1], grp:m[2]} : null;
}

const compatCell = (a,b) => {
  const g = SEG.compat.groups;
  return SEG.compat.table[g.indexOf(a)][g.indexOf(b)];
};

/** 172.101 gives all five fireworks entries the proper shipping name "Fireworks". */
const isFireworks = l => String(l.name||"").trim().toLowerCase() === "fireworks";

/**
 * Resolve every Class 1 line on the load together.
 *
 * Pairwise for the prohibitions, then load-wide for the group assignment in
 * rules 2 and 3 and the division rollup in (h) and (i) — those are properties
 * of the shipment, not of a pair.
 */
function class1Check(){
  const lines = load.map((l,i)=>({i, l, c:class1Of(l)})).filter(x=>x.c);
  if(lines.length < 2) return null;

  const bans = [], conds = [], rules = new Set();
  const groups = [...new Set(lines.map(x=>x.c.grp))].sort();
  const divs   = [...new Set(lines.map(x=>x.c.div))].sort();

  for(let a=0;a<lines.length;a++) for(let b=a+1;b<lines.length;b++){
    const A = lines[a], B = lines[b];
    const cell = compatCell(A.c.grp, B.c.grp);

    if(cell === "X"){
      bans.push({A, B, cell, why:`Compatibility groups ${A.c.grp} and ${B.c.grp} are X in the table.`, cite:"177.848(f), (g)(2)"});
      continue;
    }
    if(/^X\((\d)\)$/.test(cell)){
      const n = cell.match(/^X\((\d)\)$/)[1];
      rules.add(n);
      bans.push({A, B, cell, why:`Compatibility groups ${A.c.grp} and ${B.c.grp} are X in the table. Rule ${n} also applies.`, cite:"177.848(f), (g)(2)"});
      continue;
    }
    if(cell === "1"){
      /* the L x L cell — group L may share the vehicle only with an identical explosive */
      rules.add("1");
      if(A.l.id !== B.l.id){
        bans.push({A, B, cell, why:`Group L may only travel with an <b>identical</b> explosive, and these are different entries.`, cite:"177.848(g)(3)(i)"});
      }
      continue;
    }
    if(cell === "") continue;

    /* everything left is a numbered allowance with strings attached */
    String(cell).split("/").forEach(n=>rules.add(n));
    if(cell === "6"){
      conds.push({A, B, rule:"6", text:`Allowed only if <b>both are explosive articles</b>, the group G item is not fireworks and does not require special handling, and <b>no explosive substances</b> ride in the same vehicle. HazPost cannot tell an article from a substance — that is on the papers.`, cite:"177.848(g)(3)(vi)"});
    }
    if(cell.includes("4")){
      conds.push({A, B, rule:"4", text:`If either of these is a <b>detonator</b>, § 177.835(g) governs the loading and HazPost does not check it.`, cite:"177.848(g)(3)(iv)"});
    }
    if(cell.includes("5")){
      /* rule 5 bites only against 1.1 or 1.2, and only for fireworks */
      const pair = [A,B], s = pair.find(x=>x.c.div==="1.4" && x.c.grp==="S"), o = pair.find(x=>x!==s);
      if(s && o && (o.c.div==="1.1" || o.c.div==="1.2")){
        if(isFireworks(s.l)){
          bans.push({A, B, cell, why:`${idLabel(s.l)} is Division 1.4S <b>fireworks</b>, and they may not ride with Division ${o.c.div} material.`, cite:"177.848(g)(3)(v)"});
        } else {
          conds.push({A, B, rule:"5", text:`If ${idLabel(s.l)} is <b>fireworks</b>, it may not be loaded with Division ${o.c.div} material. Its proper shipping name does not say so — check the papers.`, cite:"177.848(g)(3)(v)"});
        }
      }
    }
  }

  /* --- rules 2 and 3: what the combination is assigned to --- */
  let assigned = null;
  const cde = groups.filter(g=>["C","D","E"].includes(g));
  if(groups.includes("N") && cde.length){
    assigned = {grp:"D", rule:"3", cite:"177.848(g)(3)(iii)", from:[...cde,"N"]};
  } else if(cde.length > 1){
    assigned = {grp:"E", rule:"2", cite:"177.848(g)(3)(ii)", from:cde};
  }
  if(assigned) rules.add(assigned.rule);

  /* --- (i): 1.5D with 1.2D rolls the shipment to 1.1D. Checked first because
         (h) opens with "Except as provided in paragraph (i)". --- */
  const iApplies = rule848i(lines.map(x=>x.l));

  /* --- (h): same group, different divisions, whole shipment rides as the
         lower numerical division. Group D is left to (i) when (i) bites. --- */
  const rollups = [];
  groups.forEach(g=>{
    if(iApplies && g === "D") return;
    const ds = [...new Set(lines.filter(x=>x.c.grp===g).map(x=>x.c.div))].sort();
    if(ds.length > 1) rollups.push({grp:g, from:ds, to:ds[0]});
  });

  const shipmentDiv = iApplies ? "1.1" : divs[0];

  return {lines, groups, divs, bans, conds, rules:[...rules].sort(), assigned, rollups, iApplies, shipmentDiv};
}

function class1View(r){
  if(!r) return "";
  const R = SEG.compat.rules;
  const line = x => `${idLabel(x.l)} <span style="color:var(--faint)">${esc(x.l.cls.split(" ")[0])}</span>`;

  let h = `<div class="card"><h4>Explosives compatibility — 177.848(f)</h4>`;

  h += `<div class="c1sum">${r.lines.map(x=>
    `<span class="c1chip">${idLabel(x.l)} <b>${esc(x.c.div)}${esc(x.c.grp)}</b></span>`).join("")}</div>`;

  r.bans.forEach(bn=>{
    h += `<div class="segv x"><div class="hd"><span class="mark x">X</span>May not travel together</div>
      <p>${bn.why}</p>
      <div class="pairline">${line(bn.A)} <span style="color:var(--faint)">✕</span> ${line(bn.B)} — table cell <b>${esc(bn.cell)}</b></div>
      <span class="cite">49 CFR ${bn.cite}</span></div>`;
  });

  r.conds.forEach(c=>{
    h += `<div class="segv o"><div class="hd"><span class="mark o">${esc(c.rule)}</span>Allowed, with a condition</div>
      <p>${c.text}</p>
      <div class="pairline">${line(c.A)} <span style="color:var(--faint)">✕</span> ${line(c.B)}</div>
      <span class="cite">49 CFR ${c.cite}</span></div>`;
  });

  if(!r.bans.length && !r.conds.length){
    h += `<div class="segv clear"><div class="hd"><span class="mark c">✓</span>Compatible</div>
      <p>Every explosives pair on this load is blank in the compatibility table — no restriction between them.</p>
      <span class="cite">49 CFR 177.848(f), (g)(1)</span></div>`;
  }

  /* What the shipment becomes. Withheld while any pair is prohibited: telling
     a driver how to label a load that may not be built is worse than silence. */
  if(r.bans.length){
    h += `<div class="c1res"><h5>The shipment travels as</h5>
      <p>Not shown — this load may not be assembled as it stands. Resolve the prohibited pair${r.bans.length===1?"":"s"} above first.</p></div>`;
  } else if(r.assigned || r.rollups.length || r.iApplies){
    h += `<div class="c1res"><h5>The shipment travels as</h5>`;
    if(r.assigned){
      h += `<p><b>Compatibility group ${esc(r.assigned.grp)}</b> — ${esc(R[r.assigned.rule])}
        <span class="cite">49 CFR ${r.assigned.cite}</span></p>`;
    }
    r.rollups.forEach(ru=>{
      h += `<p><b>Division ${esc(ru.to)}</b> for group ${esc(ru.grp)} — divisions ${esc(ru.from.join(" and "))} are aboard in the same compatibility group, so the whole shipment rides as the lower numerical division.
        <span class="cite">49 CFR 177.848(h)</span></p>`;
    });
    if(r.iApplies){
      h += `<p class="warn"><b>Division 1.1D</b> — ${esc(SEG.compat.fifteenWithTwelve)}
        <span class="cite">49 CFR 177.848(i)</span></p>
        <p class="warn">That is a lower division than either line carries, so it moves the placard too. Placarding applies this — the trailer shows <b>EXPLOSIVES 1.1</b> for this load.
        <span class="cite">49 CFR 172.504(e), (f)(1)</span></p>`;
    } else if(r.divs.length > 1){
      h += `<p>Lowest division aboard is <b>${esc(r.shipmentDiv)}</b>, which is what the placard follows.
        <span class="cite">49 CFR 172.504(f)(1)</span></p>`;
    }
    h += `</div>`;
  }

  if(r.rules.length){
    h += `<div class="c1rules"><h5>Rules in play</h5>` +
      r.rules.map(n=>`<p><b>${esc(n)}</b> — ${esc(R[n]||"")}</p>`).join("") +
      `<span class="cite">49 CFR 177.848(g)(3)</span></div>`;
  }

  return h + `</div>`;
}

/* ---------------- segregation views ---------------- */

function setLineState(i, v){
  if(!load[i]) return;
  load[i].st = v;
  commit();
}

function segUnavailable(){
  return `<div class="card"><h4>Segregation data unavailable</h4>
    <p style="font-size:14px;line-height:1.5;color:var(--dim)">The 177.848 tables could not be loaded, so HazPost will not guess at what can ride together.</p>
    <div class="msg" style="font:500 12.5px 'Roboto Mono';color:var(--bad);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:12px;word-break:break-word">${esc(SEG_URL)} — ${esc(segError||"not loaded")}</div>
    <button class="btn" style="margin-top:12px" onclick="loadSeg().then(render)">Try again</button></div>`;
}

function segLoadView(){
  if(!load.length){
    return `<div class="card"><h4>Nothing on the trailer</h4>
      <div class="hint" style="margin-top:0">Segregation reads the same load you built for placarding. Add lines in <a href="#" style="color:var(--brand)" onclick="view='placards';plcTab='builder';commit();return false">Placarding → Load Builder</a>, then come back.</div></div>`;
  }

  const {mapped, pairs, outstanding, notes} = segCheck();
  const hard = pairs.filter(p=>p.code==="X");
  const soft = pairs.filter(p=>p.code==="O");
  const star = pairs.filter(p=>p.code==="*");

  /* the load, with the category each line occupies */
  let h = `<div class="card"><h4>On the trailer — ${load.length} line${load.length===1?"":"s"}</h4>` +
    mapped.map(m=>{
      const shown = m.cats.map(c=>segCat(c.key).label);
      const pend  = (m.pendingAll||m.pending).map(c=>segCat(c.key).label + "?");
      const all   = [...shown, ...pend];
      return `<div class="line-item">
        <span class="un">${idLabel(m.l)}</span>
        <div class="nm"><b>${esc(m.l.name)}</b><span>Class ${esc(m.l.cls)} · PG ${esc(m.l.pg)} → ${all.length? esc(all.join(" · ")) : "no segregation row"}</span></div>
        ${m.l.subs?`<span class="segchip sub">sub ${esc(m.l.subs)}</span>`:""}
      </div>`;
    }).join("") + `</div>`;

  /* Outstanding questions come first: they gate the verdict, and the driver
     has the shipping paper in hand right now. */
  if(outstanding.length){
    h += `<div class="card"><h4>Answer before this is a verdict</h4>` +
      outstanding.map(m=>{
        const c = m.pending[0];
        const what = NEEDS_STATE[c.key];
        const row = segCat(c.key);
        return `<div class="stateq">
          <p><b>${idLabel(m.l)} ${esc(m.l.name)}</b></p>
          <p class="q">${esc(what)} appears on this line${m.pending[0].sub?" as a subsidiary hazard":""}, and the segregation row is <b>${esc(row.axis)}</b>. Is this shipment a liquid or a solid? Read it off the paper — HazPost will not guess.</p>
          <div class="row" style="margin-bottom:0">
            <button class="btn ghost" onclick="setLineState(${m.i},'liquid')">Liquid</button>
            <button class="btn ghost" onclick="setLineState(${m.i},'solid')">Solid</button>
          </div>
        </div>`;
      }).join("") +
      `<div class="hint">This answer rides with this load only. It is not remembered for the same ID number next time — n.o.s. entries genuinely vary between shipments.</div></div>`;
  }

  /* Verdicts. An all-clear is only honest once every question is answered. */
  if(!pairs.length){
    h += outstanding.length
      ? `<div class="segv pend"><div class="hd"><span class="mark p">?</span>No verdict yet</div>
         <p>Nothing on the answered part of this load hits a restricted cell — but ${outstanding.length} line${outstanding.length===1?"":"s"} above still need${outstanding.length===1?"s":""} a physical state before HazPost can say the trailer is clear.</p>
         <span class="cite">49 CFR 177.848(d)</span></div>`
      : `<div class="segv clear"><div class="hd"><span class="mark c">✓</span>No segregation conflicts</div>
         <p>No pair on this load lands on a restricted cell of the 177.848 table.</p>
         <span class="cite">49 CFR 177.848(d)</span></div>`;
  } else if(outstanding.length){
    h += `<div class="segv pend"><div class="hd"><span class="mark p">?</span>Partial result</div>
      <p>The conflicts below are already proven. ${outstanding.length} line${outstanding.length===1?"":"s"} above still need${outstanding.length===1?"s":""} an answer, so this is not the whole picture.</p>
      <span class="cite">49 CFR 177.848(d)</span></div>`;
  }

  hard.forEach(p=> h += segVerdict(p, "x", "X — may not travel together",
    "These may not be loaded, transported, or stored together in the same vehicle. No method of separation makes it legal.", "177.848(d), (e)(2)"));
  soft.forEach(p=> h += segVerdict(p, "o", "O — separation required",
    "May travel together only if separated so that, if a package leaks under normal transport conditions, the contents could not commingle.", "177.848(d), (e)(3)"));
  if(star.length){
    h += `<div class="segv s"><div class="hd"><span class="mark s">★</span>Explosives against explosives</div>
      <p>${star.length} pair${star.length===1?" is":"s are"} both Class 1, so the segregation table hands them to the compatibility group table. Resolved below.</p>
      <span class="cite">49 CFR 177.848(d), (f)</span></div>`;
  }

  h += class1View(class1Check());
  h += segAdvisories(mapped, notes);
  return h;
}

function segVerdict(p, cls, title, body, cite){
  const ca = segCat(p.via[0].key), cb = segCat(p.via[1].key);
  const mark = cls==="x" ? "X" : cls==="o" ? "O" : "★";
  return `<div class="segv ${cls}"><div class="hd"><span class="mark ${cls}">${mark}</span>${title}</div>
    <p>${body}</p>
    <div class="pairline">${idLabel(p.A.l)} ${esc(p.A.l.name.slice(0,34))}${p.A.l.name.length>34?"…":""}
      <span style="color:var(--faint)">✕</span> ${idLabel(p.B.l)} ${esc(p.B.l.name.slice(0,34))}${p.B.l.name.length>34?"…":""}</div>
    <div class="pairline">via <b>${esc(ca.axis)}</b> ✕ <b>${esc(cb.axis)}</b></div>
    ${p.bySub?`<div class="pairline sub">Triggered by a subsidiary hazard — ${esc(p.via[0].from)} on ${idLabel(p.A.l)}, ${esc(p.via[1].from)} on ${idLabel(p.B.l)}. A driver reading placards alone would not see this.</div>`:""}
    <span class="cite">49 CFR ${cite}</span></div>`;
}

/* Rules that are not in the grid. The table looks complete; it is not. */
function segAdvisories(mapped, notes){
  /* Advisories use every row a line might occupy, including one whose state is
     still open — an advisory that only appears after the question is answered
     is an advisory that arrives too late. */
  const held = new Set();
  mapped.forEach(m=>[...m.cats, ...(m.pendingAll||m.pending)].forEach(c=>held.add(c.key)));
  const has = k => held.has(k);
  const adv = [];

  if(has("8L") && ["4.1","4.2","4.3","5.1","5.2"].some(has)){
    adv.push(["bad", `Whatever separation you use, <b>Class 8 liquids may not be loaded above or adjacent to Class 4 or Class 5 materials</b>. This is a placement rule, so an O verdict alone does not cover it. The only exception is a truckload shipment where the shipper knows the mixture would not cause fire or dangerous evolution of heat or gas.`, "177.848(e)(3)"]);
  }
  /* (c) turns on the actual materials, so it is surfaced, never inferred */
  const anySixOne = mapped.some(m=>/6\.1/.test(m.l.base||"") || /(^|,\s*)6\.1(\s*,|$)/.test(m.l.subs||""));
  const anyEight  = mapped.some(m=>m.l.base==="8" || /(^|,\s*)8(\s*,|$)/.test(m.l.subs||""));
  if(anyEight && anySixOne){
    adv.push(["bad", `This load carries both a Class 8 line and a Division 6.1 line. <b>Cyanides may not be loaded with acids</b> where the mixture would generate hydrogen cyanide. No table can catch this — it turns on the actual materials, so read the papers.`, "177.848(c)"]);
  }
  if(mapped.some(m=>m.raw.some(c=>c.sub))){
    adv.push(["", `A line here carries a subsidiary hazard. Segregation for the subsidiary applies whenever it is more restrictive than for the primary. Materials <i>of the same class</i> may be stored together without regard to subsidiary segregation, but only when they are not capable of reacting dangerously with each other — that is a judgment about the actual materials, and HazPost does not make it for you.`, "177.848(e)(6)"]);
  }
  if(has("1.1-1.2") || has("1.5") || has("5.1")){
    adv.push(["", `<b>Note A:</b> notwithstanding an X, ammonium nitrate (UN1942) and ammonium nitrate fertilizer may be loaded with Division 1.1 or 1.5 materials, unless § 177.835(c) prohibits it.`, "177.848(e)(5)"]);
  }
  const noRow = mapped.filter(m=>!m.raw.length);
  if(noRow.length){
    adv.push(["ok", `${noRow.map(m=>idLabel(m.l)).join(", ")} ${noRow.length===1?"has":"have"} <b>no segregation row at all</b> — Division 6.2, Class 9 and combustible liquids are not on the 177.848 table, so nothing here restricts them. That is a real answer, not a gap in the check.`, "177.848(d)"]);
  }
  adv.push(["", `If this trailer is going onto a vessel other than a ferry, segregation follows § 176.83(b) instead of this table. HazPost does not implement vessel segregation.`, "177.848(b)"]);

  return `<div class="card"><h4>Also applies</h4>` +
    adv.map(a=>`<div class="why ${a[0]}"><p style="font-size:13.5px">${a[1]}</p><span class="cite">49 CFR ${a[2]}</span></div>`).join("") +
    notes.map(n=>`<div class="why warn"><p style="font-size:13.5px">${n}</p></div>`).join("") +
    `</div>`;
}

function segTableView(){
  const C = SEG.categories;
  let h = `<div class="card"><h4>177.848(d) segregation table</h4>
    <div class="matwrap"><table class="mat"><tr><th class="rh"></th>` +
    C.map(c=>`<th title="${esc(c.axis)}">${esc(c.label)}</th>`).join("") + `</tr>` +
    C.map((rc,i)=>`<tr><th class="rh" title="${esc(rc.axis)}">${esc(rc.label)}</th>` +
      C.map((cc,j)=>{
        const v = SEG.table[i][j];
        const cls = v==="X"?"x":v==="O"?"o":v==="*"?"s":"b";
        return `<td class="${cls}">${v==="*"?"★":esc(v)}</td>`;
      }).join("") + `</tr>`).join("") +
    `</table></div>
    <div class="legend">
      <span><i class="x"></i>X — never together</span>
      <span><i class="o"></i>O — separate so leaks can't commingle</span>
      <span><i class="s"></i>★ — Class 1 compatibility table</span>
      <span><i class="b"></i>blank — no restriction</span>
    </div>
    <div class="hint"><b>6.1L</b> is the narrow row only: poisonous <b>liquids</b>, PG I, Zone A. <b>8L</b> is corrosive <b>liquids</b> only. Classes not on this table — Division 6.2, Class 9, combustible liquid — have no segregation restriction at all.</div>
  </div>`;

  const G = SEG.compat.groups;
  h += `<div class="card"><h4>177.848(f) Class 1 compatibility</h4>
    <div class="matwrap"><table class="mat"><tr><th class="rh"></th>` +
    G.map(g=>`<th>${g}</th>`).join("") + `</tr>` +
    G.map((rg,i)=>`<tr><th class="rh">${rg}</th>` +
      G.map((cg,j)=>{
        const v = SEG.compat.table[i][j];
        return `<td class="${v==="X"?"x":v===""?"b":"n"}">${esc(v)}</td>`;
      }).join("") + `</tr>`).join("") +
    `</table></div>
    <div class="legend">
      <span><i class="x"></i>X — not on the same vehicle</span>
      <span><i class="n"></i>number — see the rule below</span>
      <span><i class="b"></i>blank — no restriction</span>
    </div>
    <div class="c1rules"><h5>177.848(g)(3) — what the numbers mean</h5>` +
    Object.entries(SEG.compat.rules).map(([k,v])=>`<p><b>${esc(k)}</b> — ${esc(v)}</p>`).join("") +
    `</div>
    <div class="c1rules"><h5>Mixing divisions</h5>
      <p><b>(h)</b> ${esc(SEG.compat.divisionRollup)}</p>
      <p><b>(i)</b> ${esc(SEG.compat.fifteenWithTwelve)}</p>
    </div>
    <div class="hint">Check my load applies all of this to the explosives on your trailer. Rules 4 and 6 turn on facts the 172.101 table does not carry — whether a detonator is involved, and whether an item is an article or a substance — so those come back as a stated condition rather than a verdict.</div>
  </div>`;

  h += `<div class="card"><h4>Markers</h4>` +
    Object.entries(SEG.markers).map(([k,v])=>
      `<div class="why ${k==="X"?"bad":k==="O"?"warn":""}"><p style="font-size:13.5px"><b>${k===""?"blank":k==="*"?"★":k}</b> — ${esc(v)}</p></div>`).join("") +
    `<div class="hint">${esc(SEG.source)}, current as of ${esc(SEG.cfrDate)} (table v${esc(SEG.version)}).</div></div>`;
  return h;
}

/* ---------------- BOOT ---------------- */
window.addEventListener("online",  paintOffline);
window.addEventListener("offline", paintOffline);
/* the connection can drop between launches; re-check when the app comes back
   to the foreground, which is how a phone in a pocket behaves. The update
   check here is silent — it can surface that a new build exists, never act
   on it. A driver mid load build does not get reloaded out from under. */
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) return;
  readCacheMeta().then(paintOffline);
  checkForUpdate();
});

registerSW();
loadData();
</script>
